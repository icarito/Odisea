<!DOCTYPE html>
<html>
<head>
	<title>$GODOT_PROJECT_NAME</title>
	<meta charset="UTF-8">
	<style>
		* { margin: 0; padding: 0; }
		body { background: #000; overflow: hidden; }
		canvas { display: block; }

		#odisea-loading {
			position: fixed;
			inset: 0;
			background: #000000;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			font-family: system-ui, sans-serif;
			transition: opacity 0.5s linear;
			z-index: 10;
		}
		#odisea-loading.done { opacity: 0; pointer-events: none; }
		#odisea-title {
			color: #dddddd;
			font-size: 28px;
			font-weight: normal;
			margin-bottom: 24px;
		}
		#odisea-bar {
			width: 280px;
			height: 14px;
			border: 1px solid #445566;
		}
		#odisea-bar-fill {
			width: 0%;
			height: 100%;
			background: #aabbcc;
		}
		#odisea-lore {
			color: #667788;
			font-size: 13px;
			margin-top: 20px;
			min-height: 1.2em;
		}
		#odisea-links {
			position: absolute;
			bottom: 18px;
			width: 100%;
			text-align: center;
			color: #445566;
			font-size: 12px;
			line-height: 1.6;
		}
		#odisea-links a {
			color: #445566;
			text-decoration: none;
		}

		/* ETA hint shown inline under the bar while the download is slow
		   but still making progress. Quiet, on-theme, never alarming. */
		#odisea-eta {
			color: #7a8aa0;
			font-size: 12px;
			margin-top: 12px;
			min-height: 1.2em;
			opacity: 0;
			transition: opacity 0.4s linear;
		}
		#odisea-eta.visible { opacity: 1; }

		/* Corner toast: a small, opaque, on-theme alert anchored to a
		   corner. Used for slow-load warnings and for real errors. It never
		   covers the center of the screen and never relies on transparency
		   over the canvas (its own panel is fully opaque). */
		#odisea-toast {
			position: fixed;
			top: 16px;
			right: 16px;
			max-width: min(340px, calc(100vw - 32px));
			background: #0b1019;
			border: 1px solid #2a3650;
			border-left: 3px solid #c8a23c;
			border-radius: 4px;
			box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
			padding: 12px 14px;
			font-family: system-ui, sans-serif;
			z-index: 20;
			display: none;
			transform: translateY(-12px);
			opacity: 0;
			transition: opacity 0.3s linear, transform 0.3s ease-out;
		}
		#odisea-toast.visible {
			display: block;
			transform: translateY(0);
			opacity: 1;
		}
		#odisea-toast.error {
			border-left-color: #c0463c;
		}
		#odisea-toast-head {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 6px;
		}
		#odisea-toast-icon {
			flex: 0 0 auto;
			width: 18px;
			height: 18px;
			color: #c8a23c;
		}
		#odisea-toast.error #odisea-toast-icon { color: #d9685e; }
		#odisea-toast-title {
			color: #cfd7e3;
			font-size: 13px;
			font-weight: 600;
			letter-spacing: 0.02em;
		}
		#odisea-toast-msg {
			color: #93a0b4;
			font-size: 12px;
			line-height: 1.5;
			white-space: pre-line;
			word-break: break-word;
		}
		#odisea-toast-detail {
			color: #6b7488;
			font-size: 11px;
			line-height: 1.4;
			margin-top: 6px;
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			white-space: pre-wrap;
			word-break: break-word;
			max-height: 6em;
			overflow: auto;
		}
		#odisea-toast-foot {
			margin-top: 10px;
			display: none;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
		}
		#odisea-toast.error #odisea-toast-foot { display: flex; }
		#odisea-toast-foot a {
			color: #7f9bc7;
			text-decoration: none;
			font-size: 11px;
		}
		#odisea-toast-close {
			background: none;
			border: none;
			color: #56627a;
			font: inherit;
			font-size: 16px;
			line-height: 1;
			cursor: pointer;
			padding: 0 2px;
		}
		#odisea-toast-close:hover { color: #93a0b4; }
	</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
	<canvas id="canvas"></canvas>
	<div id="odisea-loading">
		<div id="odisea-title">ODiSEA</div>
		<div id="odisea-bar"><div id="odisea-bar-fill"></div></div>
		<div id="odisea-eta"></div>
		<div id="odisea-lore"></div>
		<div id="odisea-links">
			<a href="#" rel="noopener">icarito</a><br>
			<a href="https://odisea.educa.juegos" target="_blank" rel="noopener">odisea.educa.juegos</a>
		</div>
	</div>
	<div id="odisea-toast" role="status" aria-live="polite">
		<div id="odisea-toast-head">
			<svg id="odisea-toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
				<line x1="12" y1="9" x2="12" y2="13"/>
				<line x1="12" y1="17" x2="12.01" y2="17"/>
			</svg>
			<span id="odisea-toast-title">Señal débil</span>
			<button id="odisea-toast-close" type="button" aria-label="Cerrar" style="margin-left:auto">×</button>
		</div>
		<div id="odisea-toast-msg"></div>
		<div id="odisea-toast-detail"></div>
		<div id="odisea-toast-foot">
			<a href="https://github.com/icarito/Odisea/issues" target="_blank" rel="noopener">Reportar en github.com/icarito/Odisea/issues</a>
		</div>
	</div>
	<script src="$GODOT_URL"></script>
	<script>
(function() {
	var ORIENTATION_LOCK_TYPE = "landscape";
	var lastOrientationLockAttempt = 0;

	function lockOdiseaOrientation() {
		if (!screen.orientation || typeof screen.orientation.lock !== "function") return;
		if (document.visibilityState === "hidden") return;
		var now = Date.now();
		if (now - lastOrientationLockAttempt < 1000) return;
		lastOrientationLockAttempt = now;
		try {
			var result = screen.orientation.lock(ORIENTATION_LOCK_TYPE);
			if (result && typeof result.catch === "function") {
				result.catch(function() {});
			}
		} catch (e) {}
	}

	lockOdiseaOrientation();
	document.addEventListener("visibilitychange", function() {
		if (document.visibilityState === "visible") lockOdiseaOrientation();
	});
	window.addEventListener("focus", lockOdiseaOrientation);
	window.addEventListener("resize", lockOdiseaOrientation);
	window.addEventListener("orientationchange", lockOdiseaOrientation);
	document.addEventListener("click", lockOdiseaOrientation, { passive: true });
	document.addEventListener("touchend", lockOdiseaOrientation, { passive: true });
	document.addEventListener("keydown", lockOdiseaOrientation);

	// ================================================================
	// ANNAV2 WebSocket Bridge — uses a Web Worker to keep WebSocket
	// traffic off the main thread. Godot calls methods on
	// window.ANNAV2_WS_Bridge via JavaScript.eval().
	// ================================================================

	var workerCode = [
		"var ws = null;",
		"var pendingIncoming = [];",
		"self.onmessage = function(e) {",
		"  var msg = e.data;",
		"  switch (msg.cmd) {",
		"    case 'connect':",
		"      if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) { ws.close(); }",
		"      pendingIncoming.length = 0;",
		"      try { ws = new WebSocket(msg.url); } catch(err) { self.postMessage({cmd:'error',text:err.message}); self.postMessage({cmd:'state',state:3}); return; }",
		"      ws.binaryType = 'arraybuffer';",
		"      ws.onopen = function() { self.postMessage({cmd:'state',state:1}); };",
		"      ws.onclose = function(ev) { self.postMessage({cmd:'state',state:3}); ws = null; };",
		"      ws.onerror = function()  { self.postMessage({cmd:'state',state:3}); };",
		"      ws.onmessage = function(ev) {",
		"        var text = typeof ev.data === 'string' ? ev.data : new TextDecoder('utf-8').decode(new Uint8Array(ev.data));",
		"        pendingIncoming.push(text);",
		"      };",
		"      break;",
		"    case 'disconnect':",
		"      if (ws) { ws.close(); ws = null; }",
		"      pendingIncoming.length = 0;",
		"      self.postMessage({cmd:'state',state:3});",
		"      break;",
		"    case 'send':",
		"      if (ws && ws.readyState === WebSocket.OPEN) { ws.send(msg.text); }",
		"      break;",
		"    case 'poll':",
		"      var n = msg.max || 16;",
		"      self.postMessage({cmd:'pollResult', messages: pendingIncoming.splice(0, n)});",
		"      break;",
		"    case 'getState':",
		"      self.postMessage({cmd:'state', state: ws ? ws.readyState : 3});",
		"      break;",
		"  }",
		"};"
	].join("\n");

	var blob = new Blob([workerCode], { type: "application/javascript" });
	var workerUrl = URL.createObjectURL(blob);
	var worker = new Worker(workerUrl);

	// Queue for messages the bridge consumer (Godot) hasn't collected yet.
	var incomingQueue = [];
	var currentState = 3; // WebSocket.CLOSED

	worker.onmessage = function(e) {
		var msg = e.data;
		switch (msg.cmd) {
			case "pollResult":
				if (msg.messages && msg.messages.length) {
					incomingQueue.push.apply(incomingQueue, msg.messages);
				}
				break;
			case "state":
				currentState = msg.state;
				break;
			case "error":
				console.warn("[ANNAV2-Bridge] Worker error:", msg.text);
				break;
		}
	};

	window.ANNAV2_WS_Bridge = {
		/**
		 * Open a WebSocket connection (or reconnect).
		 * @param {string} url  e.g. "wss://35.182.238.36:5003/ws"
		 */
		connect: function(url) {
			incomingQueue.length = 0;
			currentState = 0; // CONNECTING
			worker.postMessage({ cmd: "connect", url: url });
		},

		/**
		 * Close the current WebSocket connection.
		 */
		disconnect: function() {
			worker.postMessage({ cmd: "disconnect" });
			incomingQueue.length = 0;
		},

		/**
		 * Send a text message over the WebSocket.
		 * @param {string} text  JSON string
		 */
		send: function(text) {
			worker.postMessage({ cmd: "send", text: text });
		},

		/**
		 * Tell the worker to flush its internal buffer into the bridge
		 * queue, then return all collected messages.
		 * @returns {string[]}  array of JSON strings from the server
		 */
		poll: function() {
			worker.postMessage({ cmd: "poll" });
			var out = incomingQueue.slice();
			incomingQueue.length = 0;
			return out || [];
		},

		/**
		 * Return the current readyState:
		 *   0 = CONNECTING, 1 = OPEN, 2 = CLOSING, 3 = CLOSED
		 */
		getState: function() {
			worker.postMessage({ cmd: "getState" });
			return currentState;
		},

		/**
		 * Return browser memory estimate (MB), or -1 if unavailable.
		 * Only Chromium exposes performance.memory.
		 */
		getBrowserMemMB: function() {
			if (typeof performance !== "undefined" && performance.memory &&
				typeof performance.memory.usedJSHeapSize === "number") {
				return performance.memory.usedJSHeapSize / (1024 * 1024);
			}
			return -1;
		}
	};

	console.log("[ANNAV2-Bridge] Worker installed. Use window.ANNAV2_WS_Bridge.{connect,disconnect,send,poll,getState,getBrowserMemMB}");
})();
	</script>
	<script>
		// ================================================================
		// Remote Asset Loader with Local Fallback
		// Loads .pck and .wasm from GitHub Pages to save Netlify bandwidth.
		// Falls back to local files if GitHub Pages is unreachable.
		// ================================================================
		(function() {
			var originalFetch = window.fetch;
			var PAGES_BASE = "https://icarito.github.io/Odisea";

			window.fetch = function(resource, init) {
				if (typeof resource !== 'string' || resource.startsWith('http') || resource.startsWith('blob:')) {
					return originalFetch(resource, init);
				}

				var isPck = resource.indexOf('.pck') !== -1;
				var isWasm = resource.indexOf('.wasm') !== -1;

				// Cross-origin isolation gate. The threaded engine wasm needs
				// SharedArrayBuffer, which requires crossOriginIsolated. Safari does
				// not isolate under COEP: credentialless, so SAB is missing there.
				// When isolation is absent we serve a no-threads engine wasm from the
				// SAME ORIGIN (Netlify) instead of the threaded build on GitHub Pages.
				// The .pck is identical for both engines, so only the wasm switches.
				var isolated = (typeof SharedArrayBuffer !== "undefined") && !!window.crossOriginIsolated;

			if (isPck || (isWasm && isolated)) {
				var filename = resource.split('/').pop();
				var remoteUrl = isWasm
					? PAGES_BASE + "/threads/" + filename
					: PAGES_BASE + "/" + filename;
				var assetType = isPck ? "PCK" : "WASM";

					console.log("[" + assetType + "] Attempting GitHub Pages:", remoteUrl);
					return originalFetch(remoteUrl, init).then(function(response) {
						if (response.ok) {
							console.log("[" + assetType + "] Loaded from GitHub Pages.");
							return response;
						}
						throw new Error("GitHub Pages returned " + response.status);
					}).catch(function(err) {
						console.warn("[" + assetType + "] GitHub Pages failed, falling back to local:", resource, err);
						return originalFetch(resource, init);
					});
				}

				// Not isolated + wasm requested: serve the no-threads engine from
				// GitHub Pages (/no_threads/), not the threaded /threads/ build that
				// needs SharedArrayBuffer. Without isolation this is a plain CORS
				// fetch — Pages' Access-Control-Allow-Origin: * covers it. Falls back
				// to the local copy if Pages is unreachable.
				if (isWasm && !isolated) {
					var filename = resource.split('/').pop();
					var noThreadsUrl = PAGES_BASE + "/no_threads/" + filename;
					console.log("[WASM] No cross-origin isolation; loading no-threads engine:", noThreadsUrl);
					return originalFetch(noThreadsUrl, init).then(function(response) {
						if (response.ok) return response;
						throw new Error("GitHub Pages returned " + response.status);
					}).catch(function(err) {
						console.warn("[WASM] No-threads wasm fetch failed, falling back to local:", err);
						return originalFetch(resource, init);
					});
				}

				return originalFetch(resource, init);
			};
		})();

		// ================================================================
		// Loading screen: raw progress + rotating lore lines, then a
		// 0.5s fade-out once the engine takes over. Reports loader_start /
		// engine_start to the bridge (fire and forget) and shows a popup
		// on load errors or after a 90s watchdog.
		// ================================================================
		var loadingEl = document.getElementById("odisea-loading");
		var barFillEl = document.getElementById("odisea-bar-fill");
		var loreEl = document.getElementById("odisea-lore");
		var etaEl = document.getElementById("odisea-eta");
		var toastEl = document.getElementById("odisea-toast");
		var toastTitleEl = document.getElementById("odisea-toast-title");
		var toastMsgEl = document.getElementById("odisea-toast-msg");
		var toastDetailEl = document.getElementById("odisea-toast-detail");

		// --- Telemetry (fire and forget, must never block the load) ---
		var TELEMETRY_ENDPOINTS = [
			"https://odisea.educa.juegos:5003/telemetry",
			"https://odisea.educa.juegos/telemetry"
		];
		var sessionId = (function() {
			try {
				var buf = new Uint32Array(2);
				crypto.getRandomValues(buf);
				return Date.now().toString(36) + "-" + buf[0].toString(36) + buf[1].toString(36);
			} catch (e) {
				return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
			}
		})();
		var loaderStartMs = Date.now();
		var engineStarted = false;

		function sendMetric(payload, endpointIndex) {
			endpointIndex = endpointIndex || 0;
			if (endpointIndex >= TELEMETRY_ENDPOINTS.length) return;
			try {
				fetch(TELEMETRY_ENDPOINTS[endpointIndex], {
					method: "POST",
					mode: "no-cors",
					keepalive: true,
					body: JSON.stringify(payload)
				}).catch(function() {
					sendMetric(payload, endpointIndex + 1);
				});
			} catch (e) { /* never block the load */ }
		}

		sendMetric({
			event: "loader_start",
			ts: loaderStartMs,
			ua: navigator.userAgent,
			session_id: sessionId
		});

		// Called by Godot (JavaScript.eval) when the boot transition finishes
		// and the player gains control in the first scene.
		var playerReleasedSent = false;
		window.OdiseaShell = {
			playerReleased: function() {
				if (playerReleasedSent) return;
				playerReleasedSent = true;
				sendMetric({
					event: "player_released",
					ts: Date.now(),
					session_id: sessionId,
					total_ms: Date.now() - loaderStartMs
				});
			},
			pendingRunbin: null
		};

		// --- Corner toast (slow-load hint / real error) ----------------
		// Two states, never the old full-screen transparent popup:
		//   * "slow"  — quiet amber alert, download still breathing.
		//   * "error" — red alert with the real error string + report link.
		// The toast lives in a corner; the load keeps going behind it.
		var toastState = null; // null | "slow" | "error"

		function showToast(kind, title, message, detail) {
			// An error always wins over a slow hint, but once we're showing
			// an error we don't downgrade back to slow.
			if (engineStarted) return;
			if (toastState === "error" && kind !== "error") return;
			toastState = kind;
			toastEl.classList.toggle("error", kind === "error");
			toastTitleEl.textContent = title;
			toastMsgEl.textContent = message || "";
			if (detail) {
				toastDetailEl.textContent = detail;
				toastDetailEl.style.display = "block";
			} else {
				toastDetailEl.textContent = "";
				toastDetailEl.style.display = "none";
			}
			toastEl.classList.add("visible");
		}

		function hideToast() {
			toastEl.classList.remove("visible");
		}

		// Turn an arbitrary throwable / event into a short real string so the
		// player sees what actually failed, not a generic "algo salió mal".
		function describeError(err) {
			if (!err) return "";
			if (typeof err === "string") return err;
			if (err.message) return String(err.message);
			if (err.reason) return describeError(err.reason);
			if (err.error) return describeError(err.error);
			try { return String(err); } catch (e) { return "Error desconocido"; }
		}

		function showErrorToast(detail) {
			showToast(
				"error",
				"Fallo de carga",
				"Odisea no pudo iniciar.",
				detail || ""
			);
		}

		document.getElementById("odisea-toast-close").addEventListener("click", hideToast);

		// Global handlers are NON-FATAL. A stray window.error or rejected promise
		// (telemetry, a worker warning, a missing SharedArrayBuffer probe) must not
		// declare the load dead — the engine may still boot, or already has. The only
		// authoritative "load failed" signals are bootEngine().catch (engine refused
		// to start) and the stall watchdog (bytes stopped). So here we only log.
		window.addEventListener("error", function(ev) {
			console.warn("[ODiSEA] Non-fatal error:", describeError(ev && (ev.error || ev.message)));
		});
		window.addEventListener("unhandledrejection", function(ev) {
			console.warn("[ODiSEA] Non-fatal rejection:", describeError(ev && ev.reason));
		});

		var lorePhrases = [
			"La nave tiene 8 kilómetros de eslora.",
			"Último reporte de tripulación: hace 11 meses.",
			"49,000 colonos duermen a bordo.",
			"Odisea IA te observa.",
			"Confía en mí, Elías.",
			"Tu destino es conocido.",
			"Protocolo Arca activo."
		];
		var loreIndex = Math.floor(Math.random() * lorePhrases.length);
		loreEl.textContent = lorePhrases[loreIndex];
		var loreTimer = setInterval(function() {
			loreIndex = (loreIndex + 1) % lorePhrases.length;
			loreEl.textContent = lorePhrases[loreIndex];
		}, 3000);

		// Real download size (pck + wasm), injected by the deploy workflow.
		// The engine's own total comes from fileSizes at export time, which can
		// drift from what we actually serve (e.g. the GitHub Pages copy).
		// If the token is not replaced, this resolves to 0 and is ignored.
		var EXPECTED_TOTAL_BYTES = Number("$ODISEA_TOTAL_BYTES".replace(/[^0-9]/g, "")) || 0;

		// --- Download progress / ETA / stall detection -----------------
		// Drives three outcomes off the real byte stream:
		//   * compute a moving-average speed and ETA;
		//   * raise a quiet "slow" toast if we're clearly dragging but the
		//     bytes keep climbing;
		//   * raise a real "error" toast only when the bytes have been
		//     frozen for STALL_MS — i.e. the download actually died.
		var STALL_MS = 20000;          // bytes frozen this long => real error
		var SLOW_HINT_MS = 12000;      // still moving but slow => quiet hint
		var lastBytes = 0;
		var lastBytesTs = loaderStartMs;   // last time bytes increased
		var lastProgressTs = 0;            // last onProgress call at all
		var speedBps = 0;                  // smoothed bytes/sec

		function fmtEta(seconds) {
			if (!isFinite(seconds) || seconds <= 0) return "";
			seconds = Math.ceil(seconds);
			if (seconds < 60) return "~" + seconds + " s";
			var m = Math.floor(seconds / 60);
			var s = seconds % 60;
			return "~" + m + " min" + (s ? " " + s + " s" : "");
		}

		function recordProgress(current, total) {
			var now = Date.now();
			if (current > lastBytes) {
				var dt = (now - lastBytesTs) / 1000;
				if (dt > 0) {
					var inst = (current - lastBytes) / dt;
					// Exponential moving average to smooth bursty chunks.
					speedBps = speedBps > 0 ? (speedBps * 0.7 + inst * 0.3) : inst;
				}
				lastBytes = current;
				lastBytesTs = now;
			}
			lastProgressTs = now;

			var t = (total > 0 && total >= current) ? total : EXPECTED_TOTAL_BYTES;
			var remaining = t > 0 ? Math.max(0, t - current) : 0;
			var eta = (remaining > 0 && speedBps > 0) ? remaining / speedBps : 0;
			var etaStr = fmtEta(eta);
			var elapsed = now - loaderStartMs;

			// Show a quiet ETA line once we're past the slow-hint threshold
			// and we actually have an estimate.
			if (etaStr && elapsed > SLOW_HINT_MS) {
				etaEl.textContent = "Conexión lenta — tiempo restante " + etaStr;
				etaEl.classList.add("visible");
			}
		}

		// Independent of onProgress firing: a frozen byte counter is the real
		// failure signal. Poll the gap since bytes last moved.
		var stallTimer = setInterval(function() {
			if (engineStarted) { clearInterval(stallTimer); return; }
			var now = Date.now();
			var sinceProgress = now - lastBytesTs;
			var started = lastProgressTs > 0;

			// Never downloaded a single byte after a while, or bytes frozen
			// mid-flight past STALL_MS => declare a real, surfaced error.
			if (sinceProgress >= STALL_MS) {
				var pct = (lastBytes > 0)
					? " (" + (lastBytes / (1024 * 1024)).toFixed(1) + " MB descargados)"
					: "";
				showToast(
					"error",
					"Descarga interrumpida",
					"La descarga se detuvo y no avanza.",
					started
						? "Sin datos nuevos hace " + Math.round(sinceProgress / 1000) + " s" + pct +
						  ".\nRevise su conexión y recargue la página."
						: "No se recibieron datos del servidor.\nRevise su conexión y recargue la página."
				);
				etaEl.classList.remove("visible");
			}
		}, 2000);

		function onEngineStarted() {
			if (engineStarted) return;
			engineStarted = true;
			clearInterval(stallTimer);
			hideToast();
			etaEl.classList.remove("visible");
			sendMetric({
				event: "engine_start",
				ts: Date.now(),
				session_id: sessionId,
				load_ms: Date.now() - loaderStartMs
			});
			barFillEl.style.width = "100%";
			clearInterval(loreTimer);
			loadingEl.classList.add("done");
			setTimeout(function() {
				if (loadingEl.parentNode) {
					loadingEl.parentNode.removeChild(loadingEl);
				}
			}, 600);
		}

		var engineConfig = $GODOT_CONFIG;
		var params = new URLSearchParams(window.location.search);
		var runbinUrl = params.get('runbin');

		// --- iOS/Safari redirect to the cross-origin-isolated Vercel deploy -------
		// Safari can't run the threaded engine here: COEP credentialless gives no
		// SharedArrayBuffer. The Vercel deploy serves everything same-origin with
		// COEP require-corp, so Safari IS isolated there and runs threaded. Send
		// iOS/iPadOS devices there before booting. Guards against a redirect loop
		// (skip if already on the Vercel host) and honors ?nethr=1 to opt out.
		var ODISEA_VERCEL_HOST = "odisea-ios.vercel.app";
		(function maybeRedirectIOS() {
			if (params.get("nothr") === "1") return;
			if (location.hostname === ODISEA_VERCEL_HOST) return;
			var ua = navigator.userAgent || "";
			var isIOS = /iPad|iPhone|iPod/.test(ua);
			// iPadOS 13+ reports as desktop Safari; detect via touch + Mac.
			var isIPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
			if (!isIOS && !isIPadOS) return;
			var target = location.protocol + "//" + ODISEA_VERCEL_HOST + location.pathname + location.search;
			console.log("[ODiSEA] iOS detected; redirecting to isolated build:", target);
			location.replace(target);
		})();

		// Cross-origin isolation gate (same check the fetch interceptor uses to
		// pick the wasm). When absent, SharedArrayBuffer is unavailable: we load
		// the no-threads engine and warn the player about reduced performance.
		var pageIsolated = (typeof SharedArrayBuffer !== "undefined") && !!window.crossOriginIsolated;

		// Dismissable, non-blocking banner. Distinct from the fatal toast: the
		// game keeps loading/playing behind it. Shown only when not isolated.
		function showDegradedOverlay() {
			if (document.getElementById("odisea-degraded")) return;
			var el = document.createElement("div");
			el.id = "odisea-degraded";
			el.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);" +
				"max-width:90%;z-index:9999;background:rgba(30,30,40,0.95);color:#f0e6c0;" +
				"border:1px solid #6a5a30;border-radius:8px;padding:10px 14px;font:13px/1.4 sans-serif;" +
				"box-shadow:0 4px 16px rgba(0,0,0,0.5);display:flex;align-items:center;gap:12px;";
			var msg = document.createElement("span");
			msg.textContent = "Tu navegador no permite el modo de alto rendimiento. " +
				"Odisea funcionará con rendimiento reducido.";
			var btn = document.createElement("button");
			btn.textContent = "Entendido";
			btn.style.cssText = "background:#6a5a30;color:#fff;border:0;border-radius:5px;" +
				"padding:5px 10px;cursor:pointer;font:13px sans-serif;flex-shrink:0;";
			btn.addEventListener("click", function() {
				if (el.parentNode) el.parentNode.removeChild(el);
			});
			el.appendChild(msg);
			el.appendChild(btn);
			document.body.appendChild(el);
		}

		function bootEngine() {
			if (!pageIsolated) {
				console.warn("[ODiSEA] No cross-origin isolation; booting no-threads engine (degraded performance).");
				showDegradedOverlay();
			}
			var engine = new Engine(engineConfig);
			engine.startGame({
				onProgress: function(current, total) {
					var t = (total > 0 && total >= current) ? total : EXPECTED_TOTAL_BYTES;
					if (t > 0) {
						barFillEl.style.width = Math.min(100, current / t * 100).toFixed(1) + "%";
					}
					recordProgress(current, total);
				},
				onComplete: onEngineStarted
			}).then(onEngineStarted).catch(function(err) {
				clearInterval(loreTimer);
				clearInterval(stallTimer);
				loreEl.textContent = "Error al cargar. Recarga la página.";
				console.error("[ODiSEA] Engine start failed:", err);
				showErrorToast(describeError(err) || "El motor no pudo iniciar.");
			});
		}

		if (runbinUrl) {
			console.log("[ODiSEA] Runbin mode detected:", runbinUrl);
			loreEl.textContent = "Descargando captura de rendimiento...";
			
			// Override start scene and add replay-file argument
			engineConfig.args = engineConfig.args || [];
			engineConfig.args.push("--scene", "res://core_v2/tools/HotzonePlayer.tscn");
			engineConfig.args.push("--replay-file", "user://hotzones/remote.bin");

			fetch(runbinUrl)
				.then(function(response) {
					if (!response.ok) throw new Error("HTTP " + response.status);
					return response.arrayBuffer();
				})
				.then(function(buffer) {
					// Godot 3's JavaScript.get_interface() cannot marshal a raw
					// ArrayBuffer into a PoolByteArray, so hand the bytes to GDScript
					// as a base64 string (decoded there with Marshalls.base64_to_raw).
					var bytes = new Uint8Array(buffer);
					var binary = "";
					var CHUNK = 0x8000; // avoid arg-count limits on String.fromCharCode
					for (var i = 0; i < bytes.length; i += CHUNK) {
						binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
					}
					window.OdiseaShell.pendingRunbin = btoa(binary);
					bootEngine();
				})
				.catch(function(err) {
					console.error("[ODiSEA] Failed to fetch runbin:", err);
					loreEl.textContent = "Error descargando captura. Iniciando normalmente...";
					setTimeout(bootEngine, 2000);
				});
		} else {
			bootEngine();
		}
	</script>
</body>
</html>
