[tool.pytest.ini_options]
addopts = "-v -s"
testpaths = ["tests", "core_v2/tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "oys: Odyssey Script Tests",
    "odisea_gdunit: Tests executed by the gdunit-compatible pytest runner.",
    "odisea_raw_oys: Tests executed by the raw OYS/json pytest runner.",
]
