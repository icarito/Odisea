; odisea-lowend-cfg (FD-299)
; Ajustes de ARRANQUE para handhelds lentos de la generacion RK3326 (Mali-G31, 1 GB).
; Odisea.sh lo copia a override.cfg solo en esos dispositivos; en el resto no se usa.
; Lo que puede decidirse en runtime (fisica a 30 Hz, presupuestos, animator) lo aplica el
; tier LOW de GLES3VendorGate, no este archivo.
; FRT expone el feature tag "mobile": las claves .mobile son las que ganan sobre project.godot.
; Medido en Anbernic RG351V — ver docs/handoff/anbernic-lowend/README.md

[rendering]

quality/filters/msaa=0
quality/filters/use_fxaa=false
quality/intended_usage/framebuffer_allocation.mobile=3
quality/shadow_atlas/size.mobile=1024
quality/directional_shadow/size.mobile=1024
quality/shadows/filter_mode.mobile=0
quality/shading/force_vertex_shading.mobile=true
quality/shading/force_lambert_over_burley.mobile=true
quality/shading/force_blinn_over_ggx.mobile=true
quality/filters/anisotropic_filter_level=0
limits/rendering/max_lights_per_object=4
quality/reflections/texture_array_reflections.mobile=false
