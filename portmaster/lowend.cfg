; odisea-lowend-cfg (FD-299)
; Ajustes de ARRANQUE para handhelds lentos de la generacion RK3326 (Mali-G31, 1 GB).
; Odisea.sh lo copia a override.cfg solo en esos dispositivos; en el resto no se usa.
; Lo que puede decidirse en runtime (fisica a 30 Hz, presupuestos, animator) lo aplica el
; tier LOW de GLES3VendorGate, no este archivo.
; FRT expone el feature tag "mobile": las claves .mobile son las que ganan sobre project.godot.
; Medido en Anbernic RG351V — ver docs/handoff/anbernic-lowend/README.md

[rendering]

quality/filters/msaa=0
quality/filters/use_fxaa=false
quality/intended_usage/framebuffer_allocation.mobile=3
quality/shadow_atlas/size.mobile=1024
quality/directional_shadow/size.mobile=1024
quality/shadows/filter_mode.mobile=0
quality/shading/force_vertex_shading.mobile=true
quality/shading/force_lambert_over_burley.mobile=true
quality/shading/force_blinn_over_ggx.mobile=true
quality/filters/anisotropic_filter_level=0
limits/rendering/max_lights_per_object=8
quality/reflections/texture_array_reflections.mobile=false

[physics]

; Godot 3.6 ya trae interpolacion 3D de fisica. Con fisica a 30 Hz y render a ~24-30,
; el transform del player/camara/plataformas se muestrea en cada frame de render en
; vez de escalonar al ritmo de la fisica. La animacion esqueletica va por AnimationTree
; en IDLE (PilotAnimatorV2), asi que tambien se actualiza por frame.
common/physics_interpolation=true

[debug]

; El setting arriba esta pensado para que el juego llame reset_physics_interpolation()
; en teleports/spawns; mientras lo armamos, silenciamos el spam de warnings.
settings/physics_interpolation/enable_warnings=false

[audio]

; FD-299: medido en la RG351V. El grafo PipeWire de ROCKNIX corre a 48000 y el juego
; mezclaba a 44100, asi que PipeWire resampleaba en cada callback: pipewire-pulse ~25% y
; pipewire ~14% de un core, contra ~129% del juego. Igualar mix_rate al grafo evita el
; resampleo; 40 ms de output_latency baja la frecuencia de callbacks; y el mute por
; silencio/pausa (PR #63458 del fork: AudioServer.set_enabled) apaga el stream y el hilo
; de audio cuando no suena. Solo viaja en la generacion RK3326 (override.cfg).
mix_rate=48000
output_latency=40
muting/mute_on_pause=true
muting/mute_on_silence=true
