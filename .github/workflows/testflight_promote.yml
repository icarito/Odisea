name: Promote approved TestFlight builds

# Único camino de distribución a TestFlight. El export solo SUBE el build (IPA
# desde la pata iOS, .pkg desde upload-macos); pedir la revisión y mover el build
# a los grupos externos pasa acá. Antes eso era un job del export
# (testflight-external) que esperaba hasta 60 min a que Apple procesara el build
# y dejaba el run entero abierto mientras tanto, para un trabajo que igual tenía
# que retomar este cron: la Beta App Review tarda horas, no minutos.
#
# `--promote` recorre los builds VALID más nuevos por plataforma, contesta el
# cuestionario de exportación si falta, pide la revisión del más nuevo y publica
# al grupo externo el aprobado más nuevo. Es idempotente: correrlo cada 30 min no
# duplica nada y toma el build recién subido en la corrida siguiente.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  promote:
    if: ${{ github.repository == 'icarito/Odisea' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Promote newly-approved builds to external TestFlight groups
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          BUNDLE_ID: juegos.educa.odisea
          PLATFORMS: IOS,MAC_OS
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_API_KEY_P8" ]; then
            echo "App Store Connect secrets missing — skipping TestFlight promotion."
            exit 0
          fi
          pip install --quiet "pyjwt[crypto]"
          python3 scripts/testflight_distribute.py --promote
