name: GDUnit3 Tests
on: [push]


jobs:
  unit-test:
    name: Run GDUnit3 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        uses: actions/cache@v4
        with:
          path: ~/.godot/projects/odisea-project-cache
          key: ${{ runner.os }}-godot-${{ hashFiles('**/project.godot') }}
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Download Godot headless (no X11)
        run: |
          echo "Downloading Godot headless to run imports and tests (no X11)"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip"
          curl -L "$GODOT_URL" -o godot_headless.zip
          unzip -q godot_headless.zip -d godot-headless
          chmod +x godot-headless/* || true
          echo "GODOT_BIN=$(pwd)/godot-headless/Godot_v3.6.2-stable_linux_headless.64" >> $GITHUB_ENV

      - name: Import Godot project resources
        run: |
          "$GODOT_BIN" --path . -e --quit --headless || true

      - name: Run GDUnit3 Tests
        run: |
          ./runtest.sh -a res://tests

      # Omitido: Mostrar log completo para reducir ruido

      - name: Annotate first FAILED Report block (experimental)
        if: always()
        run: |
          LOG=reports/gdunit_runner.log
          if [ ! -f "$LOG" ]; then exit 0; fi
          # Limpiar ANSI y extraer solo el primer bloque Report: tras un FAILED, todo en una línea
          awk '/FAILED/ {failed=1} /Report:/ {if (failed) {print; r=1; failed=0; next}} r && !/^(PASSED|FAILED|SKIPPED|Run Test|Run Test Suite)/ {print} /^(PASSED|FAILED|SKIPPED|Run Test|Run Test Suite)/ {if (r) exit; r=0}' "$LOG" | \
            sed 's/\x1b\[[0-9;]*m//g' | \
            paste -sd' ' - | \
            sed -e 's/%/%25/g' -e 's/\r/%0D/g' > /tmp/_reporte_oneline.txt
          if [ -s /tmp/_reporte_oneline.txt ]; then
            esc=$(cat /tmp/_reporte_oneline.txt)
            echo "::error title=GDUnit Failure::$esc"
          fi

      # Omitido: Anotación de reporte de determinismo para simplificar

      - name: Annotate GDUnit test results and warnings
        if: always()
        run: |
          LOG=reports/gdunit_runner.log
          if [ ! -f "$LOG" ]; then
            exit 0
          fi
          # Procesar cada bloque de test (Run Test ... hasta la siguiente Run Test o EOF)
          # Separar bloques de test robustamente, incluso con líneas vacías
          escape_github_annotation() {
            sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g'
          }
          awk 'BEGIN{blk=""} \
            /^\s*Run Test: /{if(blk!=""){print blk "\x1e"}; blk=$0 "\n"; next} \
            /^[[:space:]]*$/ {blk=blk $0 "\n"; next} \
            {blk=blk $0 "\n"} \
            END{if(blk!=""){print blk "\x1e"}}' "$LOG" | \
          awk -v RS='\x1e' '{if(length($0)>10) print $0}' | \
          while IFS= read -r -d $'\x1e' BLOCK; do
            clean_block=$(echo "$BLOCK" | sed 's/\x1b\[[0-9;]*m//g')
            # Extraer el bloque Report: si existe
            REPORT=$(echo "$clean_block" | awk '/Report:/{flag=1; next} flag && !/^(PASSED|FAILED|SKIPPED|Run Test|Run Test Suite)/ {print; next} flag {exit}')
            # Debug opcional:
            # echo "==== DEBUG ===="
            # echo "$REPORT"
            # echo "==============="
            if echo "$clean_block" | grep -q ':FAILED'; then
              if [ -n "$REPORT" ] && [ $(echo "$REPORT" | grep -c '^') -gt 1 ]; then
                esc=$(printf '%s' "$REPORT" | escape_github_annotation)
                echo "::error title=GDUnit Failure::$esc"
              else
                esc=$(printf '%s' "$clean_block" | escape_github_annotation)
                echo "::error title=GDUnit Failure::$esc"
              fi
            elif echo "$clean_block" | grep -q 'WARNING:'; then
              if [ -n "$REPORT" ] && [ $(echo "$REPORT" | grep -c '^') -gt 1 ]; then
                esc=$(printf '%s' "$REPORT" | escape_github_annotation)
                echo "::notice title=GDUnit Warning::$esc"
              else
                esc=$(printf '%s' "$clean_block" | escape_github_annotation)
                echo "::notice title=GDUnit Warning::$esc"
              fi
            fi
          done

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-logs
          path: reports/