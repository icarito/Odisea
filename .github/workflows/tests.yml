name: GDUnit3 Tests Optimized
on: [push]

jobs:
  unit-test:
    name: Run GDUnit3 Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        uses: actions/cache@v4
        with:
          path: ~/.godot/projects/odisea-project-cache
          key: ${{ runner.os }}-godot-${{ hashFiles('**/project.godot') }}

      - name: Download Godot 3.6.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip
          unzip Godot_v3.6.2-stable_linux_headless.64.zip
          mv Godot_v3.6.2-stable_linux_headless.64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Import Resources
        run: godot --path . -e --quit --headless || true

      - name: Run GDUnit3 Tests
        env:
          GODOT_BIN: /usr/local/bin/godot
        # Pedir salida JUnit (-r junit) para que se genere XML
        run: |
          chmod +x ./runtest.sh
          xvfb-run ./runtest.sh -a res://core_v2/tests

      - name: Annotate DRIFT_CHECK
        if: always()
        run: |
          LOG="reports/gdunit_runner.log"
          # Buscar líneas DRIFT_CHECK en el log y convertirlas en anotaciones
          if [ -f "$LOG" ] && grep -q "DRIFT_CHECK:" "$LOG"; then
            grep "DRIFT_CHECK:" "$LOG" | while IFS= read -r line; do
              # Emitir como warning para que aparezca en la UI de Actions
              echo "::warning title=DRIFT_CHECK::$line"
            done
          else
            echo "No DRIFT_CHECK found in $LOG"
          fi

      - name: Publish Test Report
        # Esta acción reemplaza todos tus scripts de awk/sed
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/reports/*.xml'

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-results
          path: reports/