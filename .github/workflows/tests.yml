name: GDUnit3 Tests
on: [push]

jobs:
  unit-test:
    name: Run GDUnit3 Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        uses: actions/cache@v4
        with:
          path: ~/.godot/projects/odisea-project-cache
          key: ${{ runner.os }}-godot-${{ hashFiles('**/project.godot') }}

      - name: Download Godot 3.6.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip
          unzip Godot_v3.6.2-stable_linux_headless.64.zip
          mv Godot_v3.6.2-stable_linux_headless.64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Import Resources
        run: godot --path . -e --quit --headless || true

      - name: Run GDUnit3 Tests
        env:
          GODOT_BIN: /usr/local/bin/godot
        run: |
          chmod +x ./runtest.sh
          xvfb-run ./runtest.sh -a res://core_v2/tests

      - name: Annotate DRIFT_CHECK and Summary
        if: always()
        run: |
          LOG="reports/gdunit_runner.log"
          if [ -f "$LOG" ]; then
            echo "### 🔍 Drift Analysis" >> $GITHUB_STEP_SUMMARY
            # Extraer líneas de drift al resumen de la página
            grep "DRIFT_CHECK:" "$LOG" >> $GITHUB_STEP_SUMMARY || echo "No drift data found" >> $GITHUB_STEP_SUMMARY
            
            # Crear anotaciones de aviso (amarillas) en el log de la línea de tiempo
            grep "DRIFT_CHECK:" "$LOG" | while read -r line; do
              echo "::warning title=Determinism Drift::$line"
            done
          fi

      - name: Publish Test Report to Summary
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/reports/*.xml'
          detailed_summary: true
          include_passed: true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-results
          path: reports/