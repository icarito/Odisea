name: GDUnit3 Tests
on: [push]


jobs:
  unit-test:
    name: Run GDUnit3 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        uses: actions/cache@v4
        with:
          path: ~/.godot/projects/odisea-project-cache
          key: ${{ runner.os }}-godot-${{ hashFiles('**/project.godot') }}
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Download Godot headless (no X11)
        run: |
          echo "Downloading Godot headless to run imports and tests (no X11)"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip"
          curl -L "$GODOT_URL" -o godot_headless.zip
          unzip -q godot_headless.zip -d godot-headless
          chmod +x godot-headless/* || true
          echo "GODOT_BIN=$(pwd)/godot-headless/Godot_v3.6.2-stable_linux_headless.64" >> $GITHUB_ENV

      - name: Import Godot project resources
        run: |
          echo "Importing Godot project resources (generate .import) using $GODOT_BIN"
          "$GODOT_BIN" --path . -e --quit --headless || true
          echo "List .import (if any):" && ls -la .import || true

      - name: Run GDUnit3 Tests
        run: |
          # Tu script runtest.sh espera la variable GODOT_BIN (ahora proveniente de GITHUB_ENV).
          echo "Working dir: $(pwd)"
          echo "GODOT_BIN=$GODOT_BIN"
          echo "List candidate tests directory:" && ls -la tests || true
          ./runtest.sh -a res://tests

      - name: Show GdUnit runner log (if present)
        if: always()
        run: |
          if [ -f reports/gdunit_runner.log ]; then
            echo "--- BEGIN gdunit_runner.log ---"
            sed -n '1,400p' reports/gdunit_runner.log || true
            echo "--- END gdunit_runner.log ---"
          else
            echo "No gdunit_runner.log present."
          fi

      - name: Annotate determinism drift (if present)
        if: always()
        run: |
          # Buscar el bloque del reporte de determinismo en el log y crear una annotation
          if [ -f reports/gdunit_runner.log ]; then
            REPORT=$(awk 'BEGIN{found=0} /--- REPORTE DE DETERMINISMO ---/{found=1} found{print}' reports/gdunit_runner.log | sed '/^$/q')
            if [ -n "$REPORT" ]; then
              # Escape special chars for workflow command
              esc=$(printf '%s' "$REPORT" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              # Emitir annotation as error so it appears in Checks UI (won't change exit code here)
              echo "::error title=Determinism Report::$esc"
            else
              echo "No determinism report found in gdunit log."
            fi
          else
            echo "No gdunit_runner.log present to annotate."
          fi

      - name: Annotate individual GDUnit failures
        if: always()
        run: |
          # Parse the gdunit runner log and create an annotation per failed test
          LOG=reports/gdunit_runner.log
          if [ ! -f "$LOG" ]; then
            echo "No gdunit_runner.log found, skipping failure annotations."
            exit 0
          fi
          # For each 'Run Test: <suite> > <test> :FAILED' line, grab context lines and annotate
          grep -n "Run Test: .*:FAILED" "$LOG" || true | while IFS=: read -r LN LINE; do
            CONTEXT=$(sed -n "${LN},$((LN+12))p" "$LOG")
            # escape for workflow command
            esc=$(printf '%s' "$CONTEXT" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=GDUnit Failure::$esc"
          done

      - name: Annotate overall test summary
        if: always()
        run: |
          LOG=reports/gdunit_runner.log
          if [ -f "$LOG" ]; then
            # extract summary lines
            SUMMARY=$(awk '/Total test suites:/,/Exit code:/' "$LOG" | sed -n '1,80p')
            if [ -n "$SUMMARY" ]; then
              esc=$(printf '%s' "$SUMMARY" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              # use notice so it doesn't mark checks as errored (failed tests already shown)
              echo "::notice title=GDUnit Summary::$esc"
            fi
          fi

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-logs
          path: reports/