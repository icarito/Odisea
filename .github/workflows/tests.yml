name: GDUnit3 Tests
on: [push, pull_request]


jobs:
  unit-test:
    name: Run GDUnit3 Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:3.6.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        uses: actions/cache@v4
        with:
          path: ~/.godot/projects/odisea-project-cache
          key: ${{ runner.os }}-godot-${{ hashFiles('**/project.godot') }}
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Import Godot project resources
        run: |
          echo "Importing Godot project resources (generate .import)"
          # Ejecutar Godot sin script para forzar la importación de recursos
          godot --path . -e --quit --headless || true
          echo "List .import (if any):" && ls -la .import || true

      - name: Run GDUnit3 Tests
        run: |
          # Tu script runtest.sh espera la variable GODOT_BIN.
          # Pasamos la ruta de recursos de Godot para que GdUnit encuentre las suites: 'res://tests'
          echo "Working dir: $(pwd)"
          echo "List candidate tests directory:" && ls -la tests || true
          GODOT_BIN=godot ./runtest.sh -a res://tests

      - name: Show GdUnit runner log (if present)
        if: always()
        run: |
          if [ -f reports/gdunit_runner.log ]; then
            echo "--- BEGIN gdunit_runner.log ---"
            sed -n '1,400p' reports/gdunit_runner.log || true
            echo "--- END gdunit_runner.log ---"
          else
            echo "No gdunit_runner.log present."
          fi

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-logs
          path: reports/