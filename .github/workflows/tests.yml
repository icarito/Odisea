name: GDUnit3 Tests
on: [push, pull_request]


jobs:
  unit-test:
    name: Run GDUnit3 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        uses: actions/cache@v4
        with:
          path: ~/.godot/projects/odisea-project-cache
          key: ${{ runner.os }}-godot-${{ hashFiles('**/project.godot') }}
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Download Godot editor (to ensure importers are available)
        run: |
          echo "Downloading Godot editor to run imports and tests"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_x11.64.zip"
          curl -L "$GODOT_URL" -o godot_editor.zip
          unzip -q godot_editor.zip -d godot-editor
          chmod +x godot-editor/* || true
          echo "GODOT_BIN=$(pwd)/godot-editor/Godot_v3.6.2-stable_x11.64" >> $GITHUB_ENV

      - name: Import Godot project resources
        run: |
          echo "Importing Godot project resources (generate .import) using $GODOT_BIN"
          "$GODOT_BIN" --path . -e --quit --headless || true
          echo "List .import (if any):" && ls -la .import || true

      - name: Run GDUnit3 Tests
        run: |
          # Tu script runtest.sh espera la variable GODOT_BIN (ahora proveniente de GITHUB_ENV).
          echo "Working dir: $(pwd)"
          echo "GODOT_BIN=$GODOT_BIN"
          echo "List candidate tests directory:" && ls -la tests || true
          ./runtest.sh -a res://tests

      - name: Show GdUnit runner log (if present)
        if: always()
        run: |
          if [ -f reports/gdunit_runner.log ]; then
            echo "--- BEGIN gdunit_runner.log ---"
            sed -n '1,400p' reports/gdunit_runner.log || true
            echo "--- END gdunit_runner.log ---"
          else
            echo "No gdunit_runner.log present."
          fi

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-logs
          path: reports/