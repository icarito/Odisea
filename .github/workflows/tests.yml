name: GDUnit3 Tests
on: [push]


jobs:
  unit-test:
    name: Run GDUnit3 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        uses: actions/cache@v4
        with:
          path: ~/.godot/projects/odisea-project-cache
          key: ${{ runner.os }}-godot-${{ hashFiles('**/project.godot') }}
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Download Godot headless (no X11)
        run: |
          echo "Downloading Godot headless to run imports and tests (no X11)"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip"
          curl -L "$GODOT_URL" -o godot_headless.zip
          unzip -q godot_headless.zip -d godot-headless
          chmod +x godot-headless/* || true
          echo "GODOT_BIN=$(pwd)/godot-headless/Godot_v3.6.2-stable_linux_headless.64" >> $GITHUB_ENV

      - name: Import Godot project resources
        run: |
          "$GODOT_BIN" --path . -e --quit --headless || true

      - name: Run GDUnit3 Tests
        run: |
          ./runtest.sh -a res://tests

      # Omitido: Mostrar log completo para reducir ruido

      # Omitido: Anotación de reporte de determinismo para simplificar

      - name: Annotate GDUnit test results and warnings
        if: always()
        run: |
          LOG=reports/gdunit_runner.log
          if [ ! -f "$LOG" ]; then
            exit 0
          fi
          # Anotar errores de tests fallidos
          grep -n "Run Test: .*:FAILED" "$LOG" || true | while IFS=: read -r LN LINE; do
            # Capturar el bloque de reporte asociado (hasta la siguiente línea vacía o Run Test)
            BLOCK=$(sed -n "${LN},$((LN+10))p" "$LOG" | sed '/^$/q')
            # Si el bloque contiene 'Expecting to be less' o 'FAILED', es error
            if echo "$BLOCK" | grep -q 'Expecting to be less\|FAILED'; then
              esc=$(printf '%s' "$BLOCK" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              echo "::error title=GDUnit Failure::$esc"
            fi
          done
          # Anotar advertencias (WARNING) como notice
          grep -n "WARNING:" "$LOG" || true | while IFS=: read -r LN LINE; do
            # Capturar el bloque de advertencia (línea y contexto)
            BLOCK=$(sed -n "$((LN-2)),$((LN+2))p" "$LOG" | sed '/^$/q')
            esc=$(printf '%s' "$BLOCK" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::notice title=GDUnit Warning::$esc"
          done

      # Omitido: Anotación de resumen general para reducir ruido

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-logs
          path: reports/