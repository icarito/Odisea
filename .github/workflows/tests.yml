name: GDUnit3 Tests
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Run GDUnit3 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GODOT_VERSION: 3.6.2-stable
      GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.import
            ${{ github.workspace }}/.godot
          key: ${{ runner.os }}-godot-v3-${{ hashFiles('**/project.godot', 'assets/**', 'textures/**', 'models/**', 'core_v2/audio/**', 'core_v2/actors/**', 'core_v2/components/**', 'core_v2/props/**', 'core_v2/levels/**') }}
          restore-keys: |
            ${{ runner.os }}-godot-v3-
            ${{ runner.os }}-godot-

      - name: Cache Godot binary
        id: godot_bin_cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}/${{ env.GODOT_VERSION }}/godot
          key: ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-${{ github.workflow }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-
            ${{ runner.os }}-godot-bin-

      - name: Install runner prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          echo "Installed xmllint"

      - name: Setup Godot 3.6.2
        run: |
          set -euo pipefail
          TARGET_DIR="${GODOT_CACHE_DIR}/${GODOT_VERSION}"
          TARGET_BIN="${TARGET_DIR}/godot"
          mkdir -p "$TARGET_DIR"
          if [ ! -x "$TARGET_BIN" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            unzip -q "Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            mv "Godot_v${GODOT_VERSION}_linux_headless.64" "$TARGET_BIN"
            chmod +x "$TARGET_BIN"
          fi
          sudo install -m 755 "$TARGET_BIN" /usr/local/bin/godot

      - name: Cache Diagnostics
        run: |
          echo "godot_bin_cache_hit=${{ steps.godot_bin_cache.outputs.cache-hit }}"
          ls -la "${GODOT_CACHE_DIR}/${GODOT_VERSION}" || true

      - name: Verify Godot binary
        run: |
          if [ -x /usr/local/bin/godot ]; then
            echo "/usr/local/bin/godot is present and executable"
            /usr/local/bin/godot --version || true
          else
            echo "ERROR: /usr/local/bin/godot not found or not executable"
            ls -l /usr/local/bin || true
            exit 127
          fi

      - name: Clean Godot import caches
        run: |
          set -euo pipefail
          rm -rf .godot/imported
          mkdir -p .import
          find .import -mindepth 1 -maxdepth 1 -type f -delete || true

      - name: Disable editor plugins for CI import
        run: |
          set -euo pipefail
          cp project.godot project.godot.ci.bak
          awk '
            BEGIN { in_editor_plugins = 0 }
            /^\[editor_plugins\]$/ { in_editor_plugins = 1; print; next }
            in_editor_plugins == 1 && /^enabled=/ {
              print "enabled=PoolStringArray( )"
              in_editor_plugins = 0
              next
            }
            { print }
          ' project.godot.ci.bak > project.godot
          echo "Editor plugins disabled for CI import pass."

      - name: Import + Smoke (self-healing)
        run: |
          set -euo pipefail
          mkdir -p reports

          import_once() {
            local log_file="$1"
            set +e
            timeout 600s /usr/local/bin/godot --path . -e --headless --no-window --audio-driver Dummy 2>&1 | tee "$log_file"
            local godot_rc="${PIPESTATUS[0]}"
            set -e
            if [ "$godot_rc" -eq 124 ]; then
              echo "Godot import timed out before completing imports."
              return 1
            fi
            if [ "$godot_rc" -ne 0 ]; then
              echo "Godot import command failed with exit code $godot_rc"
              return "$godot_rc"
            fi
            return 0
          }

          smoke_once() {
            local log_file="$1"
            set +e
            timeout 180s /usr/local/bin/godot --headless --no-window --audio-driver Dummy -s tests/ci_resource_smoke.gd 2>&1 | tee "$log_file"
            local smoke_rc="${PIPESTATUS[0]}"
            set -e
            if [ "$smoke_rc" -ne 0 ] && [ "$smoke_rc" -ne 124 ]; then
              echo "Resource smoke failed with exit code $smoke_rc"
              return "$smoke_rc"
            fi
            if [ "$smoke_rc" -eq 124 ]; then
              echo "Resource smoke timed out."
              return 1
            fi
            if grep -q "\[CI_SMOKE\] Missing resources count:" "$log_file"; then
              return 1
            fi
            if grep -E -q "SCRIPT ERROR:|Parse Error:|referenced nonexistent resource|No loader found for resource|Failed loading resource:" "$log_file"; then
              return 1
            fi
            return 0
          }

          if ! import_once reports/import_resources.log || ! smoke_once reports/resource_smoke.log; then
            echo "Import/smoke failed on first pass. Retrying smoke once..."
            smoke_once reports/resource_smoke_retry.log
          fi

      - name: Run GDUnit3 Tests
        env:
          GODOT_BIN: /usr/local/bin/godot
          ODISEA_SHELL_RUNNER: gdunit
        run: |
          chmod +x ./runtest.sh
          ./runtest.sh --runner gdunit -a res://core_v2/tests

      - name: Publicar resumen de tests y drift
        if: always()
        run: |
          # Buscar reportes XML y log de gdunit recursivamente
          XML=$(find reports -type f -name '*.xml' | head -n1 || true)
          LOG=$(ls -1t reports/gdunit_*.log 2>/dev/null | head -n1 || true)
          SUMMARY="$GITHUB_STEP_SUMMARY"
          CLEAN_LOG=$(mktemp)

          echo "## 🧪 Resultados de tests (GDUnit3)" > "$SUMMARY"
          if [[ -n "$XML" && -f "$XML" ]]; then
            echo "Reporte XML encontrado en: $XML" >> "$SUMMARY"
            TESTS=$(xmllint --xpath "string(/testsuites/@tests)" "$XML" 2>/dev/null)
            FAILURES=$(xmllint --xpath "string(/testsuites/@failures)" "$XML" 2>/dev/null)
            ERRORS=$(xmllint --xpath "string(/testsuites/@errors)" "$XML" 2>/dev/null)
            SKIPPED=$(xmllint --xpath "string(/testsuites/@skipped)" "$XML" 2>/dev/null)
            TIME=$(xmllint --xpath "string(/testsuites/@time)" "$XML" 2>/dev/null)
            echo "- Total: $TESTS" >> "$SUMMARY"
            echo "- Fallidos: $FAILURES" >> "$SUMMARY"
            echo "- Errores: $ERRORS" >> "$SUMMARY"
            echo "- Saltados: $SKIPPED" >> "$SUMMARY"
            echo "- Tiempo total: $TIME sec" >> "$SUMMARY"
          else
            echo "No se encontró reporte XML de GDUnit3. Buscado en: $XML" >> "$SUMMARY"
          fi

          if [[ -n "$LOG" && -f "$LOG" ]]; then
            # Normalizar ANSI para parsing confiable
            sed -E 's/\x1b\[[0-9;]*m//g' "$LOG" > "$CLEAN_LOG"

            # Tabla completa basada en líneas "Run Test" (más robusto que reusar la tabla impresa)
            TEST_ROWS=$(awk '
              /Run Test:/ {
                line=$0
                if (line !~ /:(PASSED|FAILED|ERROR)[[:space:]]/) next
                status=""
                if (line ~ /:PASSED[[:space:]]/) status="PASSED"
                else if (line ~ /:FAILED[[:space:]]/) status="FAILED"
                else if (line ~ /:ERROR[[:space:]]/) status="ERROR"
                else next

                # Extraer tiempo (todo lo que va después de :STATUS )
                sub(/^.*:(PASSED|FAILED|ERROR)[[:space:]]/, "", line)
                time=line

                # Extraer nombre de test preferentemente desde [path]
                src=$0
                test_name=""
                if (match(src, /\[[^]]+\]/)) {
                  test_name=substr(src, RSTART+1, RLENGTH-2)
                  gsub(/^.*\//, "", test_name)
                } else {
                  if (match(src, />[[:space:]]*[^:]+[[:space:]]*:/)) {
                    test_name=substr(src, RSTART+1, RLENGTH-2)
                    gsub(/^[[:space:]]+|[[:space:]]+$/, "", test_name)
                  } else {
                    next
                  }
                }

                # Excluir agregado de método parametrizado (no es un caso de test real)
                if (test_name == "test_replay") next

                # Deduplicar por nombre+status+time
                key=test_name "|" status "|" time
                if (seen[key]++) next

                icon=(status=="PASSED" ? "✅ PASSED" : (status=="FAILED" ? "❌ FAILED" : "💥 ERROR"))
                print "| " test_name " | " icon " | " time " |"
              }
            ' "$CLEAN_LOG")

            echo -e "\n### 📊 Desglose de Tests" >> "$SUMMARY"
            echo "| Test Scenary | Status | Time |" >> "$SUMMARY"
            echo "|:-------------|:-------|:-----|" >> "$SUMMARY"
            if [[ -n "$TEST_ROWS" ]]; then
              echo "$TEST_ROWS" >> "$SUMMARY"
            else
              echo "| (sin filas parseables) | - | - |" >> "$SUMMARY"
            fi

            echo -e "\n### ❌ Tests que fallaron" >> "$SUMMARY"
            FAILED_TESTS=$(echo "$TEST_ROWS" | grep -E '\| ❌ FAILED \| |\| 💥 ERROR \| ' || true)
            if [[ -n "$FAILED_TESTS" ]]; then
              echo '```text' >> "$SUMMARY"
              echo "$FAILED_TESTS" >> "$SUMMARY"
              echo '```' >> "$SUMMARY"
            else
              echo "No hubo tests marcados como FAILED en la tabla." >> "$SUMMARY"
            fi

            echo -e "\n### ❌ Causas de fallo detectadas" >> "$SUMMARY"
            FAIL_LINES=$( \
              grep -E "OYS ASSERT FAILED|❌ ASSERT FAILED:|SCRIPT ERROR:|Parse Error:|Drift demasiado alto|Replay timed out|No test suites found|Assertion malformed" "$CLEAN_LOG" \
              | grep -v "ERROR: VisualServer attempted to free a NULL RID" \
              | awk '!seen[$0]++' \
              | head -n 50 || true \
            )
            if [[ -n "$FAIL_LINES" ]]; then
              echo '```text' >> "$SUMMARY"
              echo "$FAIL_LINES" >> "$SUMMARY"
              echo '```' >> "$SUMMARY"
            else
              echo "No se detectaron líneas de causa raíz (revisar log adjunto)." >> "$SUMMARY"
            fi

            # Drift compacto (sin repetir cada frame)
            echo -e "\n### 🔍 Análisis de Drift (compacto)" >> "$SUMMARY"
            DRIFT_COUNT=$(grep -c "DRIFT_CHECK: dist=" "$CLEAN_LOG" || true)
            if [[ "$DRIFT_COUNT" -gt 0 ]]; then
              MAX_DRIFT=$(grep "DRIFT_CHECK: dist=" "$CLEAN_LOG" | sed -E 's/.*dist=([0-9.]+).*/\1/' | sort -nr | head -n1)
              echo "- Muestras de drift: $DRIFT_COUNT" >> "$SUMMARY"
              echo "- Drift máximo observado: $MAX_DRIFT" >> "$SUMMARY"
              DRIFT_ERRORS=$(grep -E "DRIFT ERROR|Drift demasiado alto" "$CLEAN_LOG" | awk '!seen[$0]++' | head -n 20 || true)
              if [[ -n "$DRIFT_ERRORS" ]]; then
                echo '```text' >> "$SUMMARY"
                echo "$DRIFT_ERRORS" >> "$SUMMARY"
                echo '```' >> "$SUMMARY"
              fi
            else
              echo "No se encontraron líneas DRIFT_CHECK." >> "$SUMMARY"
            fi

            echo -e "\n### 📎 Log principal" >> "$SUMMARY"
            echo "- \`$LOG\`" >> "$SUMMARY"
          fi
          rm -f "$CLEAN_LOG"

      - name: Export test log path
        if: always()
        run: |
          LOG=$(ls -1t reports/gdunit_*.log 2>/dev/null | head -n1 || true)
          if [[ -n "$LOG" ]]; then
            echo "TEST_LOG=$LOG" >> "$GITHUB_ENV"
          else
            echo "TEST_LOG=" >> "$GITHUB_ENV"
          fi

      - name: Upload Test Log Artifact
        if: always() && env.TEST_LOG != ''
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-test-log
          path: ${{ env.TEST_LOG }}

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-results
          path: reports/
