name: Exportar a Web y Desplegar (Pages + Netlify)

on:
  push:
    branches: [ "main" ]
  workflow_run:
    workflows: ["Odyssey Pytest Runner"]
    types:
      - completed
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "web-deploy"
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Single HTML5 (threads) export. The .pck is identical between the threads
  # and non-threads presets, and the canonical site (Netlify) is cross-origin
  # isolated, so one threads build covers everything.
  #
  # The build is then split:
  #   - Netlify  ← "core" (html/js/workers/icons), NO heavy files.
  #   - Pages    ← heavy files only: index.pck(.gz) at root, index.wasm(.gz)
  #                under /threads/  (matching the loader paths in the shell).
  # ---------------------------------------------------------------------------
  export:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disable editor plugins
        run: python3 scripts/disable_plugins.py

      - name: Cache Godot
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/godot
            ~/.config/godot
            ~/.local/share/godot
            .godot/
            .import/
          key: ${{ runner.os }}-godot-web-${{ hashFiles('**/project.godot') }}-${{ hashFiles('**/*.import') }}
          restore-keys: |
            ${{ runner.os }}-godot-web-${{ hashFiles('**/project.godot') }}-
            ${{ runner.os }}-godot-web-

      - name: Install Godot and templates
        run: |
          GODOT_DIR="$HOME/.local/bin"
          mkdir -p "$GODOT_DIR"
          echo "$GODOT_DIR" >> "$GITHUB_PATH"

          if [ ! -f "$GODOT_DIR/godot3-server" ]; then
            curl -fSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip"
            unzip -o /tmp/godot.zip -d "$GODOT_DIR/"
            chmod +x "$GODOT_DIR/Godot_v3.6.2-stable_linux_headless.64"
            ln -sf "$GODOT_DIR/Godot_v3.6.2-stable_linux_headless.64" "$GODOT_DIR/godot3-server"
          fi

          TPL_DIR="$HOME/.local/share/godot/templates/3.6.2.stable"
          if [ ! -f "$TPL_DIR/webassembly_release.zip" ]; then
            mkdir -p "$TPL_DIR"
            curl -fSL -o /tmp/tpz.zip \
              "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz"
            unzip -o /tmp/tpz.zip -d /tmp/tpz_extract/
            if [ -d /tmp/tpz_extract/templates ]; then
              cp -a /tmp/tpz_extract/templates/* "$TPL_DIR/"
            fi
          fi

          godot3-server --editor --quit --headless 2>&1 || true
          echo "Setup complete."

      - name: Export HTML5 (threads)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          TPL_DIR="$HOME/.local/share/godot/templates/3.6.2.stable"

          # The "HTML5 Threads" preset (variant/export_type=1) still reads the
          # webassembly_release.zip slot, so swap in the threads template.
          cp "$TPL_DIR/webassembly_release.zip" "$TPL_DIR/webassembly_release.standard.bak"
          cp "$TPL_DIR/webassembly_threads_release.zip" "$TPL_DIR/webassembly_release.zip"

          mkdir -p build_export
          godot3-server --no-window --export "HTML5 Threads" build_export/index.html --quiet 2>&1

          # Restore the standard template slot.
          cp "$TPL_DIR/webassembly_release.standard.bak" "$TPL_DIR/webassembly_release.zip"

          echo "Export:"
          ls -la build_export/

      - name: Post-process (gzip heavy files + patch loader)
        run: |
          # Patches index.js to fetch .gz and decompress client-side, and
          # produces index.pck.gz / index.wasm.gz alongside the originals.
          python3 scripts/minimize_html_export.py build_export/

      - name: Stage Netlify core (no heavy files)
        run: |
          mkdir -p netlify_build
          shopt -s dotglob
          cp -a build_export/* netlify_build/

          # Heavy assets live on GitHub Pages; keep them out of Netlify.
          rm -f netlify_build/index.pck netlify_build/index.pck.gz \
                netlify_build/index.wasm netlify_build/index.wasm.gz

          # Cross-origin isolation headers (needed for SharedArrayBuffer/threads).
          cp build/_headers netlify_build/_headers

          # Inject the real download size (raw pck + wasm) so the loading bar is
          # accurate even though the engine's own fileSizes total drifts once we
          # serve client-decompressed .gz copies from Pages.
          PCK_BYTES=$(stat -c%s build_export/index.pck)
          WASM_BYTES=$(stat -c%s build_export/index.wasm)
          TOTAL=$((PCK_BYTES + WASM_BYTES))
          sed -i "s/\$ODISEA_TOTAL_BYTES/${TOTAL}/g" netlify_build/index.html
          echo "Injected EXPECTED_TOTAL_BYTES=${TOTAL}"

          echo "Netlify core:"
          ls -la netlify_build/

      - name: Stage Pages assets (heavy files only)
        run: |
          mkdir -p pages_build/threads
          # .pck at the root, .wasm under /threads/  (see the fetch override in
          # core_v2/telemetry/html/odisea_shell.html).
          cp build_export/index.pck    pages_build/
          cp build_export/index.pck.gz pages_build/
          cp build_export/index.wasm    pages_build/threads/
          cp build_export/index.wasm.gz pages_build/threads/

          echo "Pages assets:"
          ls -la pages_build/ pages_build/threads/

      - name: Upload Netlify artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlify-build
          path: netlify_build/
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_build

  deploy-netlify:
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Netlify artifact
        uses: actions/download-artifact@v4
        with:
          name: netlify-build
          path: netlify-build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: netlify-build/
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from ${{ github.sha }}"
          netlify-config-path: ./
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-pages:
    needs: export
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
