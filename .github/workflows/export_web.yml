name: Exportar a Web y Desplegar en GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  check-tests:
    name: Check tests passed
    runs-on: ubuntu-latest
    outputs:
      tests-passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Check latest test run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_RUN=$(gh run list --workflow "GDUnit3 Tests" --branch ${{ github.ref_name }} --limit 1 --json conclusion,status --jq '.[0] // empty')
          CONCLUSION=$(echo "$LAST_RUN" | jq -r '.conclusion // ""')
          STATUS=$(echo "$LAST_RUN" | jq -r '.status // ""')
          if [ "$CONCLUSION" = "success" ] || [ "$STATUS" = "completed" -a "$CONCLUSION" = "success" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
            echo "Tests passed!"
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "Latest tests: conclusion=$CONCLUSION status=$STATUS - skipping web export"
          fi

  build-and-deploy:
    needs: [check-tests]
    if: needs.check-tests.outputs.tests-passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/godot
            ~/.config/godot
            ~/.local/share/godot
          key: ${{ runner.os }}-godot-${{ hashFiles('**/project.godot') }}
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Export to Web
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz
          relative_project_path: ./
          use_godot_3: true
          use_preset_export_path: true
          export_debug: false
          presets_to_export: 'HTML5'

      - name: Move Web export to root
        run: |
          # El action crea un subdirectorio con el nombre del preset (p.ej. HTML5).
          # Mover todo al nivel superior para que Pages sirva index.html en la raíz.
          BUILD_DIR="${{ steps.export.outputs.build_directory }}"
          SRC_DIR=""

          for candidate in HTML5 Web; do
            if [ -d "$BUILD_DIR/$candidate" ]; then
              SRC_DIR="$BUILD_DIR/$candidate"
              break
            fi
          done

          if [ -z "$SRC_DIR" ]; then
            CANDIDATE="$(find "$BUILD_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE/index.html" ]; then
              SRC_DIR="$CANDIDATE"
            fi
          fi

          if [ -n "$SRC_DIR" ]; then
            shopt -s dotglob
            mv "$SRC_DIR"/* "$BUILD_DIR"/
            rmdir "$SRC_DIR"
            echo "Moved export contents from $SRC_DIR to $BUILD_DIR"
          else
            echo "No nested export dir found; leaving build directory as-is."
          fi

      - name: Minimize Web export for GitHub Pages
        run: python3 scripts/minimize_html_export.py "${{ steps.export.outputs.build_directory }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.export.outputs.build_directory }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
