name: Exportar a Web y Desplegar en GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_run:
    workflows: ["Odyssey Pytest Runner"]
    types:
      - completed
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/godot
            ~/.config/godot
            ~/.local/share/godot
          key: ${{ runner.os }}-godot-${{ hashFiles('**/project.godot') }}
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Export to Web (regular)
        id: export
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz
          relative_project_path: ./
          use_godot_3: true
          use_preset_export_path: true
          export_debug: false
          presets_to_export: 'HTML5'

      - name: Move Web export to root
        run: |
          BUILD_DIR="${{ steps.export.outputs.build_directory }}"
          SRC_DIR=""

          for candidate in HTML5 Web; do
            if [ -d "$BUILD_DIR/$candidate" ]; then
              SRC_DIR="$BUILD_DIR/$candidate"
              break
            fi
          done

          if [ -z "$SRC_DIR" ]; then
            CANDIDATE="$(find "$BUILD_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE/index.html" ]; then
              SRC_DIR="$CANDIDATE"
            fi
          fi

          if [ -n "$SRC_DIR" ]; then
            shopt -s dotglob
            mv "$SRC_DIR"/* "$BUILD_DIR"/
            rmdir "$SRC_DIR"
            echo "Moved export contents from $SRC_DIR to $BUILD_DIR"
          else
            echo "No nested export dir found; leaving build directory as-is."
          fi

      - name: Minimize Web export for GitHub Pages
        run: python3 scripts/minimize_html_export.py "${{ steps.export.outputs.build_directory }}"

      # ── Threads WASM for Netlify fallback ──
      - name: Install Godot server binary (for threads export)
        run: |
          GODOT_BIN="$HOME/.local/bin/godot3-server"
          if [ ! -f "$GODOT_BIN" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -fSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip"
            unzip -o /tmp/godot.zip -d "$HOME/.local/bin/"
            chmod +x "$HOME/.local/bin/Godot_v3.6.2-stable_linux_headless.64"
            ln -sf "$HOME/.local/bin/Godot_v3.6.2-stable_linux_headless.64" "$GODOT_BIN"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Export HTML5 Threads (WASM staged in /threads/)
        run: |
          # Find templates dir (firebelley/godot-export may install to different paths)
          TPL_DIR=$(find "$HOME/.local/share/godot/templates" -maxdepth 2 -name "webassembly_release.wasm" 2>/dev/null | head -n1 | xargs dirname 2>/dev/null || true)
          if [ -z "$TPL_DIR" ]; then
            TPL_DIR=$(find "$HOME/.cache/godot" -name "webassembly_release.wasm" 2>/dev/null | head -n1 | xargs dirname 2>/dev/null || true)
          fi
          if [ -z "$TPL_DIR" ]; then
            TPL_DIR=$(find /tmp -name "webassembly_release.wasm" 2>/dev/null | head -n1 | xargs dirname 2>/dev/null || true)
          fi
          echo "Templates directory: $TPL_DIR"

          THREADS_ZIP=$(find "$TPL_DIR" /tmp /home/runner -name "webassembly_threads_release.zip" 2>/dev/null | head -n1 || true)
          if [ -z "$THREADS_ZIP" ]; then
            echo "webassembly_threads_release.zip not found, downloading and extracting from .tpz..."
            curl -fSL -o /tmp/godot_tpz.zip \
              "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz"
            mkdir -p /tmp/tpz_extract
            unzip -o /tmp/godot_tpz.zip -d /tmp/tpz_extract/
            THREADS_ZIP=$(find /tmp/tpz_extract -name "webassembly_threads_release.zip" 2>/dev/null | head -n1 || true)
            # Also copy templates into the right place if we had to download them
            if [ -n "$TPL_DIR" ] && [ -d /tmp/tpz_extract/templates ]; then
              cp -a /tmp/tpz_extract/templates/* "$TPL_DIR/" 2>/dev/null || true
            fi
          fi
          echo "Threads zip: $THREADS_ZIP"

          mkdir -p /tmp/threads_wasm
          unzip -o "$THREADS_ZIP" -d /tmp/threads_wasm/
          THREADS_WASM=$(find /tmp/threads_wasm -name '*.wasm' | head -n1)
          echo "Threads WASM: $THREADS_WASM"

          cp "$TPL_DIR/webassembly_release.wasm" "$TPL_DIR/webassembly_release.standard.bak"
          cp "$THREADS_WASM" "$TPL_DIR/webassembly_release.wasm"

          BUILD_DIR="${{ steps.export.outputs.build_directory }}"
          mkdir -p /tmp/threads_export
          godot3-server --no-window --export "HTML5 Threads" /tmp/threads_export/index.html --quiet 2>&1

          mkdir -p "$BUILD_DIR/threads"
          cp /tmp/threads_export/index.wasm "$BUILD_DIR/threads/"
          gzip -9 -n -c "$BUILD_DIR/threads/index.wasm" > "$BUILD_DIR/threads/index.wasm.gz"
          echo "Threads WASM staged in $BUILD_DIR/threads/:"
          ls -la "$BUILD_DIR/threads/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.export.outputs.build_directory }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
