name: Exportar a Web y Desplegar (Pages + Netlify)

on:
  push:
    branches: [ "main" ]
  workflow_run:
    workflows: ["Odyssey Pytest Runner"]
    types:
      - completed
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "web-deploy"
  cancel-in-progress: true

jobs:
  # ── Shared setup: install Godot + templates once ──
  setup:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      godot-dir: ${{ steps.paths.outputs.godot-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable editor plugins
        run: |
          python3 scripts/disable_plugins.py

      - name: Cache Godot
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/godot
            ~/.config/godot
            ~/.local/share/godot
            .godot/
            .import/
          key: ${{ runner.os }}-godot-web-${{ hashFiles('**/project.godot') }}-${{ hashFiles('**/*.import') }}
          restore-keys: |
            ${{ runner.os }}-godot-web-${{ hashFiles('**/project.godot') }}-
            ${{ runner.os }}-godot-web-

      - name: Install Godot binary + templates
        id: paths
        run: |
          GODOT_DIR="$HOME/.local/bin"
          mkdir -p "$GODOT_DIR"
          echo "$GODOT_DIR" >> "$GITHUB_PATH"
          echo "godot-dir=$GODOT_DIR" >> "$GITHUB_OUTPUT"

          if [ ! -f "$GODOT_DIR/godot3-server" ]; then
            curl -fSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip"
            unzip -o /tmp/godot.zip -d "$GODOT_DIR/"
            chmod +x "$GODOT_DIR/Godot_v3.6.2-stable_linux_headless.64"
            ln -sf "$GODOT_DIR/Godot_v3.6.2-stable_linux_headless.64" "$GODOT_DIR/godot3-server"
          fi

          TPL_DIR="$HOME/.local/share/godot/templates/3.6.2.stable"
          if [ ! -f "$TPL_DIR/webassembly_release.zip" ]; then
            mkdir -p "$TPL_DIR"
            curl -fSL -o /tmp/tpz.zip \
              "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz"
            unzip -o /tmp/tpz.zip -d /tmp/tpz_extract/
            if [ -d /tmp/tpz_extract/templates ]; then
              cp -a /tmp/tpz_extract/templates/* "$TPL_DIR/"
            fi
          fi

          # Also extract threads WASM for later swap
          if [ -f "$TPL_DIR/webassembly_threads_release.zip" ]; then
            unzip -o "$TPL_DIR/webassembly_threads_release.zip" -d "$TPL_DIR/threads-wasm/"
          fi

          # Run import once (cached by .godot/)
          godot3-server --editor --quit --headless 2>&1 || true
          echo "Setup complete."

  # ── Regular HTML5 export (for Pages) ──
  export-regular:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disable editor plugins
        run: |
          python3 -c "
import re
with open('project.godot') as f: text = f.read()
text = re.sub(r'enabled=PoolStringArray\([^)]+\)', 'enabled=PoolStringArray()', text)
with open('project.godot', 'w') as f: f.write(text)
"

      - name: Cache Godot
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/godot
            ~/.config/godot
            ~/.local/share/godot
            .godot/
            .import/
          key: ${{ runner.os }}-godot-web-${{ hashFiles('**/project.godot') }}-${{ hashFiles('**/*.import') }}
          restore-keys: |
            ${{ runner.os }}-godot-web-${{ hashFiles('**/project.godot') }}-
            ${{ runner.os }}-godot-web-

      - name: Export HTML5 Regular
        id: export-regular
        uses: firebelley/godot-export@v7.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz
          relative_project_path: ./
          use_godot_3: true
          use_preset_export_path: true
          export_debug: false
          presets_to_export: 'HTML5'

      - name: Collect regular export
        run: |
          BUILD_DIR="${{ steps.export-regular.outputs.build_directory }}"
          mkdir -p pages_build/
          SRC_DIR=""
          for candidate in HTML5 Web; do
            if [ -d "$BUILD_DIR/$candidate" ]; then SRC_DIR="$BUILD_DIR/$candidate"; break; fi
          done
          if [ -z "$SRC_DIR" ]; then
            CANDIDATE="$(find "$BUILD_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE/index.html" ]; then SRC_DIR="$CANDIDATE"; fi
          fi
          if [ -n "$SRC_DIR" ]; then
            shopt -s dotglob; mv "$SRC_DIR"/* pages_build/; rmdir "$SRC_DIR"
          else
            shopt -s dotglob; cp -a "$BUILD_DIR"/* pages_build/
          fi
          python3 scripts/minimize_html_export.py pages_build/
          echo "Regular export collected:"
          ls -la pages_build/

      - name: Upload regular artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-build
          path: pages_build/
          retention-days: 1

  # ── Threads HTML5 export (for Netlify + WASM fallback on Pages) ──
  export-threads:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disable editor plugins
        run: python3 scripts/disable_plugins.py

      - name: Cache Godot
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/godot
            ~/.config/godot
            ~/.local/share/godot
            .godot/
            .import/
          key: ${{ runner.os }}-godot-web-${{ hashFiles('**/project.godot') }}-${{ hashFiles('**/*.import') }}
          restore-keys: |
            ${{ runner.os }}-godot-web-${{ hashFiles('**/project.godot') }}-
            ${{ runner.os }}-godot-web-

      - name: Install Godot binary + templates
        run: |
          TPL_DIR="$HOME/.local/share/godot/templates/3.6.2.stable"
          echo "Templates dir: $TPL_DIR"
          ls -la "$TPL_DIR/"webassembly*.zip "$TPL_DIR/threads-wasm/"*.wasm 2>/dev/null || true

          # If threads zip wasn't already extracted in setup, do it now
          if [ ! -d "$TPL_DIR/threads-wasm" ] || [ ! -f "$TPL_DIR/threads-wasm/godot.wasm" ]; then
            unzip -o "$TPL_DIR/webassembly_threads_release.zip" -d "$TPL_DIR/threads-wasm/"
          fi

          # Swap: replace standard zip with threads variant
          cp "$TPL_DIR/webassembly_release.zip" "$TPL_DIR/webassembly_release.standard.bak"
          cp "$TPL_DIR/webassembly_threads_release.zip" "$TPL_DIR/webassembly_release.zip"
          echo "Swapped webassembly_release.zip with threads variant"

          # Export
          mkdir -p build_threads
          godot3-server --no-window --export "HTML5 Threads" build_threads/index.html --quiet 2>&1
          echo "Threads export:"
          ls -la build_threads/

          # Restore standard zip
          cp "$TPL_DIR/webassembly_release.standard.bak" "$TPL_DIR/webassembly_release.zip"

      - name: Prepare Netlify deploy
        run: |
          mkdir -p netlify_build/
          shopt -s dotglob
          cp -a build_threads/* netlify_build/
          python3 scripts/minimize_html_export.py netlify_build/
          cp build/_headers netlify_build/_headers
          echo "Netlify build:"
          ls -la netlify_build/

      - name: Upload threads artifact
        uses: actions/upload-artifact@v4
        with:
          name: netlify-build
          path: netlify_build/
          retention-days: 1

      - name: Upload threads WASM for Pages
        uses: actions/upload-artifact@v4
        with:
          name: threads-wasm
          path: build_threads/index.wasm
          retention-days: 1

  # ── Combine, stage, and deploy ──
  deploy:
    needs: [export-regular, export-threads]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Merge into Pages artifact
        run: |
          mkdir -p pages_build
          if [ -d pages-build ]; then
            shopt -s dotglob
            cp -a pages-build/* pages_build/
          fi
          mkdir -p pages_build/threads
          if [ -f threads-wasm/index.wasm ]; then
            cp threads-wasm/index.wasm pages_build/threads/
            gzip -9 -n -c pages_build/threads/index.wasm > pages_build/threads/index.wasm.gz
            echo "Pages threads/ fallback staged"
          fi
          ls -la pages_build/
          ls -la pages_build/threads/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: netlify-build/
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from ${{ github.sha }}"
          netlify-config-path: ./
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Verify
        run: |
          echo "::group::Pages build"
          ls -la pages_build/
          echo "::endgroup::"
          echo "::group::Netlify build"
          ls -la netlify-build/
          echo "::endgroup::"

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4