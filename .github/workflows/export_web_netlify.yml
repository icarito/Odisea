name: Exportar a Web y Desplegar en Netlify (Threads)

on:
  push:
    branches: [ "main" ]
  workflow_run:
    workflows: ["Odyssey Pytest Runner"]
    types:
      - completed
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "netlify-deploy"
  cancel-in-progress: true

jobs:
  export-and-deploy:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary and templates
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/godot
            ~/.config/godot
            ~/.local/share/godot
          key: ${{ runner.os }}-godot-netlify-${{ hashFiles('**/project.godot') }}
          restore-keys: |
            ${{ runner.os }}-godot-netlify-

      - name: Install Godot 3.6.2
        run: |
          GODOT_DIR="$HOME/.local/bin"
          mkdir -p "$GODOT_DIR"
          echo "$GODOT_DIR" >> "$GITHUB_PATH"

          if [ ! -f "$GODOT_DIR/godot3-server" ]; then
            curl -fSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip"
            unzip -o /tmp/godot.zip -d "$GODOT_DIR/"
            chmod +x "$GODOT_DIR/Godot_v3.6.2-stable_linux_headless.64"
            ln -sf "$GODOT_DIR/Godot_v3.6.2-stable_linux_headless.64" "$GODOT_DIR/godot3-server"
          else
            echo "Godot binary already cached"
          fi

      - name: Install export templates (standard)
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/templates/3.6.2.stable"
          if [ ! -f "$TEMPLATE_DIR/webassembly_release.wasm" ]; then
            mkdir -p "$TEMPLATE_DIR"
            curl -fSL -o /tmp/godot_templates.tpz \
              "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz"
            unzip -o /tmp/godot_templates.tpz -d "$TEMPLATE_DIR/"
            # The .tpz contains templates/ subdir, move up if needed
            if [ -d "$TEMPLATE_DIR/templates" ]; then
              mv "$TEMPLATE_DIR/templates/"* "$TEMPLATE_DIR/"
              rmdir "$TEMPLATE_DIR/templates"
            fi
            echo "Standard templates installed:"
            ls -la "$TEMPLATE_DIR/"
          else
            echo "Standard templates already cached"
          fi

      - name: Swap in threads-enabled WASM template
        run: |
          THREADS_URL="https://github.com/godotengine/godot/releases/download/3.6.2-stable/webassembly_release_threads.zip"
          TEMPLATE_DIR="$HOME/.local/share/godot/templates/3.6.2.stable"

          echo "Downloading threads WASM template..."
          curl -fSL -o /tmp/threads.zip "$THREADS_URL"
          unzip -o /tmp/threads.zip -d /tmp/threads_wasm/

          echo "Contents of threads zip:"
          ls -laR /tmp/threads_wasm/

          # The threads zip contains godot.webassembly.release.threads.wasm
          THREADS_WASM=$(find /tmp/threads_wasm -name '*.threads.wasm' -o -name '*threads*.wasm' | head -n1)
          if [ -z "$THREADS_WASM" ]; then
            echo "::error::Could not find threads WASM in downloaded zip"
            exit 1
          fi

          # Backup standard, replace with threads
          if [ -f "$TEMPLATE_DIR/webassembly_release.wasm" ] && [ ! -f "$TEMPLATE_DIR/webassembly_release.standard.bak" ]; then
            cp "$TEMPLATE_DIR/webassembly_release.wasm" "$TEMPLATE_DIR/webassembly_release.standard.bak"
          fi
          cp "$THREADS_WASM" "$TEMPLATE_DIR/webassembly_release.wasm"
          echo "Replaced webassembly_release.wasm with threads variant: $(basename "$THREADS_WASM")"
          echo "Threads WASM size: $(stat -c%s "$TEMPLATE_DIR/webassembly_release.wasm")"

      - name: Run Godot import
        run: |
          godot3-server --editor --quit --headless 2>&1 || true

      - name: Export HTML5 Threads
        run: |
          mkdir -p build
          godot3-server --no-window --export "HTML5 Threads" build/index.html --quiet 2>&1
          echo "Export complete:"
          ls -la build/

      - name: Collect and prepare deploy dir
        run: |
          mkdir -p netlify_build/
          shopt -s dotglob
          cp -a build/* netlify_build/

          # Patch the loader for gzip support
          python3 scripts/minimize_html_export.py netlify_build/

          # Copy _headers for COOP/COEP (required for SharedArrayBuffer)
          cp build/_headers netlify_build/_headers

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: netlify_build/
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from ${{ github.sha }}"
          netlify-config-path: ./
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Verify COOP/COEP and threads WASM
        run: |
          echo "::group::_headers"
          cat netlify_build/_headers
          echo "::endgroup::"
          echo ""
          echo "::group::WASM file check"
          ls -la netlify_build/*.wasm
          echo ""
          # Check if threads symbols are present in the WASM
          if command -v strings &>/dev/null; then
            THREADS_SYM=$(strings netlify_build/*.wasm 2>/dev/null | grep -c -i 'pthread\|SharedArrayBuffer\|Atomics' || true)
            echo "Threads-related symbols found in WASM: $THREADS_SYM"
          fi
          echo "::endgroup::"