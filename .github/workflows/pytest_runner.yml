name: Odyssey Pytest Runner
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      run_raw_oys:
        description: "Run extended raw-oys suite (slow/experimental)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pytest-core:
    name: Run Tests (core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 3.6.2-stable
      GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot
      ANNA_V2_NO_CENTRAL: "1"
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Godot cache
        id: godot_project_cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.import
            ${{ github.workspace }}/.godot
          key: ${{ runner.os }}-godot-v3-${{ hashFiles('**/project.godot') }}-${{ hashFiles('**/*.import', '.import/**', 'assets/**', 'textures/**', 'models/**', 'core_v2/audio/**', 'core_v2/actors/**', 'core_v2/components/**', 'core_v2/props/**', 'core_v2/levels/**') }}
          restore-keys: |
            ${{ runner.os }}-godot-v3-
            ${{ runner.os }}-godot-

      - name: Cache Godot binary
        id: godot_bin_cache
        uses: actions/cache@v6
        with:
          path: ${{ env.GODOT_CACHE_DIR }}/${{ env.GODOT_VERSION }}/godot
          key: ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-${{ github.workflow }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-
            ${{ runner.os }}-godot-bin-

      - name: Setup Godot 3.6.2
        run: |
          set -euo pipefail
          TARGET_DIR="${GODOT_CACHE_DIR}/${GODOT_VERSION}"
          TARGET_BIN="${TARGET_DIR}/godot"
          mkdir -p "$TARGET_DIR"
          if [ ! -x "$TARGET_BIN" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            unzip -q "Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            mv "Godot_v${GODOT_VERSION}_linux_headless.64" "$TARGET_BIN"
            chmod +x "$TARGET_BIN"
          fi
          sudo install -m 755 "$TARGET_BIN" /usr/local/bin/godot

      - name: Verify Godot binary
        run: |
          if [ -x /usr/local/bin/godot ]; then
            echo "/usr/local/bin/godot is present and executable"
            /usr/local/bin/godot --version || true
          else
            echo "ERROR: /usr/local/bin/godot not found or not executable"
            ls -l /usr/local/bin || true
            exit 127
          fi

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pytest.txt

      - name: Ensure pip cache dir exists
        run: mkdir -p ~/.cache/pip

      - name: Cache virtualenv
        id: venv_cache
        uses: actions/cache@v6
        with:
          path: .venv
          key: ${{ runner.os }}-venv-pytest-v2-${{ hashFiles('requirements-pytest.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-pytest-v2-

      - name: Install/Repair Pytest venv
        run: |
          set -euo pipefail
          if [ ! -x .venv/bin/python ] || [ ! -x .venv/bin/pytest ] || ! .venv/bin/python -c "import sys" >/dev/null 2>&1; then
            rm -rf .venv
            python -m venv .venv
          fi
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements-pytest.txt

      - name: Cache Diagnostics
        run: |
          echo "godot_project_cache_hit=${{ steps.godot_project_cache.outputs.cache-hit }}"
          echo "godot_bin_cache_hit=${{ steps.godot_bin_cache.outputs.cache-hit }}"
          echo "venv_cache_hit=${{ steps.venv_cache.outputs.cache-hit }}"
          ls -la "${GODOT_CACHE_DIR}/${GODOT_VERSION}" || true

      # El checkout es shallow (fetch-depth 1): el commit base no está en el clon y
      # los chequeos que diffean contra él quedaban inertes ("fatal: bad object" →
      # "No added files detected"). Se resuelve y se trae una sola vez, acá.
      - name: Resolve base commit
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=""
          fi
          if [ -n "${BASE_SHA}" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}" 2>/dev/null || true
          fi
          if [ -n "${BASE_SHA}" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --deepen=50 2>/dev/null || true
          fi
          if [ -n "${BASE_SHA}" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::No se pudo traer el commit base ${BASE_SHA}; los chequeos incrementales se omiten."
            BASE_SHA=""
          fi
          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
          echo "Base commit: ${BASE_SHA:-<no disponible>}"

      - name: Guard added assets size (<=50MB)
        if: env.BASE_SHA != ''
        run: |
          set -euo pipefail
          scripts/check_added_file_sizes.sh "${BASE_SHA}" "${GITHUB_SHA}"

      - name: Validate tracked import manifests
        run: |
          set -euo pipefail
          python3 scripts/check_tracked_imports.py

      # CI no importa assets nuevos (el pase `--editor --quit` aborta el scan y
      # vive de la cache), asi que un asset agregado sin su artefacto no existe
      # alla y tumba cualquier escena que lo referencie.
      - name: Validate new imported assets ship their artifact
        if: env.BASE_SHA != ''
        run: |
          set -euo pipefail
          python3 scripts/check_import_artifacts_present.py --mode added --base "${BASE_SHA}"

      - name: Validate critical import artifacts
        run: |
          set -euo pipefail
          python3 scripts/check_critical_import_artifacts.py

      - name: Import + Smoke (self-healing)
        run: |
          set -euo pipefail
          scripts/godot_import_smoke.sh \
            --godot-bin /usr/local/bin/godot \
            --project-path . \
            --import-log reports/import_resources.log \
            --smoke-log reports/resource_smoke.log \
            --smoke-retry-log reports/resource_smoke_retry.log \
            --timeout-import 600 \
            --timeout-smoke 180 \
            --clean-cache 0 \
            --disable-editor-plugins 1 \
            --xvfb 0 \
            --force-software 0 \
            --import-mode auto \
            --allow-smoke-retry 1

      - name: Run Core Tests
        env:
          GODOT_BIN: /usr/local/bin/godot
          ODISEA_INCLUDE_DETERMINISM: "0"
          ODISEA_TEST_TIMEOUT_SEC: "180"
          ODISEA_SKIP_PREFLIGHT: "1"
        run: |
          set -euo pipefail
          mkdir -p reports
          # GdUnit can execute all suites in one SceneTree. The pytest delegate
          # starts one Godot per suite; under xdist that caused CPU thrash and
          # flaky frame- and benchmark-sensitive tests. Keep replay cases in the
          # dedicated determinism workflow, where fresh processes are intentional.
          set +e
          timeout 420s ./runtest.sh --runner gdunit \
            -a ./core_v2/tests/ \
            -i res://core_v2/tests/test_determinism_v2.gd 2>&1 | tee reports/core_tests.log
          test_rc="${PIPESTATUS[0]}"
          set -e
          if [ "$test_rc" -eq 124 ]; then
            echo "Core tests timed out after 420s."
            exit 124
          fi
          exit "$test_rc"

      - name: Publish Test Summary
        if: always()
        run: |
          echo "## Core Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/import_resources.log ]; then
            echo "### Import Diagnostics" >> $GITHUB_STEP_SUMMARY
            grep -E "ERROR:|Failed to load resource|referenced nonexistent resource|Unrecognized binary resource file" reports/import_resources.log | tail -20 >> $GITHUB_STEP_SUMMARY || echo "No import errors detected." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/import_resources_retry.log ]; then
            echo "### Import Diagnostics (Retry)" >> $GITHUB_STEP_SUMMARY
            grep -E "ERROR:|Failed to load resource|referenced nonexistent resource|Unrecognized binary resource file" reports/import_resources_retry.log | tail -20 >> $GITHUB_STEP_SUMMARY || echo "No import errors detected on retry." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/resource_smoke.log ]; then
            echo "### Resource Smoke Check" >> $GITHUB_STEP_SUMMARY
            grep -E "\\[CI_SMOKE\\]" reports/resource_smoke.log | tail -20 >> $GITHUB_STEP_SUMMARY || echo "No smoke output found." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/resource_smoke_retry.log ]; then
            echo "### Resource Smoke Check (Retry)" >> $GITHUB_STEP_SUMMARY
            grep -E "\\[CI_SMOKE\\]" reports/resource_smoke_retry.log | tail -20 >> $GITHUB_STEP_SUMMARY || echo "No retry smoke output found." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/core_tests.log ]; then
            grep -E "PASSED|FAILED|ERROR|✅|❌" reports/core_tests.log | tail -30 >> $GITHUB_STEP_SUMMARY || echo "No results found" >> $GITHUB_STEP_SUMMARY
          fi

  pytest-raw-oys:
    name: Run Pytest (raw-oys)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_raw_oys == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      GODOT_VERSION: 3.6.2-stable
      GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Godot binary
        id: godot_bin_cache_raw
        uses: actions/cache@v6
        with:
          path: ${{ env.GODOT_CACHE_DIR }}/${{ env.GODOT_VERSION }}/godot
          key: ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-${{ github.workflow }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-
            ${{ runner.os }}-godot-bin-

      - name: Setup Godot 3.6.2
        run: |
          set -euo pipefail
          TARGET_DIR="${GODOT_CACHE_DIR}/${GODOT_VERSION}"
          TARGET_BIN="${TARGET_DIR}/godot"
          mkdir -p "$TARGET_DIR"
          if [ ! -x "$TARGET_BIN" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            unzip -q "Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            mv "Godot_v${GODOT_VERSION}_linux_headless.64" "$TARGET_BIN"
            chmod +x "$TARGET_BIN"
          fi
          sudo install -m 755 "$TARGET_BIN" /usr/local/bin/godot

      - name: Set up Python
        id: setup_python_raw
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pytest.txt

      - name: Ensure pip cache dir exists (raw-oys)
        run: mkdir -p ~/.cache/pip

      - name: Cache virtualenv
        id: venv_cache_raw
        uses: actions/cache@v6
        with:
          path: .venv
          key: ${{ runner.os }}-venv-pytest-v1-${{ hashFiles('requirements-pytest.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-pytest-v1-

      - name: Install Pytest
        if: steps.venv_cache_raw.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r requirements-pytest.txt

      - name: Cache Diagnostics
        run: |
          echo "godot_bin_cache_hit=${{ steps.godot_bin_cache_raw.outputs.cache-hit }}"
          echo "venv_cache_hit=${{ steps.venv_cache_raw.outputs.cache-hit }}"
          ls -la "${GODOT_CACHE_DIR}/${GODOT_VERSION}" || true

      - name: Run Pytest (raw-oys)
        env:
          GODOT_BIN: /usr/local/bin/godot
        run: |
          ./.venv/bin/pytest --odisea-runner raw-oys -n 2 -x --maxfail 1

  # Summary job that other workflows can depend on
  # Only depends on core tests - determinism is optional
  tests-passed:
    name: Core Tests Passed
    needs: [pytest-core]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.check.outputs.success }}
    steps:
      - name: Check Test Results
        id: check
        run: |
          if [ "${{ needs.pytest-core.result }}" != "success" ]; then
            echo "Core tests result: ${{ needs.pytest-core.result }}"
            exit 1
          fi
          echo "success=true" >> $GITHUB_OUTPUT
          echo "✅ Core tests passed!"
          echo ""
          echo "Note: Determinism tests run in parallel and don't block this check."
