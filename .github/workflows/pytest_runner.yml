name: Odyssey Pytest Runner
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_raw_oys:
        description: "Run extended raw-oys suite (slow/experimental)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest-core:
    name: Run Tests (core)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 3.6.2-stable
      GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        id: godot_project_cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.import
            ${{ github.workspace }}/.godot
          key: ${{ runner.os }}-godot-${{ hashFiles('**/project.godot') }}-${{ hashFiles('assets/**') }}
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Cache Godot binary
        id: godot_bin_cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}/${{ env.GODOT_VERSION }}/godot
          key: ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-${{ github.workflow }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-
            ${{ runner.os }}-godot-bin-

      - name: Setup Godot 3.6.2
        run: |
          set -euo pipefail
          TARGET_DIR="${GODOT_CACHE_DIR}/${GODOT_VERSION}"
          TARGET_BIN="${TARGET_DIR}/godot"
          mkdir -p "$TARGET_DIR"
          if [ ! -x "$TARGET_BIN" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            unzip -q "Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            mv "Godot_v${GODOT_VERSION}_linux_headless.64" "$TARGET_BIN"
            chmod +x "$TARGET_BIN"
          fi
          sudo install -m 755 "$TARGET_BIN" /usr/local/bin/godot

      - name: Verify Godot binary
        run: |
          if [ -x /usr/local/bin/godot ]; then
            echo "/usr/local/bin/godot is present and executable"
            /usr/local/bin/godot --version || true
          else
            echo "ERROR: /usr/local/bin/godot not found or not executable"
            ls -l /usr/local/bin || true
            exit 127
          fi

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pytest.txt

      - name: Ensure pip cache dir exists
        run: mkdir -p ~/.cache/pip

      - name: Cache virtualenv
        id: venv_cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-pytest-v1-${{ hashFiles('requirements-pytest.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-pytest-v1-

      - name: Install Pytest
        if: steps.venv_cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r requirements-pytest.txt

      - name: Cache Diagnostics
        run: |
          echo "godot_project_cache_hit=${{ steps.godot_project_cache.outputs.cache-hit }}"
          echo "godot_bin_cache_hit=${{ steps.godot_bin_cache.outputs.cache-hit }}"
          echo "venv_cache_hit=${{ steps.venv_cache.outputs.cache-hit }}"
          ls -la "${GODOT_CACHE_DIR}/${GODOT_VERSION}" || true

      - name: Import Resources
        run: |
          echo "Importing Godot resources..."
          /usr/local/bin/godot --path . -e --quit --headless 2>&1 | head -50
          echo "Import complete."
          ls -la .import/ 2>/dev/null | head -10 || echo "No .import directory"

      - name: Run Core Tests
        env:
          GODOT_BIN: /usr/local/bin/godot
          OYS_NODET: "1"
        run: |
          mkdir -p reports
          # OYS_NODET=1 skips determinism tests
          ./runtest.sh -a ./core_v2/tests/ 2>&1 | tee reports/core_tests.log

      - name: Publish Test Summary
        if: always()
        run: |
          echo "## Core Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/core_tests.log ]; then
            grep -E "PASSED|FAILED|ERROR|✅|❌" reports/core_tests.log | tail -30 >> $GITHUB_STEP_SUMMARY || echo "No results found" >> $GITHUB_STEP_SUMMARY
          fi

  pytest-raw-oys:
    name: Run Pytest (raw-oys)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_raw_oys == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      GODOT_VERSION: 3.6.2-stable
      GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot_bin_cache_raw
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}/${{ env.GODOT_VERSION }}/godot
          key: ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-${{ github.workflow }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-
            ${{ runner.os }}-godot-bin-

      - name: Setup Godot 3.6.2
        run: |
          set -euo pipefail
          TARGET_DIR="${GODOT_CACHE_DIR}/${GODOT_VERSION}"
          TARGET_BIN="${TARGET_DIR}/godot"
          mkdir -p "$TARGET_DIR"
          if [ ! -x "$TARGET_BIN" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            unzip -q "Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            mv "Godot_v${GODOT_VERSION}_linux_headless.64" "$TARGET_BIN"
            chmod +x "$TARGET_BIN"
          fi
          sudo install -m 755 "$TARGET_BIN" /usr/local/bin/godot

      - name: Set up Python
        id: setup_python_raw
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pytest.txt

      - name: Ensure pip cache dir exists (raw-oys)
        run: mkdir -p ~/.cache/pip

      - name: Cache virtualenv
        id: venv_cache_raw
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-pytest-v1-${{ hashFiles('requirements-pytest.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-pytest-v1-

      - name: Install Pytest
        if: steps.venv_cache_raw.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r requirements-pytest.txt

      - name: Cache Diagnostics
        run: |
          echo "godot_bin_cache_hit=${{ steps.godot_bin_cache_raw.outputs.cache-hit }}"
          echo "venv_cache_hit=${{ steps.venv_cache_raw.outputs.cache-hit }}"
          ls -la "${GODOT_CACHE_DIR}/${GODOT_VERSION}" || true

      - name: Run Pytest (raw-oys)
        env:
          GODOT_BIN: /usr/local/bin/godot
        run: |
          ./.venv/bin/pytest --odisea-runner raw-oys -n 2

  # Summary job that other workflows can depend on
  # Only depends on core tests - determinism is optional
  tests-passed:
    name: Core Tests Passed
    needs: [pytest-core]
    if: always() && needs.pytest-core.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.check.outputs.success }}
    steps:
      - name: Check Test Results
        id: check
        run: |
          echo "success=true" >> $GITHUB_OUTPUT
          echo "✅ Core tests passed!"
          echo ""
          echo "Note: Determinism tests run in parallel and don't block this check."
