name: Odyssey Pytest Runner
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_raw_oys:
        description: "Run extended raw-oys suite (slow/experimental)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest-core:
    name: Run Tests (core)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 3.6.2-stable
      GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        id: godot_project_cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.import
            ${{ github.workspace }}/.godot
          key: ${{ runner.os }}-godot-${{ hashFiles('**/project.godot') }}-${{ hashFiles('assets/**') }}
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Cache Godot binary
        id: godot_bin_cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}/${{ env.GODOT_VERSION }}/godot
          key: ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-${{ github.workflow }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-
            ${{ runner.os }}-godot-bin-

      - name: Setup Godot 3.6.2
        run: |
          set -euo pipefail
          TARGET_DIR="${GODOT_CACHE_DIR}/${GODOT_VERSION}"
          TARGET_BIN="${TARGET_DIR}/godot"
          mkdir -p "$TARGET_DIR"
          if [ ! -x "$TARGET_BIN" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            unzip -q "Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            mv "Godot_v${GODOT_VERSION}_linux_headless.64" "$TARGET_BIN"
            chmod +x "$TARGET_BIN"
          fi
          sudo install -m 755 "$TARGET_BIN" /usr/local/bin/godot

      - name: Verify Godot binary
        run: |
          if [ -x /usr/local/bin/godot ]; then
            echo "/usr/local/bin/godot is present and executable"
            /usr/local/bin/godot --version || true
          else
            echo "ERROR: /usr/local/bin/godot not found or not executable"
            ls -l /usr/local/bin || true
            exit 127
          fi

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pytest.txt

      - name: Ensure pip cache dir exists
        run: mkdir -p ~/.cache/pip

      - name: Cache virtualenv
        id: venv_cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-pytest-v1-${{ hashFiles('requirements-pytest.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-pytest-v1-

      - name: Install Pytest
        if: steps.venv_cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r requirements-pytest.txt

      - name: Cache Diagnostics
        run: |
          echo "godot_project_cache_hit=${{ steps.godot_project_cache.outputs.cache-hit }}"
          echo "godot_bin_cache_hit=${{ steps.godot_bin_cache.outputs.cache-hit }}"
          echo "venv_cache_hit=${{ steps.venv_cache.outputs.cache-hit }}"
          ls -la "${GODOT_CACHE_DIR}/${GODOT_VERSION}" || true

      - name: Guard added assets size (<=50MB)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-count=1 HEAD^)"
          fi
          scripts/check_added_file_sizes.sh "${BASE_SHA}" "${GITHUB_SHA}"

      - name: Disable editor plugins for CI import
        run: |
          set -euo pipefail
          cp project.godot project.godot.ci.bak
          awk '
            BEGIN { in_editor_plugins = 0 }
            /^\[editor_plugins\]$/ { in_editor_plugins = 1; print; next }
            in_editor_plugins == 1 && /^enabled=/ {
              print "enabled=PoolStringArray( )"
              in_editor_plugins = 0
              next
            }
            { print }
          ' project.godot.ci.bak > project.godot
          echo "Editor plugins disabled for CI import pass."

      - name: Import + Smoke (self-healing)
        run: |
          set -euo pipefail
          mkdir -p reports

          import_once() {
            local log_file="$1"
            echo "Importing Godot resources..."
            # Let editor scan/import finish; --quit aborts scanner too early in CI.
            set +e
            timeout 90s /usr/local/bin/godot --path . -e --headless --no-window --audio-driver Dummy 2>&1 | tee "$log_file"
            local godot_rc="${PIPESTATUS[0]}"
            set -e
            if [ "$godot_rc" -ne 0 ] && [ "$godot_rc" -ne 124 ]; then
              echo "Godot import command failed with exit code $godot_rc"
              return "$godot_rc"
            fi
            echo "Import complete."
            ls -la .import/ 2>/dev/null | head -10 || true
            local missing=0
            # Critical artifacts needed by autoloads/scenes during test bootstrap.
            ls .import/*Pilot.glb-*.scn >/dev/null 2>&1 || { echo "ERROR: Pilot.glb import artifact not found yet"; missing=1; }
            ls .import/*metal1.wav-*.sample >/dev/null 2>&1 || { echo "ERROR: metal1.wav import artifact not found yet"; missing=1; }
            ls .import/*sfx100v2_door_01.ogg-*.oggstr >/dev/null 2>&1 || { echo "ERROR: sfx100v2_door_01.ogg import artifact not found yet"; missing=1; }
            if [ "$missing" -ne 0 ]; then
              return 1
            fi
          }

          smoke_once() {
            local log_file="$1"
            set +e
            timeout 30s /usr/local/bin/godot --headless --no-window --audio-driver Dummy -s tests/ci_resource_smoke.gd 2>&1 | tee "$log_file"
            local smoke_rc="${PIPESTATUS[0]}"
            set -e
            if [ "$smoke_rc" -ne 0 ] && [ "$smoke_rc" -ne 124 ]; then
              echo "Resource smoke failed with exit code $smoke_rc"
              return "$smoke_rc"
            fi
            if [ "$smoke_rc" -eq 124 ]; then
              echo "Resource smoke timed out."
              return 1
            fi
            if grep -q "\[CI_SMOKE\] Missing resources count:" "$log_file"; then
              return 1
            fi
            # Treat script/parse/import bootstrap errors as smoke failures.
            if grep -E -q "SCRIPT ERROR:|Parse Error:|referenced nonexistent resource|Failed loading resource: res://core_v2/actors/Pilot_v2.tscn|Failed loading resource: res://models/Pilot\\.glb" "$log_file"; then
              return 1
            fi
            return 0
          }

          if ! import_once reports/import_resources.log || ! smoke_once reports/resource_smoke.log; then
            echo "Import/smoke failed after cached import. Retrying once without clearing caches..."
            import_once reports/import_resources_retry.log
            smoke_once reports/resource_smoke_retry.log
          fi

      - name: Run Core Tests
        env:
          GODOT_BIN: /usr/local/bin/godot
          OYS_NODET: "1"
        run: |
          set -euo pipefail
          mkdir -p reports
          # OYS_NODET=1 skips determinism tests
          set +e
          timeout 420s ./runtest.sh -a ./core_v2/tests/ 2>&1 | tee reports/core_tests.log
          test_rc="${PIPESTATUS[0]}"
          set -e
          if [ "$test_rc" -eq 124 ]; then
            echo "Core tests timed out after 420s."
            exit 124
          fi
          exit "$test_rc"

      - name: Publish Test Summary
        if: always()
        run: |
          echo "## Core Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/import_resources.log ]; then
            echo "### Import Diagnostics" >> $GITHUB_STEP_SUMMARY
            grep -E "ERROR:|Failed to load resource|referenced nonexistent resource|Unrecognized binary resource file" reports/import_resources.log | tail -20 >> $GITHUB_STEP_SUMMARY || echo "No import errors detected." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/import_resources_retry.log ]; then
            echo "### Import Diagnostics (Retry)" >> $GITHUB_STEP_SUMMARY
            grep -E "ERROR:|Failed to load resource|referenced nonexistent resource|Unrecognized binary resource file" reports/import_resources_retry.log | tail -20 >> $GITHUB_STEP_SUMMARY || echo "No import errors detected on retry." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/resource_smoke.log ]; then
            echo "### Resource Smoke Check" >> $GITHUB_STEP_SUMMARY
            grep -E "\\[CI_SMOKE\\]" reports/resource_smoke.log | tail -20 >> $GITHUB_STEP_SUMMARY || echo "No smoke output found." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/resource_smoke_retry.log ]; then
            echo "### Resource Smoke Check (Retry)" >> $GITHUB_STEP_SUMMARY
            grep -E "\\[CI_SMOKE\\]" reports/resource_smoke_retry.log | tail -20 >> $GITHUB_STEP_SUMMARY || echo "No retry smoke output found." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f reports/core_tests.log ]; then
            grep -E "PASSED|FAILED|ERROR|✅|❌" reports/core_tests.log | tail -30 >> $GITHUB_STEP_SUMMARY || echo "No results found" >> $GITHUB_STEP_SUMMARY
          fi

  pytest-raw-oys:
    name: Run Pytest (raw-oys)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_raw_oys == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      GODOT_VERSION: 3.6.2-stable
      GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot_bin_cache_raw
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}/${{ env.GODOT_VERSION }}/godot
          key: ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-${{ github.workflow }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-
            ${{ runner.os }}-godot-bin-

      - name: Setup Godot 3.6.2
        run: |
          set -euo pipefail
          TARGET_DIR="${GODOT_CACHE_DIR}/${GODOT_VERSION}"
          TARGET_BIN="${TARGET_DIR}/godot"
          mkdir -p "$TARGET_DIR"
          if [ ! -x "$TARGET_BIN" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            unzip -q "Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            mv "Godot_v${GODOT_VERSION}_linux_headless.64" "$TARGET_BIN"
            chmod +x "$TARGET_BIN"
          fi
          sudo install -m 755 "$TARGET_BIN" /usr/local/bin/godot

      - name: Set up Python
        id: setup_python_raw
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pytest.txt

      - name: Ensure pip cache dir exists (raw-oys)
        run: mkdir -p ~/.cache/pip

      - name: Cache virtualenv
        id: venv_cache_raw
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-pytest-v1-${{ hashFiles('requirements-pytest.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-pytest-v1-

      - name: Install Pytest
        if: steps.venv_cache_raw.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r requirements-pytest.txt

      - name: Cache Diagnostics
        run: |
          echo "godot_bin_cache_hit=${{ steps.godot_bin_cache_raw.outputs.cache-hit }}"
          echo "venv_cache_hit=${{ steps.venv_cache_raw.outputs.cache-hit }}"
          ls -la "${GODOT_CACHE_DIR}/${GODOT_VERSION}" || true

      - name: Run Pytest (raw-oys)
        env:
          GODOT_BIN: /usr/local/bin/godot
        run: |
          ./.venv/bin/pytest --odisea-runner raw-oys -n 2

  # Summary job that other workflows can depend on
  # Only depends on core tests - determinism is optional
  tests-passed:
    name: Core Tests Passed
    needs: [pytest-core]
    if: always() && needs.pytest-core.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.check.outputs.success }}
    steps:
      - name: Check Test Results
        id: check
        run: |
          echo "success=true" >> $GITHUB_OUTPUT
          echo "✅ Core tests passed!"
          echo ""
          echo "Note: Determinism tests run in parallel and don't block this check."
