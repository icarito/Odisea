name: Odyssey Pytest Runner
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_raw_oys:
        description: "Run extended raw-oys suite (slow/experimental)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest-gdunit:
    name: Run Pytest (gdunit-${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            include_determinism: "0"
            pytest_filter: "not test_det__"
          - suite: determinism
            include_determinism: "1"
            pytest_filter: "test_det__"
    env:
      GODOT_VERSION: 3.6.2-stable
      GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        id: godot_project_cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.import
            ${{ github.workspace }}/.godot
          key: ${{ runner.os }}-godot-${{ hashFiles('**/project.godot') }}-${{ hashFiles('assets/**') }}
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Cache Godot binary
        id: godot_bin_cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}/${{ env.GODOT_VERSION }}/godot
          key: ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-${{ github.workflow }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-
            ${{ runner.os }}-godot-bin-

      - name: Setup Godot 3.6.2
        run: |
          set -euo pipefail
          TARGET_DIR="${GODOT_CACHE_DIR}/${GODOT_VERSION}"
          TARGET_BIN="${TARGET_DIR}/godot"
          mkdir -p "$TARGET_DIR"
          if [ ! -x "$TARGET_BIN" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            unzip -q "Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            mv "Godot_v${GODOT_VERSION}_linux_headless.64" "$TARGET_BIN"
            chmod +x "$TARGET_BIN"
          fi
          sudo install -m 755 "$TARGET_BIN" /usr/local/bin/godot

      - name: Verify Godot binary
        run: |
          if [ -x /usr/local/bin/godot ]; then
            echo "/usr/local/bin/godot is present and executable"
            /usr/local/bin/godot --version || true
          else
            echo "ERROR: /usr/local/bin/godot not found or not executable"
            ls -l /usr/local/bin || true
            exit 127
          fi

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pytest.txt

      - name: Ensure pip cache dir exists
        run: mkdir -p ~/.cache/pip

      - name: Cache virtualenv
        id: venv_cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-pytest-v1-${{ hashFiles('requirements-pytest.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-pytest-v1-

      - name: Install Pytest
        if: steps.venv_cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r requirements-pytest.txt

      - name: Cache Diagnostics
        run: |
          echo "godot_project_cache_hit=${{ steps.godot_project_cache.outputs.cache-hit }}"
          echo "godot_bin_cache_hit=${{ steps.godot_bin_cache.outputs.cache-hit }}"
          echo "venv_cache_hit=${{ steps.venv_cache.outputs.cache-hit }}"
          ls -la "${GODOT_CACHE_DIR}/${GODOT_VERSION}" || true

      - name: Import Resources
        run: |
          echo "Importing Godot resources..."
          /usr/local/bin/godot --path . -e --quit --headless 2>&1 | head -50
          echo "Import complete."
          ls -la .import/ 2>/dev/null | head -10 || echo "No .import directory"

      - name: Run Pytest (gdunit)
        env:
          GODOT_BIN: /usr/local/bin/godot
          ODISEA_INCLUDE_DETERMINISM: ${{ matrix.include_determinism }}
        run: |
          mkdir -p reports
          ./.venv/bin/pytest --odisea-runner gdunit -k "${{ matrix.pytest_filter }}" -n 2 --junitxml="reports/pytest_${{ matrix.suite }}.xml"

      - name: Publish Pytest Timing Summary
        if: always()
        env:
          SUITE_NAME: ${{ matrix.suite }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import math
          import os
          import xml.etree.ElementTree as ET

          suite = os.environ.get("SUITE_NAME", "unknown")
          xml_path = f"reports/pytest_{suite}.xml"
          print(f"## Pytest GDUnit Summary (`{suite}`)")

          if not os.path.exists(xml_path):
            print(f"JUnit report not found: `{xml_path}`")
            raise SystemExit(0)

          root = ET.parse(xml_path).getroot()
          testsuite = root.find("testsuite") if root.tag == "testsuites" else root
          if testsuite is None:
            print(f"Invalid JUnit XML in `{xml_path}`")
            raise SystemExit(0)

          total = int(float(testsuite.attrib.get("tests", 0)))
          failures = int(float(testsuite.attrib.get("failures", 0)))
          errors = int(float(testsuite.attrib.get("errors", 0)))
          skipped = int(float(testsuite.attrib.get("skipped", 0)))
          duration = float(testsuite.attrib.get("time", 0.0))
          passed = max(0, total - failures - errors - skipped)

          testcases = []
          for tc in testsuite.findall("testcase"):
            name = tc.attrib.get("name", "(unknown)")
            classname = tc.attrib.get("classname", "")
            full = f"{classname}::{name}" if classname else name
            t = float(tc.attrib.get("time", 0.0))
            status = "passed"
            if tc.find("failure") is not None:
              status = "failed"
            elif tc.find("error") is not None:
              status = "error"
            elif tc.find("skipped") is not None:
              status = "skipped"
            testcases.append((full, t, status))

          sorted_cases = sorted(testcases, key=lambda x: x[1], reverse=True)
          top_n = min(20, len(sorted_cases))

          print(f"- Total: **{total}**")
          print(f"- Passed: **{passed}**")
          print(f"- Failed: **{failures}**")
          print(f"- Errors: **{errors}**")
          print(f"- Skipped: **{skipped}**")
          print(f"- Total Duration: **{duration:.2f}s**")

          if top_n == 0:
            print("No testcases found in report.")
            raise SystemExit(0)

          print("")
          print("### Slowest Tests")
          print("| Test | Time (s) | Status |")
          print("|---|---:|---|")
          for full, t, status in sorted_cases[:top_n]:
            icon = "✅" if status == "passed" else ("⏭️" if status == "skipped" else "❌")
            print(f"| `{full}` | {t:.3f} | {icon} {status} |")

          def fmt_hms(total_seconds):
            total_seconds = max(0, int(total_seconds))
            h = total_seconds // 3600
            m = (total_seconds % 3600) // 60
            s = total_seconds % 60
            return f"{h:02d}:{m:02d}:{s:02d}"

          print("")
          print(f"### Gantt (Top {top_n} Slowest, Parallel View)")
          print("All bars start at `00:00:00`; width is each test runtime.")
          print("```mermaid")
          print("gantt")
          print(f"  title Pytest {suite} - slowest tests (parallel durations)")
          print("  dateFormat HH:mm:ss")
          print("  axisFormat %M:%S")
          print("  section Tests")

          for i, (full, t, _status) in enumerate(sorted_cases[:top_n], start=1):
            label = full.replace(":", "_").replace("|", "_")
            if len(label) > 64:
              label = label[:61] + "..."
            dur = max(1, int(math.ceil(t)))
            print(f"  {label} :t{i}, {fmt_hms(0)}, {dur}s")

          print("```")
          PY

  pytest-raw-oys:
    name: Run Pytest (raw-oys)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_raw_oys == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      GODOT_VERSION: 3.6.2-stable
      GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: godot_bin_cache_raw
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}/${{ env.GODOT_VERSION }}/godot
          key: ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-${{ github.workflow }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-
            ${{ runner.os }}-godot-bin-

      - name: Setup Godot 3.6.2
        run: |
          set -euo pipefail
          TARGET_DIR="${GODOT_CACHE_DIR}/${GODOT_VERSION}"
          TARGET_BIN="${TARGET_DIR}/godot"
          mkdir -p "$TARGET_DIR"
          if [ ! -x "$TARGET_BIN" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            unzip -q "Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            mv "Godot_v${GODOT_VERSION}_linux_headless.64" "$TARGET_BIN"
            chmod +x "$TARGET_BIN"
          fi
          sudo install -m 755 "$TARGET_BIN" /usr/local/bin/godot

      - name: Set up Python
        id: setup_python_raw
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pytest.txt

      - name: Ensure pip cache dir exists (raw-oys)
        run: mkdir -p ~/.cache/pip

      - name: Cache virtualenv
        id: venv_cache_raw
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-pytest-v1-${{ hashFiles('requirements-pytest.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-pytest-v1-

      - name: Install Pytest
        if: steps.venv_cache_raw.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -r requirements-pytest.txt

      - name: Cache Diagnostics
        run: |
          echo "godot_bin_cache_hit=${{ steps.godot_bin_cache_raw.outputs.cache-hit }}"
          echo "venv_cache_hit=${{ steps.venv_cache_raw.outputs.cache-hit }}"
          ls -la "${GODOT_CACHE_DIR}/${GODOT_VERSION}" || true

      - name: Run Pytest (raw-oys)
        env:
          GODOT_BIN: /usr/local/bin/godot
        run: |
          ./.venv/bin/pytest --odisea-runner raw-oys -n 2

  # Summary job that other workflows can depend on
  tests-passed:
    name: All Tests Passed
    needs: [pytest-gdunit]
    if: always() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.check.outputs.success }}
    steps:
      - name: Check Test Results
        id: check
        run: |
          if [ "${{ needs.pytest-gdunit.result }}" == "success" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "✅ All tests passed!"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "❌ Some tests failed"
            exit 1
          fi
