name: Asset Integrity

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/asset_integrity.yml'
      - '.githooks/pre-commit'
      - '.githooks/pre-push'
      - 'ci/critical_imports.json'
      - 'project.godot'
      - 'tests/ci_resource_smoke.gd'
      - 'tests/ci_resource_smoke_asset_integrity.gd'
      - 'scripts/check_tracked_imports.py'
      - 'scripts/check_critical_import_artifacts.py'
      - 'scripts/godot_import_smoke.sh'
      - 'models/**'
      - 'core_v2/actors/**'
      - 'core_v2/props/**'
      - 'core_v2/levels/**'
      - '**/*.import'
      - '.import/**'
      # Reusables de CI: cambiarlos debe disparar este workflow (gap de #378).
      - '.github/workflows/_setup_godot.yml'
      - '.github/workflows/_validate_imports.yml'
      - '.github/workflows/_import_smoke.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/asset_integrity.yml'
      - '.githooks/pre-commit'
      - '.githooks/pre-push'
      - 'ci/critical_imports.json'
      - 'project.godot'
      - 'tests/ci_resource_smoke.gd'
      - 'tests/ci_resource_smoke_asset_integrity.gd'
      - 'scripts/check_tracked_imports.py'
      - 'scripts/check_critical_import_artifacts.py'
      - 'scripts/godot_import_smoke.sh'
      - 'models/**'
      - 'core_v2/actors/**'
      - 'core_v2/props/**'
      - 'core_v2/levels/**'
      - '**/*.import'
      - '.import/**'
      # Reusables de CI: cambiarlos debe disparar este workflow (gap de #378).
      - '.github/workflows/_setup_godot.yml'
      - '.github/workflows/_validate_imports.yml'
      - '.github/workflows/_import_smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup-godot:
    uses: ./.github/workflows/_setup_godot.yml
    with:
      cache_key_suffix: 'asset-integrity'
      cache_import: true
      import_cache_paths: '["assets/**", "textures/**", "models/**", "core_v2/audio/**", "core_v2/actors/**", "core_v2/components/**", "core_v2/props/**", "core_v2/levels/**"]'

  validate-imports:
    needs: setup-godot
    uses: ./.github/workflows/_validate_imports.yml

  import-smoke:
    needs: [setup-godot, validate-imports]
    uses: ./.github/workflows/_import_smoke.yml
    with:
      godot_bin: ${{ needs.setup-godot.outputs.godot_bin }}
      clean_cache: '1'
      import_mode: 'quick'
      smoke_script: 'tests/ci_resource_smoke_asset_integrity.gd'
      # Asset Integrity es un rebuild limpio: no reintentar imports ni escalar a full.
      allow_import_retry: '0'
      allow_full_escalation: '0'
      import_log: 'reports/import_resources_asset_integrity.log'
      import_retry_log: 'reports/import_resources_asset_integrity_retry.log'
      smoke_log: 'reports/resource_smoke_asset_integrity.log'
      smoke_retry_log: 'reports/resource_smoke_asset_integrity_retry.log'