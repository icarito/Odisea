name: Stress & Performance Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      simulate_regression:
        description: "Inject a synthetic regression to validate failure/reporting"
        required: false
        default: false
        type: boolean
      fps_tolerance:
        description: "Minimum FPS ratio vs baseline (e.g. 0.97 = max 3% drop)"
        required: false
        default: "0.97"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 3.6.2-stable
  EXPORT_NAME: Odisea

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIMULATE_REGRESSION: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_regression || 'false' }}
      FPS_TOLERANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.fps_tolerance || '0.97' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Godot project cache
        id: godot_project_cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.import
          key: godot-stress-${{ runner.os }}-v2-${{ hashFiles('assets/**', 'core_v2/audio/**', 'core_v2/actors/**', 'core_v2/components/**') }}
          restore-keys: |
            godot-stress-${{ runner.os }}-v2-

      - name: Setup Godot
        run: |
          # Install Godot 3.6.2 manually
          wget -q https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip
          unzip -q Godot_v3.6.2-stable_linux_headless.64.zip
          sudo mv Godot_v3.6.2-stable_linux_headless.64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          # Install runtime dependencies for xvfb/godot
          sudo apt-get update
          # libasound2 is libasound2t64 on Ubuntu 24.04 (Noble)
          sudo apt-get install -y xvfb libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64 libpulse0 libgl1 mesa-utils

      - name: Setup Environment
        run: |
          mkdir -p ~/.local/share/godot/app_userdata/Odisea/
          export GODOT_BIN=godot

      - name: Disable gdUnit addon for stress pipeline
        run: |
          set -euo pipefail
          if [ -d addons/gdUnit3 ]; then
            mkdir -p /tmp/odisea_ci_disabled
            mv addons/gdUnit3 /tmp/odisea_ci_disabled/gdUnit3
          fi

      - name: Disable editor plugins for CI import
        run: |
          set -euo pipefail
          cp project.godot project.godot.ci.bak
          awk '
            BEGIN { in_editor_plugins = 0 }
            /^\[editor_plugins\]$/ { in_editor_plugins = 1; print; next }
            in_editor_plugins == 1 && /^enabled=/ {
              print "enabled=PoolStringArray( )"
              in_editor_plugins = 0
              next
            }
            { print }
          ' project.godot.ci.bak > project.godot
          echo "Editor plugins disabled for CI import pass."

      - name: Import + Smoke (self-healing)
        run: |
          set -euo pipefail
          mkdir -p reports

          import_once() {
            local log_file="$1"
            echo "Importing Godot resources (project-wide prewarm)..."
            set +e
            timeout 600s /usr/local/bin/godot --path . -e --headless --no-window --audio-driver Dummy 2>&1 | tee "$log_file"
            local godot_rc="${PIPESTATUS[0]}"
            set -e
            if [ "$godot_rc" -eq 124 ]; then
              echo "Godot import timed out before completing imports."
              return 1
            fi
            if [ "$godot_rc" -ne 0 ]; then
              echo "Godot import command failed with exit code $godot_rc"
              return "$godot_rc"
            fi
            echo "Import complete."
            return 0
          }

          smoke_once() {
            local log_file="$1"
            set +e
            timeout 180s /usr/local/bin/godot --headless --no-window --audio-driver Dummy -s tests/ci_resource_smoke.gd 2>&1 | tee "$log_file"
            local smoke_rc="${PIPESTATUS[0]}"
            set -e
            if [ "$smoke_rc" -ne 0 ] && [ "$smoke_rc" -ne 124 ]; then
              echo "Resource smoke failed with exit code $smoke_rc"
              return "$smoke_rc"
            fi
            if [ "$smoke_rc" -eq 124 ]; then
              echo "Resource smoke timed out."
              return 1
            fi
            if grep -q "\[CI_SMOKE\] Missing resources count:" "$log_file"; then
              return 1
            fi
            if grep -E -q "SCRIPT ERROR:|Parse Error:|referenced nonexistent resource|No loader found for resource|Failed loading resource: res://core_v2/actors/Pilot_v2.tscn" "$log_file"; then
              return 1
            fi
            return 0
          }

          import_ok=0
          smoke_ok=0
          if import_once reports/import_resources_stress.log; then
            import_ok=1
          fi
          if smoke_once reports/resource_smoke_stress.log; then
            smoke_ok=1
          fi
          if [ "$smoke_ok" -eq 0 ]; then
            echo "Smoke still failing. Running one extra import+smoke retry..."
            import_once reports/import_resources_stress_retry.log || true
            smoke_once reports/resource_smoke_stress_retry.log
          fi
          if [ "$import_ok" -eq 0 ] && [ "$smoke_ok" -eq 1 ]; then
            echo "Import timed out but smoke passed; skipping extra import work."
          fi

      - name: Capture Host Environment
        run: |
          set -euo pipefail
          CPU_MODEL="$(awk -F: '/model name/ {gsub(/^ +/, "", $2); print $2; exit}' /proc/cpuinfo || true)"
          CPU_CORES="$(nproc || true)"
          MEM_TOTAL_GB="$(awk '/MemTotal/ {printf "%.2f", $2/1024/1024}' /proc/meminfo || echo unknown)"
          KERNEL="$(uname -srmo || true)"
          GPU_INFO="$(lspci 2>/dev/null | grep -Ei 'vga|3d|display' | head -n 1 || true)"
          if [ -z "${GPU_INFO}" ]; then
            if [ -d /dev/dri ]; then
              GPU_INFO="Detected /dev/dri devices: $(ls /dev/dri 2>/dev/null | tr '\n' ' ')"
            else
              GPU_INFO="No GPU device detected (headless/virtualized runner likely)."
            fi
          fi

          {
            echo "## Host Environment"
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Runner | \`${RUNNER_OS:-unknown}\` \`${RUNNER_ARCH:-unknown}\` |"
            echo "| Kernel | \`${KERNEL}\` |"
            echo "| CPU Model | ${CPU_MODEL:-unknown} |"
            echo "| CPU Logical Cores | ${CPU_CORES:-unknown} |"
            echo "| RAM Total (GiB) | ${MEM_TOTAL_GB:-unknown} |"
            echo "| GPU / Display Device | ${GPU_INFO} |"
          } >> "$GITHUB_STEP_SUMMARY"

          export RUNNER_OS="${RUNNER_OS:-unknown}"
          export RUNNER_ARCH="${RUNNER_ARCH:-unknown}"
          export KERNEL CPU_MODEL CPU_CORES MEM_TOTAL_GB GPU_INFO
          python3 - <<'PY'
          import json
          import os
          data = {
            "runner_os": os.environ.get("RUNNER_OS", "unknown"),
            "runner_arch": os.environ.get("RUNNER_ARCH", "unknown"),
            "kernel": os.environ.get("KERNEL", "unknown"),
            "cpu_model": os.environ.get("CPU_MODEL", "unknown"),
            "cpu_logical_cores": os.environ.get("CPU_CORES", "unknown"),
            "ram_total_gib": os.environ.get("MEM_TOTAL_GB", "unknown"),
            "gpu_info": os.environ.get("GPU_INFO", "unknown"),
          }
          with open("performance_host_info.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          PY

      - name: Restore Performance Cache
        id: perf_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            performance_baseline.json
            performance_history.json
          key: performance-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            performance-cache-${{ runner.os }}-${{ github.ref_name }}-
            performance-cache-${{ runner.os }}-main-

      - name: Run Stress Tests (Headless)
        run: |
          set -euo pipefail
          mkdir -p reports
          # Run the OYS script using the debug runner after resource smoke/import.
          # We use xvfb-run even with headless mode to ensure visual server initializes for viewports/captures if needed.
          set +e
          timeout 600 xvfb-run godot --headless --no-window -s tests/debug_runner.gd --test-file core_v2/tests/stress/run_stress.oys 2>&1 | tee reports/stress_runner.log
          stress_rc="${PIPESTATUS[0]}"
          set -e
          if [ "$stress_rc" -eq 124 ]; then
            echo "Stress runner timed out after 600s."
            exit 124
          fi
          if [ "$stress_rc" -ne 0 ]; then
            echo "Stress runner failed with exit code $stress_rc"
            exit "$stress_rc"
          fi

          # Move result to workspace
          if [ ! -f ~/.local/share/godot/app_userdata/Odisea/performance_snapshots.json ]; then
            echo "Stress runner did not produce performance_snapshots.json"
            exit 1
          fi
          mv ~/.local/share/godot/app_userdata/Odisea/performance_snapshots.json performance_current.json

      - name: Check for Regressions
        env:
          ODISEA_SIMULATE_REGRESSION: ${{ env.SIMULATE_REGRESSION }}
          ODISEA_FPS_TOLERANCE: ${{ env.FPS_TOLERANCE }}
          # Shared CI runners are too noisy for CPU-based gating; gate only by FPS.
          ODISEA_CPU_TOLERANCE: "9999"
        run: |
          python3 scripts/check_regression.py \
            performance_current.json \
            performance_baseline.json \
            performance_history.json >> "$GITHUB_STEP_SUMMARY"

      - name: Update Baseline (Main Only)
        if: github.ref == 'refs/heads/main' && env.SIMULATE_REGRESSION != 'true'
        run: |
          cp performance_current.json performance_baseline.json

      - name: Save Performance Cache
        if: always() && env.SIMULATE_REGRESSION != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            performance_baseline.json
            performance_history.json
          key: performance-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            performance_current.json
            performance_history.json
            performance_baseline.json
            performance_host_info.json
