name: Stress & Performance Tests

on:
  workflow_dispatch:
    inputs:
      simulate_regression:
        description: "Inject a synthetic regression to validate failure/reporting"
        required: false
        default: false
        type: boolean
      fps_tolerance:
        description: "Minimum FPS ratio vs baseline (e.g. 0.97 = max 3% drop)"
        required: false
        default: "0.97"
        type: string
  schedule:
    # Nightly at 3 AM UTC (después del job de determinismo, 2 AM).
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Runtime del fork (modulo Box3D); release en .github/box3d_release.
  EXPORT_NAME: Odisea
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      SIMULATE_REGRESSION: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_regression || 'false' }}
      FPS_TOLERANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.fps_tolerance || '0.97' }}
      ANNA_V2_NO_CENTRAL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore Godot project cache
        id: godot_project_cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.import
          # Key estable alineada con export_all/determinism: solo project.godot +
          # manifests *.import trackeados, no el .import/** generado ni assets crudos.
          key: godot-stress-${{ runner.os }}-v4-${{ hashFiles('**/project.godot') }}-${{ hashFiles('**/*.import') }}
          restore-keys: |
            godot-stress-${{ runner.os }}-v4-${{ hashFiles('**/project.godot') }}-
            godot-stress-${{ runner.os }}-v4-
            godot-stress-${{ runner.os }}-v3-

      - name: Setup Godot (Box3D fork)
        run: |
          set -euo pipefail
          # El binario stock no trae el modulo Box3D y el proyecto cae a Bullet en
          # silencio -- inaceptable justo aca, donde se mide rendimiento de fisica.
          BOX3D_RELEASE="$(cat .github/box3d_release)"
          curl -fSL -o /tmp/godot-box3d \
            "https://github.com/icarito/godot-box3d-3/releases/download/${BOX3D_RELEASE}/godot.box3d.linux.x86_64.headless"
          sudo install -m 755 /tmp/godot-box3d /usr/local/bin/godot
          godot --version

          # Install runtime dependencies for xvfb/godot
          sudo apt-get update
          # libasound2 is libasound2t64 on Ubuntu 24.04 (Noble)
          sudo apt-get install -y xvfb libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64 libpulse0 libgl1 mesa-utils

      - name: Setup Environment
        run: |
          mkdir -p ~/.local/share/godot/app_userdata/Odisea/
          export GODOT_BIN=godot

      - name: Disable gdUnit addon for stress pipeline
        run: |
          set -euo pipefail
          if [ -d addons/gdUnit3 ]; then
            mkdir -p /tmp/odisea_ci_disabled
            mv addons/gdUnit3 /tmp/odisea_ci_disabled/gdUnit3
          fi

      - name: Validate tracked import manifests
        run: |
          set -euo pipefail
          python3 scripts/check_tracked_imports.py

      - name: Validate critical import artifacts
        run: |
          set -euo pipefail
          python3 scripts/check_critical_import_artifacts.py

      - name: Import + Smoke (self-healing)
        run: |
          set -euo pipefail
          scripts/godot_import_smoke.sh \
            --godot-bin /usr/local/bin/godot \
            --project-path . \
            --import-log reports/import_resources_stress.log \
            --smoke-log reports/resource_smoke_stress.log \
            --smoke-retry-log reports/resource_smoke_stress_retry.log \
            --timeout-import 600 \
            --timeout-smoke 180 \
            --clean-cache 0 \
            --disable-editor-plugins 1 \
            --xvfb 0 \
            --force-software 0 \
            --import-mode auto \
            --allow-smoke-retry 1

      - name: Capture Host Environment
        run: |
          set -euo pipefail
          CPU_MODEL="$(awk -F: '/model name/ {gsub(/^ +/, "", $2); print $2; exit}' /proc/cpuinfo || true)"
          CPU_CORES="$(nproc || true)"
          MEM_TOTAL_GB="$(awk '/MemTotal/ {printf "%.2f", $2/1024/1024}' /proc/meminfo || echo unknown)"
          KERNEL="$(uname -srmo || true)"
          GPU_INFO="$(lspci 2>/dev/null | grep -Ei 'vga|3d|display' | head -n 1 || true)"
          if [ -z "${GPU_INFO}" ]; then
            if [ -d /dev/dri ]; then
              GPU_INFO="Detected /dev/dri devices: $(ls /dev/dri 2>/dev/null | tr '\n' ' ')"
            else
              GPU_INFO="No GPU device detected (headless/virtualized runner likely)."
            fi
          fi

          {
            echo "## Host Environment"
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Runner | \`${RUNNER_OS:-unknown}\` \`${RUNNER_ARCH:-unknown}\` |"
            echo "| Kernel | \`${KERNEL}\` |"
            echo "| CPU Model | ${CPU_MODEL:-unknown} |"
            echo "| CPU Logical Cores | ${CPU_CORES:-unknown} |"
            echo "| RAM Total (GiB) | ${MEM_TOTAL_GB:-unknown} |"
            echo "| GPU / Display Device | ${GPU_INFO} |"
          } >> "$GITHUB_STEP_SUMMARY"

          export RUNNER_OS="${RUNNER_OS:-unknown}"
          export RUNNER_ARCH="${RUNNER_ARCH:-unknown}"
          export KERNEL CPU_MODEL CPU_CORES MEM_TOTAL_GB GPU_INFO
          python3 - <<'PY'
          import json
          import os
          data = {
            "runner_os": os.environ.get("RUNNER_OS", "unknown"),
            "runner_arch": os.environ.get("RUNNER_ARCH", "unknown"),
            "kernel": os.environ.get("KERNEL", "unknown"),
            "cpu_model": os.environ.get("CPU_MODEL", "unknown"),
            "cpu_logical_cores": os.environ.get("CPU_CORES", "unknown"),
            "ram_total_gib": os.environ.get("MEM_TOTAL_GB", "unknown"),
            "gpu_info": os.environ.get("GPU_INFO", "unknown"),
          }
          with open("performance_host_info.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          PY

      # Historial y baseline salen de los artifacts de corridas previas, NO de
      # actions/cache: el repo pasa el limite de 10 GB de cache y el LRU desalojaba
      # este cache chico cada noche, dejando el historial en 1 corrida (sin grafico).
      - name: Restore Performance History (previous run artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev_dir=/tmp/perf_prev
          mkdir -p "$prev_dir"
          list_runs() {
            gh run list -R "$GITHUB_REPOSITORY" --workflow stress_performance.yml \
              --branch "$1" --status completed -L 20 \
              --json databaseId -q '.[].databaseId'
          }
          runs="$(list_runs "$GITHUB_REF_NAME" || true)"
          [ -n "$runs" ] || runs="$(list_runs main || true)"
          for id in $runs; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n performance-report \
              -D "$prev_dir/$id" >/dev/null 2>&1 || echo "run $id: no performance-report"
          done
          python3 - "$prev_dir" <<'PY'
          import json, os, sys
          prev = sys.argv[1]
          history, baseline = [], None
          # gh run list devuelve lo mas nuevo primero; el historial va de viejo a nuevo.
          for run_id in sorted(os.listdir(prev), key=int):
              d = os.path.join(prev, run_id)
              try:
                  with open(os.path.join(d, "performance_current.json")) as f:
                      current = json.load(f)
              except Exception:
                  continue
              sha = ""
              try:
                  with open(os.path.join(d, "performance_history.json")) as f:
                      sha = next((h.get("sha", "") for h in json.load(f) if str(h.get("run_id")) == run_id), "")
              except Exception:
                  pass
              history.append({"sha": sha, "ref_name": "", "run_id": run_id, "timestamp_utc": "",
                              "metrics": {i["tag"]: i for i in current if isinstance(i, dict) and i.get("tag")}})
              if os.path.exists(os.path.join(d, "performance_baseline.json")):
                  baseline = os.path.join(d, "performance_baseline.json")
          with open("performance_history.json", "w") as f:
              json.dump(history, f, indent=2)
          if baseline:
              with open(baseline) as src, open("performance_baseline.json", "w") as dst:
                  dst.write(src.read())
          # Baseline del benchmark de Box3D workers (mismo mecanismo de artifacts).
          def box3d_candidates(name):
              return sorted(
                  (os.path.join(root, f) for root, _, files in os.walk(prev) for f in files if f == name),
                  key=os.path.getmtime)
          boxes = box3d_candidates("box3d_workers_baseline.json") or box3d_candidates("box3d_workers_current.json")
          if boxes:
              import shutil
              shutil.copyfile(boxes[-1], "box3d_workers_baseline.json")
              print("box3d baseline:", boxes[-1])
          print(f"history entries: {len(history)}, baseline: {baseline}")
          PY

      - name: Run Stress Tests (Headless)
        run: |
          set -euo pipefail
          mkdir -p reports
          # Run the stress OYS directly via the SessionManager auto-run contract.
          # We use xvfb-run even with headless mode to ensure visual server initializes for viewports/captures if needed.
          set +e
          timeout 600 env OYS_AUTO_RUN=res://core_v2/tests/stress/run_stress.oys \
            xvfb-run godot --headless --no-window --audio-driver Dummy 2>&1 | tee reports/stress_runner.log
          stress_rc="${PIPESTATUS[0]}"
          set -e
          if [ "$stress_rc" -eq 124 ]; then
            echo "Stress runner timed out after 600s."
            exit 124
          fi
          if [ "$stress_rc" -ne 0 ]; then
            echo "Stress runner failed with exit code $stress_rc"
            exit "$stress_rc"
          fi

          # Move result to workspace
          if [ ! -f ~/.local/share/godot/app_userdata/Odisea/performance_snapshots.json ]; then
            echo "Stress runner did not produce performance_snapshots.json"
            exit 1
          fi
          mv ~/.local/share/godot/app_userdata/Odisea/performance_snapshots.json performance_current.json

      - name: Box3D Workers Benchmark
        run: |
          set -euo pipefail
          mkdir -p reports
          # physics/3d/box3d_workers se lee al crear el world (arranque del motor),
          # asi que se fija por override.cfg (gitignored): un run headless por valor.
          # Se compara serial (1) contra ~mitad de los cores, que es el optimo medido.
          cores="$(nproc)"
          half="$(( cores / 2 ))"
          [ "$half" -lt 1 ] && half=1
          for w in 1 "$half"; do
            printf '[physics]\n3d/box3d_workers=%s\n' "$w" > override.cfg
            BOX3D_BENCH_OUT="reports/box3d_workers_$w.json" \
              timeout 300 xvfb-run godot --headless --no-window --audio-driver Dummy \
              --path . --script res://core_v2/tests/stress/box3d_workers_bench.gd 2>&1 \
              | tee "reports/box3d_workers_$w.log"
          done
          rm -f override.cfg
          python3 scripts/box3d_workers_report.py

      - name: Check for Regressions
        env:
          ODISEA_SIMULATE_REGRESSION: ${{ env.SIMULATE_REGRESSION }}
          ODISEA_FPS_TOLERANCE: ${{ env.FPS_TOLERANCE }}
          # Shared CI runners are too noisy for CPU-based gating; gate only by FPS.
          ODISEA_CPU_TOLERANCE: "9999"
        run: |
          python3 scripts/check_regression.py \
            performance_current.json \
            performance_baseline.json \
            performance_history.json >> "$GITHUB_STEP_SUMMARY"

      - name: Update Baseline (Main Only)
        if: github.ref == 'refs/heads/main' && env.SIMULATE_REGRESSION != 'true'
        run: |
          cp performance_current.json performance_baseline.json
          cp box3d_workers_current.json box3d_workers_baseline.json || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-report
          path: |
            performance_current.json
            performance_history.json
            performance_baseline.json
            performance_host_info.json
            box3d_workers_current.json
            box3d_workers_baseline.json
