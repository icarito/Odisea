name: Release Multiplataforma

# Releases are gated on a green test run: this workflow only fires after
# "Odyssey Pytest Runner" completes on main/release, and prep aborts unless
# that run concluded with success. This prevents broken commits (e.g. a
# GDScript syntax error merged to main) from triggering a multiplatform
# export or publishing a release. `workflow_dispatch` still allows manual
# builds, which bypass the gate intentionally.
on:
  workflow_run:
    workflows: [ "Odyssey Pytest Runner" ]
    types: [ completed ]
    branches: [ "main", "release" ]
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Platform to build'
        required: true
        default: all
        type: choice
        options:
          - all
          - linux_x64
          - linux_arm64
          - windows
          - macos
          - ios
          - android
          - html5
      publish_prerelease:
        description: 'Publish a GitHub pre-release from this manual build'
        required: false
        default: false
        type: boolean
      version:
        description: 'Version tag override (optional, e.g. v1.0.0-preview)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

# Solo el export más reciente por rama debe correr: si entra un run nuevo (push a
# main vía workflow_run, o un dispatch) mientras hay uno en curso de la misma rama,
# se cancela el viejo. Se agrupa por la rama del CÓDIGO buildeado: bajo workflow_run
# github.ref apunta al archivo del workflow (default branch), así que usamos
# head_branch del run que disparó; bajo dispatch, github.ref_name.
concurrency:
  group: export-all-${{ github.event.workflow_run.head_branch || github.ref_name }}-${{ github.event.inputs.target_platform || 'all' }}
  cancel-in-progress: true

jobs:
  prep:
    runs-on: ubuntu-latest
    # Only run when the triggering test run succeeded. Manual dispatches have
    # no workflow_run payload, so the conclusion check passes through.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      base_version: ${{ steps.meta.outputs.base_version }}
      # Slug seguro para nombres de archivo/URL (sin espacios ni paréntesis): el
      # VERSION humano "0.1.0-nightly+sha (fecha)" rompía los nombres de asset y las
      # URLs de descarga del manifest (GitHub sanitiza el asset y el filename dejaba
      # de coincidir -> 404). version_slug se usa SOLO para nombres; version sigue
      # siendo el string humano que muestra el juego.
      version_slug: ${{ steps.meta.outputs.version_slug }}
      sha: ${{ steps.meta.outputs.sha }}
      channel: ${{ steps.meta.outputs.channel }}
      # Android needs a monotonic integer versionCode or the device refuses to
      # update over an existing install. We derive it from the git commit count
      # (always increases). version_name reuses the human version string.
      android_version_code: ${{ steps.meta.outputs.android_version_code }}
      android_version_name: ${{ steps.meta.outputs.android_version_name }}
      # release_sequence/build_id del manifest de update: el cliente compara
      # seq <= last_seq para decidir "más nueva". github.run_id NO es monotónico
      # creciente (un build viejo con run_id mayor bloqueaba uno nuevo). Usamos
      # run_number: entero monotónico simple, el mismo que el versionCode del APK.
      build_seq: ${{ steps.meta.outputs.build_seq }}
      # Branch and full SHA, normalized across workflow_run and workflow_dispatch
      # so downstream jobs never have to read github.ref / github.event_name,
      # which mean different things under workflow_run.
      ref_name: ${{ steps.meta.outputs.ref_name }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      is_dispatch: ${{ steps.meta.outputs.is_dispatch }}
      publish_prerelease: ${{ steps.meta.outputs.publish_prerelease }}
      target_platform: ${{ steps.meta.outputs.target_platform }}
      platforms: ${{ steps.meta.outputs.platforms }}
    steps:
      - id: ctx
        run: |
          # Resolve the branch and commit being built. Under workflow_run these
          # come from the triggering run; under workflow_dispatch from the ref
          # the workflow was launched against.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            REF_NAME="${{ github.event.workflow_run.head_branch }}"
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            REF_NAME="${{ github.ref_name }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          echo "ref_name=$REF_NAME" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ctx.outputs.head_sha }}
      - id: meta
        env:
          REF_NAME: ${{ steps.ctx.outputs.ref_name }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
        run: |
          SHA=$(git rev-parse --short "$HEAD_SHA")
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "ref_name=$REF_NAME" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT

          IS_DISPATCH=false
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && IS_DISPATCH=true
          echo "is_dispatch=$IS_DISPATCH" >> $GITHUB_OUTPUT
          echo "publish_prerelease=${{ github.event.inputs.publish_prerelease }}" >> $GITHUB_OUTPUT

          TARGET_PLATFORM="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_PLATFORM="${{ github.event.inputs.target_platform }}"
            [ -n "$TARGET_PLATFORM" ] || TARGET_PLATFORM="all"
          else
            # Automatic workflow_run builds may select one platform from the
            # triggering commit message, e.g. "Fix mac signing [build:macos]".
            # With no directive, preserve the normal multiplatform build.
            # `[build:none]` skips the export entirely: for commits that touch
            # nothing the game binaries ship (dashboard, central, docs, CI).
            COMMIT_MESSAGE=$(git log -1 --format=%B "$HEAD_SHA")
            COMMIT_TARGET=$(printf '%s\n' "$COMMIT_MESSAGE" | sed -nE \
              's/.*\[build:(all|none|linux_x64|linux_arm64|windows|macos|ios|android|html5)\].*/\1/p' | tail -n 1)
            [ -z "$COMMIT_TARGET" ] || TARGET_PLATFORM="$COMMIT_TARGET"
          fi
          ALL_PLATFORMS='[
            {"platform":"linux_x64","os":"ubuntu-latest","preset":"Linux/X11 x86_64","artifact_name":"Odisea-Tech-Demo-Linux"},
            {"platform":"linux_arm64","os":"ubuntu-latest","preset":"Linux/X11 ARM64","artifact_name":"Odisea-Tech-Demo-Linux-ARM64"},
            {"platform":"windows","os":"ubuntu-latest","preset":"Windows Desktop","artifact_name":"Odisea-Tech-Demo-Windows"},
            {"platform":"macos","os":"ubuntu-latest","preset":"macOS Universal","artifact_name":"Odisea-Tech-Demo-macOS"},
            {"platform":"ios","os":"macos-latest","preset":"iOS","artifact_name":"Odisea-Tech-Demo-iOS"},
            {"platform":"android","os":"ubuntu-latest","preset":"Android","artifact_name":"Odisea-Tech-Demo-Android","container":"barichello/godot-ci:3.6.2"},
            {"platform":"html5","os":"ubuntu-latest","preset":"HTML5 Threads","artifact_name":"Odisea-Tech-Demo-Web"}
          ]'
          case "$TARGET_PLATFORM" in
            all)
              PLATFORMS=$(printf '%s' "$ALL_PLATFORMS" | jq -c .)
              ;;
            none)
              # Empty matrix; the export job is also gated off via `if` below, and
              # every downstream job already requires target_platform == 'all'.
              PLATFORMS='[]'
              echo "::notice::[build:none] en el commit: se omite el export multiplataforma."
              ;;
            linux_x64|linux_arm64|windows|macos|ios|android|html5)
              PLATFORMS=$(printf '%s' "$ALL_PLATFORMS" | jq -c --arg platform "$TARGET_PLATFORM" \
                '[.[] | select(.platform == $platform)]')
              ;;
            *)
              echo "::error::Unknown target platform: $TARGET_PLATFORM"
              exit 1
              ;;
          esac
          echo "target_platform=$TARGET_PLATFORM" >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"

          # Base version from project.godot. Godot la escribe como "config/version="
          # bajo la sección [application] (no "application/config/version="), así que
          # el grep anterior nunca matcheaba y caía SIEMPRE al fallback 0.1.0,
          # ignorando la versión real (v0.3.2). Aceptamos ambas formas. Se quita un
          # eventual prefijo "v" para que el versionado sea numérico.
          BASE_VERSION=$(grep -E "^(application/)?config/version=" project.godot | head -n 1 | cut -d'"' -f2 | sed -E 's/^v//' || true)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="0.1.0"
          fi
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT

          # Determine channel
          CHANNEL="dev"
          if [ "$REF_NAME" = "main" ]; then
            CHANNEL="nightly"
          elif [ "$REF_NAME" = "release" ]; then
            CHANNEL="release"
          fi

          # Manual overrides. Un workflow_dispatch NUNCA debe publicar un release
          # estable: hoy solo se publica nightly. Antes, un dispatch sin marcar
          # publish_prerelease ponía CHANNEL=release y el job 'release' publicaba un
          # tag 0.1.0 no querido. Un dispatch desde la rama 'release' sí libera; desde
          # cualquier otra rama (p.ej. main) queda en nightly.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$REF_NAME" != "release" ]; then
            CHANNEL="nightly"
          fi
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

          # Construct version with date (FD-234). Incluimos el build number del run
          # de "Release Multiplataforma" (github.run_number) para trazabilidad directa:
          # ese número es clickeable al run de Actions y es el mismo build_id/
          # release_sequence que usa el update. El commit (+sha) queda a la vista.
          # Ej: "0.3.2-nightly.230+5d024b6 (2026-06-23)".
          BUILD_DATE=$(date -u +%Y-%m-%d)
          BUILD_NUM="${{ github.run_number }}"
          VERSION="$BASE_VERSION"
          if [ "$CHANNEL" = "nightly" ]; then
            VERSION="$BASE_VERSION-nightly.$BUILD_NUM+$SHA ($BUILD_DATE)"
          else
            VERSION="$BASE_VERSION.$BUILD_NUM ($BUILD_DATE)"
          fi
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # version_slug: VERSION sin caracteres problemáticos para filenames/URLs.
          # Quita "(...)" (la fecha), colapsa espacios y deja solo [A-Za-z0-9.+_-].
          VERSION_SLUG=$(echo "$VERSION" | sed -E 's/\([^)]*\)//g; s/[[:space:]]+//g; s/[^A-Za-z0-9.+_-]/-/g')
          echo "version_slug=$VERSION_SLUG" >> $GITHUB_OUTPUT

          # Android versionCode: a strictly-increasing integer is required for
          # the device to accept an update over an existing install. github's
          # run_number increments on every workflow run and never depends on
          # git checkout depth, so it's a reliable monotonic source. versionName
          # is the human version string the in-game notifier already shows.
          echo "android_version_code=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "android_version_name=$VERSION" >> $GITHUB_OUTPUT

          # build_seq: secuencia monotónica para el manifest de update (release_sequence).
          # run_number es un entero simple que crece en cada run del workflow; es la
          # misma fuente que el versionCode del APK.
          echo "build_seq=${{ github.run_number }}" >> $GITHUB_OUTPUT

  export:
    needs: prep
    # `[build:none]` deja la matriz vacía; el gate explícito evita depender de cómo
    # Actions resuelve un `include: []`.
    if: needs.prep.outputs.target_platform != 'none'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.platforms) }}

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep.outputs.head_sha }}

      # `secrets` and `matrix` can't be used in a job-level `if`, so gate iOS at
      # the step level instead: detect missing certs here and skip the iOS-only
      # steps below when they're absent.
      - name: Check iOS signing availability
        id: ios_gate
        env:
          IOS_CERT_P12_B64: ${{ secrets.IOS_CERT_P12_B64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_B64: ${{ secrets.IOS_PROVISION_B64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ "${{ matrix.platform }}" = "ios" ] && { [ -z "$IOS_CERT_P12_B64" ] || [ -z "$IOS_CERT_PASSWORD" ] || [ -z "$IOS_PROVISION_B64" ]; }; then
            echo "iOS signing secrets missing — skipping iOS export."
            echo "skip_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_ios=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ matrix.platform }}" = "ios" ] && [ "${{ needs.prep.outputs.ref_name }}" = "main" ] && \
             [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_API_KEY_P8" ]; then
            echo "upload_testflight=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload_testflight=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Python (Android container)
        if: matrix.platform == 'android'
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 --version
            exit 0
          fi
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            if command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            else
              echo "::error::python3 not found and package install requires root or sudo"
              exit 1
            fi
          fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y python3
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache python3
          else
            echo "::error::python3 not found and no supported package manager is available"
            exit 1
          fi
          python3 --version

      - name: Ensure curl (Android container)
        if: matrix.platform == 'android'
        run: |
          if command -v curl >/dev/null 2>&1; then
            curl --version | head -1
            exit 0
          fi
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            if command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            else
              echo "::error::curl not found and package install requires root or sudo"
              exit 1
            fi
          fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y curl
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache curl
          else
            echo "::error::curl not found and no supported package manager is available"
            exit 1
          fi
          curl --version | head -1

      - name: Disable editor plugins
        run: python3 scripts/disable_plugins.py

      - name: Inject build metadata
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          # FD-234: Inject version + hash + date into project.godot
          sed -i -E "s/^(application\/)?config\/version=\".*\"/config\/version=\"$VERSION\"/" project.godot
          python3 scripts/inject_build_meta.py \
            --token "${{ secrets.ODISEA_CENTRAL_INGEST_TOKEN }}" \
            --commit "${{ needs.prep.outputs.head_sha }}" \
            --build-id "${{ needs.prep.outputs.build_seq }}" \
            --channel "${{ needs.prep.outputs.channel }}" \
            --version "${{ needs.prep.outputs.version }}" \
            --official-host "odisea.educa.juegos" \
            --out-js "build_meta.js" \
            --out-json "build_meta.json"
          python3 - <<'PY'
          import json
          import sys
          meta = json.load(open("build_meta.json", "r", encoding="utf-8"))
          token = str(meta.get("token", "")).strip()
          if not token or token == "ODISEA_TOKEN_CANARY_MISSING" or "canary" in token.lower():
              print("::error::ODISEA_CENTRAL_INGEST_TOKEN is missing; refusing to export a canary telemetry build")
              sys.exit(1)
          print("Build metadata OK: token present, channel=%s, build_id=%s" % (
              meta.get("channel", ""),
              meta.get("build_id", ""),
          ))
          PY

      # Cache de templates/config de Godot (igual para todas las plataformas).
      # OJO: el .import/ NO va acá: cada plataforma genera variantes VRAM distintas
      # (tras "Limit texture import formats"), así que su cache se hace por separado
      # y DESPUÉS de ese step, para no cruzar formatos entre plataformas (antes las
      # 6 plataformas Linux compartían la misma key y podían leer un .import ajeno).
      - name: Cache Godot
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/godot
            ~/.config/godot
            ~/.local/share/godot
            ~/Library/Application Support/Godot/templates
            .godot/
          key: ${{ runner.os }}-godot-all-${{ hashFiles('**/project.godot') }}-${{ hashFiles('**/*.import') }}
          restore-keys: |
            ${{ runner.os }}-godot-all-${{ hashFiles('**/project.godot') }}-
            ${{ runner.os }}-godot-all-

      - name: Install Godot (Linux)
        if: runner.os == 'Linux' && matrix.platform != 'android'
        run: |
          GODOT_DIR="$HOME/.local/bin"
          mkdir -p "$GODOT_DIR"
          echo "$GODOT_DIR" >> "$GITHUB_PATH"
          if [ ! -f "$GODOT_DIR/godot3-server" ]; then
            curl -fSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip"
            unzip -o /tmp/godot.zip -d "$GODOT_DIR/"
            chmod +x "$GODOT_DIR/Godot_v3.6.2-stable_linux_headless.64"
            ln -sf "$GODOT_DIR/Godot_v3.6.2-stable_linux_headless.64" "$GODOT_DIR/godot3-server"
          fi
          echo "GODOT_BIN=godot3-server" >> $GITHUB_ENV

      - name: Install Godot (macOS)
        if: runner.os == 'macOS'
        run: |
          GODOT_DIR="$HOME/.local/bin"
          mkdir -p "$GODOT_DIR"
          echo "$GODOT_DIR" >> "$GITHUB_PATH"
          if [ ! -x "$GODOT_DIR/Godot.app/Contents/MacOS/Godot" ]; then
            curl -fSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_osx.universal.zip"
            rm -rf /tmp/godot_extract "$GODOT_DIR/Godot.app"
            mkdir -p /tmp/godot_extract
            unzip -o /tmp/godot.zip -d /tmp/godot_extract
            mv /tmp/godot_extract/Godot.app "$GODOT_DIR/Godot.app"
          fi
          GODOT_MAC="$GODOT_DIR/Godot.app/Contents/MacOS/Godot"
          chmod +x "$GODOT_MAC"
          # Re-sign after extraction so macOS 26 does not terminate this older
          # Godot bundle with SIGKILL before the process can print an error.
          codesign --force --deep --sign - "$GODOT_DIR/Godot.app"
          codesign --verify --deep --strict "$GODOT_DIR/Godot.app"
          "$GODOT_MAC" --version
          file "$GODOT_MAC"
          echo "GODOT_BIN=$GODOT_MAC" >> "$GITHUB_ENV"

      - name: Install Templates
        if: matrix.platform != 'android'
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            TPL_DIR="$HOME/Library/Application Support/Godot/templates/3.6.2.stable"
          else
            TPL_DIR="$HOME/.local/share/godot/templates/3.6.2.stable"
          fi

          case "${{ matrix.platform }}" in
            macos) REQUIRED_TEMPLATE="$TPL_DIR/osx.zip" ;;
            ios) REQUIRED_TEMPLATE="$TPL_DIR/iphone.zip" ;;
            windows) REQUIRED_TEMPLATE="$TPL_DIR/windows_64_release.exe" ;;
            html5) REQUIRED_TEMPLATE="$TPL_DIR/webassembly_release.zip" ;;
            linux_arm64) REQUIRED_TEMPLATE="$TPL_DIR/linux_x11_arm64_release" ;;
            *) REQUIRED_TEMPLATE="$TPL_DIR/linux_x11_64_release" ;;
          esac

          if [ ! -f "$REQUIRED_TEMPLATE" ]; then
            mkdir -p "$TPL_DIR"
            curl -fSL -o /tmp/tpz.zip "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz"
            rm -rf /tmp/tpz_extract
            unzip -o /tmp/tpz.zip -d /tmp/tpz_extract/
            if [ -d /tmp/tpz_extract/templates ]; then
              cp -a /tmp/tpz_extract/templates/* "$TPL_DIR/"
            fi
          fi
          test -f "$REQUIRED_TEMPLATE" || { echo "::error::Missing export template: $REQUIRED_TEMPLATE"; exit 1; }

          if [ "${{ matrix.platform }}" = "html5" ]; then
            # The "HTML5 Threads" preset reads the webassembly_release.zip slot;
            # swap in the threads template so Godot picks it up.
            cp "$TPL_DIR/webassembly_threads_release.zip" "$TPL_DIR/webassembly_release.zip"
          fi

          echo "TPL_DIR=$TPL_DIR" >> "$GITHUB_ENV"

      # Apple exige MinimumOSVersion >= 15.0 para todas las apps iOS a partir de
      # la primavera de 2027. Godot 3.6 no expone la version minima como opcion de
      # export: el iphone.zip trae IPHONEOS_DEPLOYMENT_TARGET = 12.0 hardcodeado en
      # godot_ios.xcodeproj/project.pbxproj, y de ahi xcodebuild deriva la clave
      # MinimumOSVersion del Info.plist del IPA. Reescribimos esa entrada del zip
      # dejando el resto byte a byte igual (permisos, timestamps, compresion).
      # Es idempotente, asi que un TPL_DIR cacheado o ya parcheado no molesta.
      - name: Patch iOS minimum OS version
        if: matrix.platform == 'ios' && steps.ios_gate.outputs.skip_ios != 'true'
        env:
          MIN_IOS_VERSION: "15.0"
        run: |
          set -euo pipefail
          IOS_TEMPLATE="$TPL_DIR/iphone.zip" python3 - <<'PY'
          import os
          import re
          import shutil
          import zipfile

          template = os.environ["IOS_TEMPLATE"]
          target = os.environ["MIN_IOS_VERSION"]
          member = "godot_ios.xcodeproj/project.pbxproj"
          patched_path = template + ".patched"

          with zipfile.ZipFile(template) as src:
              if member not in src.namelist():
                  raise SystemExit("iphone.zip has no " + member)
              pbxproj = src.read(member).decode("utf-8")
              hits = pbxproj.count("IPHONEOS_DEPLOYMENT_TARGET = ")
              if hits == 0:
                  raise SystemExit("No IPHONEOS_DEPLOYMENT_TARGET found in " + member)
              patched = re.sub(
                  r"IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;",
                  "IPHONEOS_DEPLOYMENT_TARGET = %s;" % target,
                  pbxproj,
              )
              with zipfile.ZipFile(patched_path, "w") as dst:
                  for info in src.infolist():
                      data = patched.encode("utf-8") if info.filename == member else src.read(info)
                      dst.writestr(info, data, compress_type=info.compress_type)

          shutil.move(patched_path, template)
          print("iOS deployment target set to %s (%d entries in project.pbxproj)" % (target, hits))
          PY

      - name: iOS Certificates Setup
        if: matrix.platform == 'ios' && steps.ios_gate.outputs.skip_ios != 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_CERT_P12_B64 }}
          p12-password: ${{ secrets.IOS_CERT_PASSWORD }}

      - name: iOS Provisioning Setup
        if: matrix.platform == 'ios' && steps.ios_gate.outputs.skip_ios != 'true'
        env:
          IOS_PROVISION_B64: ${{ secrets.IOS_PROVISION_B64 }}
          IOS_MARKETING_VERSION: ${{ needs.prep.outputs.base_version }}
          IOS_BUILD_NUMBER: ${{ needs.prep.outputs.build_seq }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/odisea.mobileprovision"
          echo "$IOS_PROVISION_B64" | base64 --decode > "$PROFILE"

          security cms -D -i "$PROFILE" > /tmp/odisea-profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/odisea-profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/odisea-profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/odisea-profile.plist)
          test -n "$PROFILE_UUID" && test -n "$TEAM_ID"
          mv "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          IOS_TEAM_ID="$TEAM_ID" IOS_PROFILE_UUID="$PROFILE_UUID" python3 - <<'PY'
          import os
          import re

          path = "export_presets.cfg"
          lines = open(path, encoding="utf-8").read().splitlines()
          start = lines.index("[preset.7.options]")
          end = next((i for i in range(start + 1, len(lines))
                      if re.match(r"^\[preset\.\d+", lines[i])), len(lines))
          values = {
              "application/app_store_team_id": os.environ["IOS_TEAM_ID"],
              "application/identifier": "juegos.educa.odisea",
              "application/provisioning_profile_uuid_release": os.environ["IOS_PROFILE_UUID"],
              "application/code_sign_identity_release": "Apple Distribution",
              "application/export_method_release": "0",
              "application/short_version": os.environ["IOS_MARKETING_VERSION"],
              "application/version": os.environ["IOS_BUILD_NUMBER"],
          }
          found = set()
          for i in range(start + 1, end):
              key = lines[i].split("=", 1)[0].strip()
              if key in values:
                  value = values[key]
                  lines[i] = f'{key} = {value}' if key == "application/export_method_release" else f'{key} = "{value}"'
                  found.add(key)
          additions = []
          for key, value in values.items():
              if key not in found:
                  additions.append(f'{key} = {value}' if key == "application/export_method_release" else f'{key} = "{value}"')
          lines[end:end] = additions
          open(path, "w", encoding="utf-8").write("\n".join(lines) + "\n")
          PY

          echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "Configured Apple Team ID: $TEAM_ID"
          echo "Configured iOS version: $IOS_MARKETING_VERSION ($IOS_BUILD_NUMBER)"

      - name: Android Keystore Setup
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/update.keystore
            echo "Using persistent Android update signing certificate."
          else
            echo "::error::ANDROID_KEYSTORE_BASE64 is required for installable Android updates. A new certificate would make existing installs impossible to update."
            exit 1
          fi
          # Godot's debug preset expects these fixed credentials for the intermediate
          # export. The published APK is re-signed below with update.keystore.
          rm -f android/debug.keystore
          keytool -genkey -v -keystore android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Android Templates Setup
        if: matrix.platform == 'android'
        run: |
          set -e
          DEST_NEW="$HOME/.local/share/godot/export_templates/3.6.2.stable"
          DEST_OLD="$HOME/.local/share/godot/templates/3.6.2.stable"
          mkdir -p "$DEST_NEW" "$DEST_OLD"
          SRC=""
          for c in /root/.local/share/godot/export_templates/3.6.2.stable \
                   /root/.local/share/godot/templates/3.6.2.stable; do
            [ -d "$c" ] && SRC="$c" && break
          done
          if [ -z "$SRC" ]; then echo "::error::No export templates found"; exit 1; fi
          cp -a "$SRC"/. "$DEST_NEW"/
          cp -a "$SRC"/. "$DEST_OLD"/

      - name: Android SDK Setup
        if: matrix.platform == 'android'
        run: |
          set -e
          echo "=== Java version ==="
          java -version 2>&1 || true
          javac -version 2>&1 || true
          echo "JAVA_HOME=${JAVA_HOME:-not set}"

          echo "=== Android SDK components ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "No NDK installed"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "No build-tools"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "No platforms"

          # Install missing SDK components required by android/build/config.gradle:
          #   ndkVersion 28.1.13356709, buildTools 35.0.0, compileSdk/targetSdk 35
          SDKMANAGER=""
          for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager"; do
            [ -f "$p" ] && SDKMANAGER="$p" && break
          done
          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            # Install only what's missing (idempotent)
            "$SDKMANAGER" "ndk;28.1.13356709" "build-tools;35.0.0" "platforms;android-35" 2>&1 | tail -5 || true
          else
            echo "::warning::sdkmanager not found; skipping SDK component install"
          fi
          echo "=== NDK after setup ==="
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true

      - name: Android Editor Settings
        if: matrix.platform == 'android'
        run: |
          # config.gradle requires Java 17; search for it explicitly before falling back.
          # Checking java-17 BEFORE java-11 is critical: if both are installed the old
          # logic accidentally handed Java 11 to Gradle, which then failed validateJavaVersion.
          JDK_PATH=""
          for p in /usr/lib/jvm/java-17-openjdk-amd64 \
                   /usr/lib/jvm/java-17-openjdk \
                   /usr/lib/jvm/temurin-17 \
                   /usr/local/lib/jvm/openjdk17; do
            [ -d "$p" ] && JDK_PATH="$p" && break
          done
          if [ -z "$JDK_PATH" ]; then
            JDK_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          fi
          echo "Using JDK path: $JDK_PATH"
          "$JDK_PATH/bin/java" -version 2>&1 || true
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=2]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JDK_PATH\""
          } > "$HOME/.config/godot/editor_settings-3.tres"

      - name: Android Version Stamp
        if: matrix.platform == 'android'
        env:
          ANDROID_VERSION_CODE: ${{ needs.prep.outputs.android_version_code }}
          ANDROID_VERSION_NAME: ${{ needs.prep.outputs.android_version_name }}
        run: |
          set -e
          # Stamp a monotonic versionCode (+ human versionName) into the Android
          # preset so the built APK installs over a previous one without an
          # uninstall. These keys live only in the Android preset block.
          echo "Android versionCode=$ANDROID_VERSION_CODE versionName=$ANDROID_VERSION_NAME"
          # Godot 3 writes these keys without spaces around '='. The previous
          # `version/code = ` pattern never matched, so the APK kept 999999999.
          python3 - "$ANDROID_VERSION_CODE" "$ANDROID_VERSION_NAME" <<'PY'
          import re, sys
          code, name = sys.argv[1], sys.argv[2]
          path = "export_presets.cfg"
          text = open(path).read()
          text2, n_code = re.subn(r'(?m)^version/code\s*=\s*.*$', 'version/code=%s' % code, text, count=1)
          text2, n_name = re.subn(r'(?m)^version/name\s*=\s*.*$', 'version/name="%s"' % name.replace('\\', '\\\\').replace('"', '\\"'), text2, count=1)
          if n_code != 1 or n_name != 1:
              sys.stderr.write("::error::Failed to stamp Android version (code=%s name=%s)\n" % (n_code, n_name))
              sys.exit(1)
          open(path, 'w').write(text2)
          PY
          grep -E '^version/(code|name)=' export_presets.cfg
          # Godot 3.6.2 can mis-detect the checked-in custom build during its
          # headless filesystem scan. In that state, explicit SDK overrides make
          # preset validation abort before Gradle starts. The Android template's
          # config.gradle already supplies these values, so omit only the overrides.
          sed -i -E '/^custom_build\/(min_sdk|target_sdk)[[:space:]]*=/d' export_presets.cfg

      # El Gradle wrapper y su distribución se cachean en los pasos
      # "Cache Gradle wrapper" y "Pre-cache Gradle distribution" más abajo,
      # justo antes de "Android Gradle Diagnostic". El cuello principal del
      # export de Android sigue siendo el IMPORT de Godot — eso se arregla con
      # "Stable project hash for import cache" más abajo.

      - name: Limit texture import formats per platform
        # En Python: portable entre Linux (las 6 plataformas) y macOS (iOS corre en
        # macos-latest, donde BSD sed difiere de GNU sed y rompía el script anterior).
        run: |
          python3 - "${{ matrix.platform }}" <<'PY'
          import sys, re
          platform = sys.argv[1]

          # El step de import (godot --editor --quit) genera una variante VRAM por
          # cada formato habilitado, para CADA textura. Generar formatos que la
          # plataforma no usa hacía el import ~14min (vs ~1-3min con lo justo).
          # El proyecto es GLES2: BPTC (GLES3/Vulkan) nunca se usa; desktop usa S3TC;
          # móvil/web usa ETC/ETC2; iOS conserva PVRTC.
          # bptc, etc, etc2, pvrtc -> True = importar. S3TC siempre se genera.
          fmts = {
              "linux_x64":   dict(bptc=False, etc=False, etc2=False, pvrtc=False),
              "windows":     dict(bptc=False, etc=False, etc2=False, pvrtc=False),
              "macos":       dict(bptc=False, etc=False, etc2=False, pvrtc=False),
              "linux_arm64": dict(bptc=False, etc=True,  etc2=False, pvrtc=False),
              "android":     dict(bptc=False, etc=True,  etc2=True,  pvrtc=False),
              # html5: el proyecto es GLES2 -> WebGL1 -> usa ETC1, NO ETC2 (que es
              # WebGL2/GLES3). Generar ETC2 además triplicaba las texturas del .pck
              # web (215MB vs ~desktop). Solo ETC (+ S3TC por default) -> bundle mucho
              # menor. ETC2 off.
              "html5":       dict(bptc=False, etc=True,  etc2=False, pvrtc=False),
              "ios":         dict(bptc=False, etc=True,  etc2=True,  pvrtc=True),
          }[platform]

          # 1) project.godot: ajustar vram_compression/import_* dentro de [rendering].
          path = "project.godot"
          lines = open(path, encoding="utf-8").read().splitlines()
          out, in_rendering, seen = [], False, set()
          def kv(k, v):
              return f"vram_compression/import_{k}={'true' if v else 'false'}"
          for line in lines:
              if re.match(r"^\[.*\]\s*$", line):
                  # Al salir de [rendering], agregar las claves que faltaban.
                  if in_rendering:
                      for k, v in fmts.items():
                          if k not in seen:
                              out.append(kv(k, v))
                  in_rendering = line.strip() == "[rendering]"
                  out.append(line)
                  continue
              m = re.match(r"^vram_compression/import_(\w+)=", line)
              if in_rendering and m and m.group(1) in fmts:
                  k = m.group(1)
                  out.append(kv(k, fmts[k]))
                  seen.add(k)
              else:
                  out.append(line)
          if in_rendering:  # [rendering] era la última sección
              for k, v in fmts.items():
                  if k not in seen:
                      out.append(kv(k, v))
          open(path, "w", encoding="utf-8").write("\n".join(out) + "\n")
          print(f"VRAM import formats for {platform}:")
          for ln in out:
              if ln.startswith("vram_compression/"):
                  print("  " + ln)

          # 2) Si BPTC no se importa, el preset desktop no debe pedir exportarlo.
          preset_for = {"linux_x64": "1", "windows": "5", "macos": "6"}
          if not fmts["bptc"] and platform in preset_for:
              idx = preset_for[platform]
              cfg = "export_presets.cfg"
              txt = open(cfg, encoding="utf-8").read().splitlines()
              res, in_block = [], False
              for line in txt:
                  if re.match(r"^\[preset\.\d+\.options\]\s*$", line):
                      in_block = (line.strip() == f"[preset.{idx}.options]")
                  elif re.match(r"^\[preset\.", line):
                      in_block = False
                  if in_block and line.strip() == "texture_format/bptc = true":
                      line = "texture_format/bptc = false"
                  res.append(line)
              open(cfg, "w", encoding="utf-8").write("\n".join(res) + "\n")
              print(f"Disabled texture_format/bptc in preset.{idx} for {platform}")
          PY

      # Cache del .import/ POR PLATAFORMA, después de fijar los formatos VRAM.
      # La key incluye matrix.platform y el hash del project.godot ya modificado,
      # así cada plataforma reusa su propio .import sin cruzarse con otra (linux=S3TC,
      # android=ETC2, ...). En el primer run de cada plataforma es MISS y el import
      # genera; a partir de ahí, cache hit -> import casi instantáneo.
      # Hash ESTABLE para la key del cache .import: incluye solamente los formatos
      # VRAM que cambian los artefactos por plataforma. Cambios de gameplay, input,
      # MSAA o vertex lighting no deben invalidar todas las texturas. La key también
      # incluye los FUENTES importables: el contenido
      # de un .import no cambia cuando cambia su PNG/JPG/GLTF, y Actions no actualiza
      # un cache que ya existe bajo la misma key. Sin este hash, cada run restauraba
      # para siempre el artefacto viejo y Godot repetía esos imports.
      - name: Stable project hash for import cache
        id: pghash
        run: |
          H=$({
            echo "godot=3.6.2"
            grep -E '^vram_compression/import_(bptc|etc|etc2|pvrtc)=' project.godot | sort
          } | sha256sum | cut -d' ' -f1)
          echo "hash=$H" >> "$GITHUB_OUTPUT"

      - name: Cache .import (per platform)
        uses: actions/cache@v6
        with:
          # Godot reescribe también estos sidecars con imported_formats por plataforma.
          # Restaurar solo .import/ mezcla binarios ETC con manifests S3TC del checkout
          # y fuerza una reimportación completa aunque la caché haya sido un hit exacto.
          path: |
            .import/
            **/*.png.import
            **/*.jpg.import
            **/*.jpeg.import
            **/*.tga.import
            **/*.svg.import
          key: ${{ runner.os }}-import-v2-${{ matrix.platform }}-${{ steps.pghash.outputs.hash }}-${{ hashFiles('**/*.import', '**/*.png', '**/*.jpg', '**/*.jpeg', '**/*.tga', '**/*.svg', '**/*.gltf', '**/*.glb', '**/*.dae', '**/*.obj', '**/*.mtl', '**/*.ogg', '**/*.mp3', '**/*.wav', '**/*.ttf', '**/*.otf') }}

      # The exporter packages every texture destination named by a cached .import
      # manifest. Normalize this disposable CI checkout so stale ETC/PVRTC outputs
      # from another platform cannot inflate a desktop PCK.
      - name: Limit cached VRAM texture variants
        run: python3 scripts/limit_vram_import_formats.py "${{ matrix.platform }}"

      # Compila la lib GDNative de bspatch (delta binario del update) para la plataforma
      # actual ANTES del export: el exporter de Godot copia la .so/.dll junto al binario
      # solo si existe en disco en la ruta del .gdnlib. Sin lib, el cliente cae a full
      # (is_delta_eligible -> false), así que las plataformas sin toolchain aquí siguen
      # funcionando, solo sin deltas.
      - name: Build native bspatch lib
        if: matrix.platform == 'linux_x64' || matrix.platform == 'linux_arm64' || matrix.platform == 'windows'
        run: |
          set -e
          # godot-headers NO está en el repo (gitignored, 5.6M de headers externos). Lo
          # bajamos del tag godot-3.6-stable. Usamos el tarball (no requiere git ni clonar
          # el .git interno). Layout: godot-headers-godot-3.6-stable/ -> aplanar al dir.
          HDR_DIR="native/godot-headers"
          if [ ! -f "$HDR_DIR/gdnative_api_struct.gen.h" ]; then
            echo "Fetching godot-headers (godot-3.6-stable)…"
            mkdir -p "$HDR_DIR"
            curl -fsSL "https://github.com/godotengine/godot-headers/archive/refs/tags/godot-3.6-stable.tar.gz" \
              | tar -xz -C "$HDR_DIR" --strip-components=1
          fi
          test -f "$HDR_DIR/gdnative_api_struct.gen.h" || { echo "::error::godot-headers missing"; exit 1; }

          # apt-get necesita root; en ubuntu-latest (no container) usar sudo.
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi

          SRC="native/bsdiff/odisea_bspatch_gdnative.c native/bsdiff/bspatch.c"
          INC="-I native/godot-headers"
          case "${{ matrix.platform }}" in
            linux_x64)
              OUTDIR="core_v2/update/native/bin/linux_x64"
              mkdir -p "$OUTDIR"
              gcc -O2 -fPIC -shared $INC $SRC -o "$OUTDIR/libodisea_bspatch.so"
              ;;
            linux_arm64)
              OUTDIR="core_v2/update/native/bin/linux_arm64"
              mkdir -p "$OUTDIR"
              # cross-compiler para arm64 (el .gdnlib referencia esta ruta para X11.arm64)
              $SUDO apt-get update && $SUDO apt-get install -y gcc-aarch64-linux-gnu
              aarch64-linux-gnu-gcc -O2 -fPIC -shared $INC $SRC -o "$OUTDIR/libodisea_bspatch.so"
              ;;
            windows)
              OUTDIR="core_v2/update/native/bin/windows"
              mkdir -p "$OUTDIR"
              $SUDO apt-get update && $SUDO apt-get install -y gcc-mingw-w64-x86-64
              x86_64-w64-mingw32-gcc -O2 -shared $INC $SRC -o "$OUTDIR/libodisea_bspatch.dll" -static-libgcc
              ;;
          esac
          ls -la "$OUTDIR"

      - name: Cache Gradle wrapper
        if: matrix.platform == 'android'
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-8.11-${{ hashFiles('android/build/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-8.11-

      - name: Pre-cache Gradle distribution
        if: matrix.platform == 'android'
        run: |
          GRADLE_HOME="$HOME/.gradle"
          mkdir -p "$GRADLE_HOME/wrapper/dists"
          GRADLE_DIST_DIR="$GRADLE_HOME/wrapper/dists/gradle-8.11.1-bin"
          # Skip download if already extracted (cache hit or previous step)
          if find "$GRADLE_DIST_DIR" -name "gradle-8.11.1" -type d 2>/dev/null | grep -q .; then
            echo "Gradle 8.11.1 already extracted, skipping download."
          else
            GRADLE_ZIP="/tmp/gradle-8.11.1-bin.zip"
            if [ ! -f "$GRADLE_ZIP" ]; then
              echo "Downloading Gradle 8.11.1..."
              for i in 1 2 3; do
                curl -fSL -o "$GRADLE_ZIP" \
                  "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip" \
                  --max-time 300 && break
                echo "Attempt $i failed, retrying in 5s..."
                sleep 5
              done
            fi
            echo "Extracting Gradle to $GRADLE_HOME..."
            unzip -q "$GRADLE_ZIP" -d "$GRADLE_HOME"
            echo "Gradle extracted: $(du -sh "$GRADLE_HOME/gradle-8.11.1" 2>/dev/null || echo 'unknown')"
          fi

      - name: Android Gradle Diagnostic
        if: matrix.platform == 'android'
        run: |
          # Run Gradle directly to capture any build errors before Godot does.
          # Godot does NOT forward Gradle's stdout/stderr, so failures are silent.
          # This step runs the same tasks Godot would run (assembleDebug) and shows
          # the full error if Gradle fails. NOT using || true so failures are visible.
          set -e
          cd android/build
          echo "=== Gradle wrapper version ==="
          ./gradlew --version 2>&1
          echo "=== Java env ==="
          echo "JAVA_HOME=${JAVA_HOME:-not set}"
          java -version 2>&1 || true
          echo "=== Gradle assembleDebug (must succeed) ==="
          ./gradlew assembleDebug \
            -PANDROID_HOME="$ANDROID_HOME" \
            -Pexport_version_code="${{ needs.prep.outputs.android_version_code }}" \
            -Pexport_version_name="${{ needs.prep.outputs.android_version_name }}" \
            --stacktrace \
            2>&1
          echo "=== APKs produced by assembleDebug ==="
          find . -name "*.apk" 2>/dev/null | head -20 || echo "None"
          cd "$GITHUB_WORKSPACE"

      - name: Export
        if: steps.ios_gate.outputs.skip_ios != 'true'
        run: |
          # Use 'godot' if 'godot3-server' is not set (container environment)
          G_BIN="${GODOT_BIN:-godot}"

          # android runs this step inside a container (barichello/godot-ci), which has
          # its own git with no safe.directory entry for the checked-out workspace.
          # actions/checkout only configures that for the HOST's git, not the
          # container's, so any git call from here (including the ones
          # check_import_artifacts_present.py shells out to below) fails with "detected
          # dubious ownership" (exit 128) -- discovered the hard way when that made the
          # verify step below crash on every attempt, burning all 3 retries x 1200s
          # regardless of whether the import had actually finished (run 33008546386).
          # No-op on the other platforms' bare runners, where it's already trusted.
          git config --global --add safe.directory "$(pwd)"

          # Complete platform-specific imports before packaging. The restored
          # .import cache can be partial or come from an older commit, and a
          # single texture changing ANYWHERE invalidates this platform's whole
          # cache (see "Cache .import (per platform)" above), forcing a full
          # reimport. `--quit` kills EditorFileSystem's async import thread
          # after the first main-loop iteration (per --help) — before it
          # finishes writing a new/large asset's artifact — so a single quiet
          # pass can silently leave assets unimported (godot exits 0 either
          # way, which is why this used to be `|| true`). scripts/godot_import_smoke.sh
          # hit exactly this and works around it by dropping --quit and giving
          # the async import real time.
          #
          # Without --quit godot never exits on its own -- it just sits there as an
          # idle editor once done, so waiting for a fixed timeout means EVERY run pays
          # the full timeout even on a cache hit with nothing to import (measured: a
          # cold Android/ETC2 reimport that actually finished in well under 1200s still
          # cost the full 1200s, run 33013255678, because nothing polled for "done" —
          # it just waited to be killed). Poll the artifact check instead and stop as
          # soon as it's satisfied; IMPORT_TIMEOUT_SEC is only the safety-net ceiling
          # for a genuinely stuck import, not the expected duration.
          IMPORT_TIMEOUT_SEC=1200
          IMPORT_POLL_SEC=20
          IMPORT_SETTLE_SEC=15
          IMPORT_MAX_ATTEMPTS=3
          import_clean=0
          for attempt in $(seq 1 "$IMPORT_MAX_ATTEMPTS"); do
            echo "=== Import attempt ${attempt}/${IMPORT_MAX_ATTEMPTS} (polling every ${IMPORT_POLL_SEC}s, ceiling ${IMPORT_TIMEOUT_SEC}s) ==="
            "$G_BIN" -e --headless --no-window --audio-driver Dummy &
            godot_pid=$!
            waited=0
            attempt_clean=0
            while kill -0 "$godot_pid" 2>/dev/null; do
              if python3 scripts/check_import_artifacts_present.py --mode all --strict --fail-on-missing-textures >/dev/null 2>&1; then
                echo "Artifacts complete after ~${waited}s; letting in-flight writes settle ${IMPORT_SETTLE_SEC}s before stopping the import early."
                sleep "$IMPORT_SETTLE_SEC"
                attempt_clean=1
                break
              fi
              if [ "$waited" -ge "$IMPORT_TIMEOUT_SEC" ]; then
                echo "Still incomplete after ${IMPORT_TIMEOUT_SEC}s; giving up on this attempt."
                break
              fi
              sleep "$IMPORT_POLL_SEC"
              waited=$((waited + IMPORT_POLL_SEC))
            done
            if kill -0 "$godot_pid" 2>/dev/null; then
              kill "$godot_pid" 2>/dev/null || true
            fi
            wait "$godot_pid" 2>/dev/null || true
            if [ "$attempt_clean" -eq 1 ]; then
              import_clean=1
              break
            fi
            # The process may also have exited on its own (unexpected without --quit,
            # but don't loop forever on it either way) -- re-check once before retrying.
            if python3 scripts/check_import_artifacts_present.py --mode all --strict --fail-on-missing-textures; then
              import_clean=1
              break
            fi
            echo "Import pass ${attempt} left artifacts missing; retrying with a warmed cache..."
          done

          if [ "$import_clean" -ne 1 ]; then
            echo "::error::Import never finished after ${IMPORT_MAX_ATTEMPTS} attempts — some assets still have no artifact on disk (see [import-artifacts] list above). Shipping now would silently omit them from the build."
            exit 1
          fi

          case "${{ matrix.platform }}" in
            linux_x64) OUT="build/linux_x86_64/Odisea-Tech-Demo.x86_64" ;;
            linux_arm64) OUT="build/linux_arm64/Odisea-Tech-Demo.arm64" ;;
            windows) OUT="build/windows/Odisea-Tech-Demo.exe" ;;
            macos) OUT="build/macos/Odisea-Tech-Demo.zip" ;;
            ios) OUT="build/ios/Odisea-Tech-Demo.ipa" ;;
            android) OUT="build/android/Odisea-Tech-Demo.apk" ;;
            html5) OUT="build/html5/index.html" ;;
          esac

          mkdir -p $(dirname "$OUT")

          # Godot 3.6 headless --export returns a non-zero exit even on benign
          # import warnings, so don't let it abort the step; verify success by
          # checking the artifact was actually written instead.
          # Use --export-debug for Android
          if [ "${{ matrix.platform }}" = "android" ]; then
            echo "=== Godot binary: $G_BIN ==="
            "$G_BIN" --version 2>&1 || true
            echo "=== Running Godot --export-debug Android ==="
            # Capture full output via tee so we can see everything (not just tail)
            "$G_BIN" --no-window --export-debug "${{ matrix.preset }}" "$OUT" --headless 2>&1 | tee /tmp/godot_android.log || true
            echo "=== build/android/ after Godot export ==="
            ls -la "$(dirname "$OUT")/" 2>/dev/null || echo "Directory absent"
            # If APK wasn't placed at expected location, run Gradle explicitly with
            # absolute paths. Godot may pass relative paths to Gradle which causes
            # copyAndRenameDebugApk to copy to the wrong directory.
            if [ ! -f "$OUT" ]; then
              echo "=== APK missing after Godot export — running Gradle manually ==="
              echo "=== android/build/assets/ contents ==="
              ls android/build/assets/ 2>/dev/null | head -20 || echo "No assets directory (Godot may not have run)"
              cd android/build
              ./gradlew assembleDebug copyAndRenameDebugApk \
                -PANDROID_HOME="$ANDROID_HOME" \
                -Pexport_version_code="${{ needs.prep.outputs.android_version_code }}" \
                -Pexport_version_name="${{ needs.prep.outputs.android_version_name }}" \
                -Pexport_path="$GITHUB_WORKSPACE/$(dirname "$OUT")" \
                -Pexport_filename="$(basename "$OUT")" \
                --stacktrace 2>&1 | tail -100 || true
              cd "$GITHUB_WORKSPACE"
              echo "=== build/android/ after explicit Gradle ==="
              ls -la "$(dirname "$OUT")/" 2>/dev/null || echo "Directory absent"
              # Final fallback: direct copy from known Gradle output path
              GRADLE_APK="android/build/build/outputs/apk/debug/android_debug.apk"
              if [ ! -f "$OUT" ] && [ -f "$GRADLE_APK" ]; then
                echo "=== Copying APK from Gradle output to expected location ==="
                cp "$GRADLE_APK" "$OUT"
              fi
            fi
            echo "=== Gradle debug APK location check ==="
            find android/build/build/outputs/apk/debug/ -name "*.apk" 2>/dev/null || echo "None in android/build/build/outputs/apk/debug/"
          elif [ "${{ matrix.platform }}" = "ios" ]; then
            echo "=== Godot binary: $G_BIN ==="
            "$G_BIN" --version
            echo "=== Available Apple Distribution identities ==="
            security find-identity -v -p codesigning | sed -E 's/(\"Apple Distribution:[^\"]*\").*/\1/'
            # iOS va SIEMPRE en release: con el template debug, xcodebuild no puede
            # archivar para distribucion ("** ARCHIVE FAILED **", run 32807160302).
            # Como ANNAV2 bloquea los comandos remotos en release, el diagnostico en el
            # dispositivo se hace con el overlay de LogOverlay.gd, no por telemetria.
            echo "=== Running signed iOS export ==="
            "$G_BIN" --no-window --export "${{ matrix.preset }}" "$OUT" --headless 2>&1 | tee /tmp/godot_ios.log || true
          else
            "$G_BIN" --no-window --export "${{ matrix.preset }}" "$OUT" --headless || true
          fi

          # Godot passes the output directory to xcodebuild, which can name the
          # exported IPA from the product instead of the requested CLI path.
          # Normalize that successful output for the downstream artifact steps.
          if [ "${{ matrix.platform }}" = "ios" ] && [ ! -s "$OUT" ]; then
            echo "=== iOS export directory ==="
            find "$(dirname "$OUT")" -maxdepth 1 -type f -print
            ACTUAL_IPA=$(find "$(dirname "$OUT")" -maxdepth 1 -type f -name '*.ipa' -print -quit)
            if [ -n "$ACTUAL_IPA" ]; then
              mv "$ACTUAL_IPA" "$OUT"
              echo "Normalized IPA: $ACTUAL_IPA -> $OUT"
            fi
          fi

          if [ ! -s "$OUT" ]; then
            echo "::error::Export failed — no artifact produced at $OUT"
            exit 1
          fi
          echo "Export OK: $OUT ($(du -h "$OUT" | cut -f1))"

      - name: Audit isolated iOS PCK resources
        if: matrix.platform == 'ios' && steps.ios_gate.outputs.skip_ios != 'true'
        env:
          MIN_IOS_VERSION: "15.0"
        run: |
          set -euo pipefail
          IPA="build/ios/Odisea-Tech-Demo.ipa"
          AUDIT_DIR="$RUNNER_TEMP/odisea-ios-pck-audit"
          mkdir -p "$AUDIT_DIR"

          # El patch del template solo sirve si llega hasta el IPA: verificarlo aca
          # falla el build antes de gastar una subida a TestFlight rechazada.
          APP_PLIST=$(unzip -Z1 "$IPA" | grep -E '^Payload/[^/]+\.app/Info\.plist$' | head -n 1)
          test -n "$APP_PLIST" || { echo "::error::No Info.plist found inside $IPA"; exit 1; }
          unzip -p "$IPA" "$APP_PLIST" > "$AUDIT_DIR/Info.plist"
          FOUND_MIN_OS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$AUDIT_DIR/Info.plist")
          if [ "$FOUND_MIN_OS" != "$MIN_IOS_VERSION" ]; then
            echo "::error::IPA MinimumOSVersion is $FOUND_MIN_OS, expected $MIN_IOS_VERSION"
            exit 1
          fi
          echo "IPA MinimumOSVersion OK: $FOUND_MIN_OS"

          # Audit the packaged PCK, never the checkout: the latter can hide a
          # missing export dependency by satisfying res:// from the source tree.
          PCK_MEMBER=$(unzip -Z1 "$IPA" | grep -E '^Payload/[^/]+\.app/[^/]+\.pck$' | head -n 1)
          test -n "$PCK_MEMBER" || { echo "::error::No PCK found inside $IPA"; exit 1; }
          unzip -p "$IPA" "$PCK_MEMBER" > "$AUDIT_DIR/game.pck"
          test -s "$AUDIT_DIR/game.pck" || { echo "::error::Extracted iOS PCK is empty"; exit 1; }
          strings -a "$AUDIT_DIR/game.pck" > "$AUDIT_DIR/resources.txt"

          REQUIRED_RESOURCES=(
            "res://core_v2/levels/interiors/Dome_Intro.tscn"
            "res://core_v2/levels/interiors/DomeTerrace_baked.mesh"
            "res://core_v2/levels/interiors/DomeTerrace_baked.shape"
            # Dome_Intro lightmap textures (bake(dome)/Rebake lights): the exact
            # regression this audit exists to catch — a texture missing its .stex
            # doesn't crash the scene, it just ships with no lightmap, silently.
            "res://.import/Sector_003.png-b941f2d090ba19e9fb929e758807bcbc.stex"
            "res://.import/Sector_053.png-de5bccc5cd2f2d1ff05680ffc62627cf.stex"
            "res://.import/Sector_062.png-e79e1433d20a2f6d3b3e82d7c33ecb71.stex"
            "res://.import/Sector_072.png-d92fc45b5227f03316d4ba03be516944.stex"
          )
          for resource in "${REQUIRED_RESOURCES[@]}"; do
            if ! grep -Fqx "$resource" "$AUDIT_DIR/resources.txt"; then
              echo "::error::Missing required resource in isolated iOS PCK: $resource"
              exit 1
            fi
            echo "PCK contains: $resource"
          done
          echo "Isolated iOS PCK audit OK ($(du -h "$AUDIT_DIR/game.pck" | cut -f1))"

      - name: Upload iOS build to TestFlight
        if: matrix.platform == 'ios' && steps.ios_gate.outputs.upload_testflight == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          IPA="build/ios/Odisea-Tech-Demo.ipa"
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          test -s "$IPA" || { echo "::error::No signed IPA available for TestFlight"; exit 1; }
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT

          echo "=== Validating IPA with App Store Connect ==="
          xcrun altool --validate-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "=== Uploading IPA to TestFlight ==="
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "TestFlight upload accepted; Apple will now process build ${{ needs.prep.outputs.build_seq }}."

      - name: Android Sign and Validate
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_ANDROID_VERSION_CODE: ${{ needs.prep.outputs.android_version_code }}
        run: |
          set -e
          APK="build/android/Odisea-Tech-Demo.apk"
          test -s "$APK" || { echo "::error::No APK to sign"; exit 1; }
          UNSIGNED="build/android/Odisea-Tech-Demo-unsigned.apk"
          ALIGNED="build/android/Odisea-Tech-Demo-aligned.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are required"
            exit 1
          fi
          mv "$APK" "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks android/update.keystore --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass "pass:$ANDROID_KEY_PASSWORD" --out "$APK" "$ALIGNED"
          rm -f "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          ACTUAL_VERSION_CODE=$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)
          echo "Android APK versionCode=$ACTUAL_VERSION_CODE expected=$EXPECTED_ANDROID_VERSION_CODE"
          test "$ACTUAL_VERSION_CODE" = "$EXPECTED_ANDROID_VERSION_CODE" || {
            echo "::error::APK versionCode mismatch; refusing to publish a non-upgradable APK"
            exit 1
          }

      - name: HTML5 Post-process
        if: matrix.platform == 'html5'
        run: |
          python3 scripts/minimize_html_export.py build/html5/
          cp build_meta.js build/html5/build_meta.js

      - name: HTML5 Stage Netlify
        if: matrix.platform == 'html5'
        run: |
          mkdir -p build/netlify
          cp -a build/html5/* build/netlify/
          rm -f build/netlify/*.pck build/netlify/*.pck.gz build/netlify/*.wasm build/netlify/*.wasm.gz
          [ -f build/_headers ] && cp build/_headers build/netlify/_headers
          PCK_BYTES=$(stat -c%s build/html5/index.pck)
          WASM_BYTES=$(stat -c%s build/html5/index.wasm)
          TOTAL=$((PCK_BYTES + WASM_BYTES))
          sed -i "s/\$ODISEA_TOTAL_BYTES/${TOTAL}/g" build/netlify/index.html

      - name: HTML5 Stage Pages
        if: matrix.platform == 'html5'
        run: |
          mkdir -p build/pages/threads
          cp build/html5/index.pck build/html5/index.pck.gz build/pages/
          cp build/html5/index.wasm build/html5/index.wasm.gz build/pages/threads/

      - name: HTML5 Stage Vercel
        if: matrix.platform == 'html5'
        run: |
          # Vercel deploy for Safari/iOS: serves EVERYTHING same-origin (html, js,
          # threaded wasm, pck) with COEP require-corp (set in vercel.json), so the
          # page is cross-origin isolated and SharedArrayBuffer is available — which
          # the threaded engine needs and which Safari does NOT get under the main
          # site's COEP credentialless. Because assets are same-origin here, the
          # shell's GitHub Pages fetch interceptor must be neutralized: under
          # require-corp a cross-origin fetch to Pages (which sends no CORP) would be
          # blocked. We disable it by forcing the interceptor to pass through.
          mkdir -p build/vercel
          cp -a build/html5/* build/vercel/
          cp vercel.json build/vercel/vercel.json
          # Neutralize the Pages interceptor: inject an early pass-through at the top
          # of the window.fetch override so every asset resolves to its original
          # same-origin URL instead of being rewritten to GitHub Pages.
          sed -i 's#window.fetch = function(resource, init) {#window.fetch = function(resource, init) {\n\t\t\t\treturn originalFetch(resource, init); /* ODISEA_VERCEL_SAME_ORIGIN */#' build/vercel/index.html
          grep -q "ODISEA_VERCEL_SAME_ORIGIN" build/vercel/index.html || { echo "::error::Failed to neutralize Pages interceptor for Vercel build"; exit 1; }
          PCK_BYTES=$(stat -c%s build/html5/index.pck)
          WASM_BYTES=$(stat -c%s build/html5/index.wasm)
          TOTAL=$((PCK_BYTES + WASM_BYTES))
          sed -i "s/\$ODISEA_TOTAL_BYTES/${TOTAL}/g" build/vercel/index.html
          echo "Vercel stage: $(du -sh build/vercel | cut -f1)"

      - name: Upload Vercel artifact
        if: matrix.platform == 'html5'
        uses: actions/upload-artifact@v7
        with:
          name: vercel-build
          path: build/vercel/
          retention-days: 1

      - name: Package Artifact
        if: steps.ios_gate.outputs.skip_ios != 'true'
        run: |
          # version_slug (sin espacios/paréntesis) para que el nombre del asset
          # coincida con la URL del manifest y no lo sanitice GitHub. Para nightly el
          # slug ya incluye el sha (0.1.0-nightly+<sha>), así que NO se agrega -$SHA
          # otra vez (antes salía duplicado: ...+0e504e1-0e504e1).
          VERSION="${{ needs.prep.outputs.version_slug }}"
          PACKAGE="dist/${{ matrix.artifact_name }}-$VERSION.zip"
          mkdir -p dist

          # build_meta.json NO se copia suelto al paquete: ya va EMBEBIDO en el .pck
          # (está en el include_filter de todos los presets), y el runtime lo lee de
          # res://build_meta.json primero (UpdateManager/ANNAV2). Web usa build_meta.js
          # aparte. La copia suelta era redundante (macOS ya no la copiaba y andaba).

          if [ "${{ matrix.platform }}" = "html5" ]; then
            cd build/html5 && zip -r "../../$PACKAGE" . -x "_headers"
          elif [ "${{ matrix.platform }}" = "android" ]; then
            # APK se sube sin comprimir (ya es un zip firmado)
            if [ -f build/android/Odisea-Tech-Demo.apk ]; then
              PACKAGE="dist/${{ matrix.artifact_name }}-$VERSION.apk"
              cp build/android/Odisea-Tech-Demo.apk "$PACKAGE"
            else
              echo "No APK to package — skipping."
            fi
          elif [ "${{ matrix.platform }}" = "ios" ]; then
            # El IPA ya es un contenedor ZIP firmado. Publicar solo ese archivo;
            # comprimir todo build/ios incluía además xcarchive/xcodeproj (~120 MB).
            PACKAGE="dist/${{ matrix.artifact_name }}-$VERSION.ipa"
            cp build/ios/Odisea-Tech-Demo.ipa "$PACKAGE"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
             cp build/macos/Odisea-Tech-Demo.zip "$PACKAGE"
          else
            cd build && zip -r "../$PACKAGE" . -x "_headers" -x "netlify/*" -x "pages/*" -x "html5/*" -x "android/*" -x "ios/*"
          fi

      - name: Stage standalone .pck for in-app update (desktop)
        if: matrix.platform == 'linux_x64' || matrix.platform == 'linux_arm64' || matrix.platform == 'windows'
        run: |
          # El export desktop usa embed_pck=false, así que junto al ejecutable queda
          # un .pck suelto. El update in-app hace hot-swap de ESE .pck (chunkeable y
          # diffeable a futuro), NO del .zip (que es para instalación manual y cambia
          # entero con cualquier byte). Lo publicamos como asset aparte del release.
          VERSION="${{ needs.prep.outputs.version_slug }}"
          case "${{ matrix.platform }}" in
            linux_x64)   SRC="build/linux_x86_64" ;;
            linux_arm64) SRC="build/linux_arm64" ;;
            windows)     SRC="build/windows" ;;
          esac
          PCK=$(find "$SRC" -maxdepth 1 -name "*.pck" | head -n 1)
          if [ -z "$PCK" ]; then
            echo "::error::No standalone .pck found in $SRC (embed_pck debería ser false)"
            ls -la "$SRC" || true
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "linux_x64" ] || [ "${{ matrix.platform }}" = "windows" ]; then
            python3 tools/audit_export_pck.py "$PCK" --desktop
          else
            python3 tools/audit_export_pck.py "$PCK"
          fi
          mkdir -p dist
          OUT="dist/${{ matrix.artifact_name }}-$VERSION.pck"
          cp "$PCK" "$OUT"
          # Publicar TAMBIÉN el .pck comprimido para el update in-app: el .pck no está
          # comprimido internamente (gzip ahorra ~71%, 123MB->36MB) y gzip+Range son
          # incompatibles, así que servimos un .gz pre-comprimido que el cliente baja
          # por chunks y descomprime. -n: no guardar nombre/mtime (gzip determinista).
          gzip -9 -n -c "$PCK" > "$OUT.gz"
          echo "Staged update .pck: $OUT ($(du -h "$OUT" | cut -f1)) + .gz ($(du -h "$OUT.gz" | cut -f1))"

      - name: Upload Artifact
        if: steps.ios_gate.outputs.skip_ios != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-${{ needs.prep.outputs.version }}-${{ needs.prep.outputs.sha }}
          path: |
            dist/*.zip
            dist/*.apk
            dist/*.ipa
            dist/*.pck.gz
          # Cada matrix export que llega aquí debe haber producido su paquete.
          # Fallar evita un run verde que publique un nightly incompleto.
          if-no-files-found: error

      - name: Upload Netlify artifact
        if: matrix.platform == 'html5'
        uses: actions/upload-artifact@v7
        with:
          name: netlify-build
          path: build/netlify/
          retention-days: 1

      - name: Upload Pages artifact
        if: matrix.platform == 'html5'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

      - name: Build Failure Notification
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prs.data[0].number,
                body: `❌ Build failed for platform **${{ matrix.platform }}** (${{ matrix.os }}) on commit ${sha}.`
              });
            } else if (context.payload.issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.payload.issue.number,
                body: `❌ Build failed for platform **${{ matrix.platform }}** (${{ matrix.os }}).`
              });
            }

  # The universal macOS export stays on Ubuntu (the Apple runner OOMs while
  # exporting it). A small follow-up job downloads that ZIP and uses the macOS
  # signing tools only for the App Store package and upload.
  upload-macos:
    needs: [prep, export]
    runs-on: macos-latest
    if: ${{ needs.prep.outputs.ref_name == 'main' && (needs.prep.outputs.target_platform == 'all' || needs.prep.outputs.target_platform == 'macos') }}
    steps:
      - name: Check macOS App Store credentials
        id: mac_gate
        env:
          APP_CERT_P12_B64: ${{ secrets.MAC_APP_CERT_P12_B64 || secrets.IOS_CERT_P12_B64 }}
          APP_CERT_PASSWORD: ${{ secrets.MAC_APP_CERT_PASSWORD || secrets.IOS_CERT_PASSWORD }}
          MAC_PROVISION_B64: ${{ secrets.MAC_PROVISION_B64 }}
          INSTALLER_CERT_P12_B64: ${{ secrets.MAC_INSTALLER_P12_B64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          if [ -n "$APP_CERT_P12_B64" ] && [ -n "$APP_CERT_PASSWORD" ] && \
             [ -n "$MAC_PROVISION_B64" ] && [ -n "$INSTALLER_CERT_P12_B64" ] && \
             [ -n "$INSTALLER_CERT_PASSWORD" ] && [ -n "$ASC_KEY_ID" ] && \
             [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_API_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS App Store upload disabled; configure MAC_PROVISION_B64, MAC_INSTALLER_P12_B64 and MAC_INSTALLER_PASSWORD."
          fi

      - name: Download macOS export
        if: steps.mac_gate.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: Odisea-Tech-Demo-macOS-${{ needs.prep.outputs.version }}-${{ needs.prep.outputs.sha }}
          path: mac_artifact

      - name: Sign and upload macOS build to TestFlight
        if: steps.mac_gate.outputs.ready == 'true'
        env:
          APP_CERT_P12_B64: ${{ secrets.MAC_APP_CERT_P12_B64 || secrets.IOS_CERT_P12_B64 }}
          APP_CERT_PASSWORD: ${{ secrets.MAC_APP_CERT_PASSWORD || secrets.IOS_CERT_PASSWORD }}
          MAC_PROVISION_B64: ${{ secrets.MAC_PROVISION_B64 }}
          INSTALLER_CERT_P12_B64: ${{ secrets.MAC_INSTALLER_P12_B64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MAC_MARKETING_VERSION: ${{ needs.prep.outputs.base_version }}
          MAC_BUILD_NUMBER: ${{ needs.prep.outputs.build_seq }}
        run: |
          set -euo pipefail
          BUNDLE_ID="juegos.educa.odisea"
          WORK_DIR="$RUNNER_TEMP/odisea-mac-store"
          KEYCHAIN="$WORK_DIR/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          APP_P12="$WORK_DIR/app-distribution.p12"
          INSTALLER_P12="$WORK_DIR/installer-distribution.p12"
          PROFILE="$WORK_DIR/odisea.provisionprofile"
          ENTITLEMENTS="$WORK_DIR/odisea.entitlements"
          PKG="$WORK_DIR/Odisea-Tech-Demo-AppStore.pkg"

          cleanup() {
            rm -f "$KEY_FILE"
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -rf "$WORK_DIR"
          }
          trap cleanup EXIT
          mkdir -p "$WORK_DIR/app" "$KEY_DIR"
          printf '%s' "$APP_CERT_P12_B64" | base64 --decode > "$APP_P12"
          printf '%s' "$INSTALLER_CERT_P12_B64" | base64 --decode > "$INSTALLER_P12"
          printf '%s' "$MAC_PROVISION_B64" | base64 --decode > "$PROFILE"
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$APP_P12" -k "$KEYCHAIN" -P "$APP_CERT_PASSWORD" -A -t cert -f pkcs12
          security import "$INSTALLER_P12" -k "$KEYCHAIN" -P "$INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          APP_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | \
            sed -nE 's/^[[:space:]]*[0-9]+\)[[:space:]]+([[:xdigit:]]+)[[:space:]]+"(Apple Distribution|3rd Party Mac Developer Application|Mac App Distribution):[^"]+".*/\1/p' | head -n 1)
          INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN" | \
            sed -nE 's/^[[:space:]]*[0-9]+\)[[:space:]]+([[:xdigit:]]+)[[:space:]]+"(3rd Party Mac Developer Installer|Mac Installer Distribution):[^"]+".*/\1/p' | head -n 1)
          test -n "$APP_IDENTITY" || { security find-identity -v "$KEYCHAIN"; echo "::error::Mac app distribution identity not found"; exit 1; }
          test -n "$INSTALLER_IDENTITY" || { security find-identity -v "$KEYCHAIN"; echo "::error::Mac Installer Distribution identity not found"; exit 1; }

          ZIP=$(find mac_artifact -type f -name '*.zip' -print -quit)
          test -n "$ZIP" || { echo "::error::Downloaded macOS artifact contains no ZIP"; exit 1; }
          ditto -x -k "$ZIP" "$WORK_DIR/app"
          APP=$(find "$WORK_DIR/app" -maxdepth 2 -type d -name '*.app' -print -quit)
          test -n "$APP" || { echo "::error::No .app found inside macOS export"; exit 1; }
          cp "$PROFILE" "$APP/Contents/embedded.provisionprofile"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MAC_MARKETING_VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $MAC_BUILD_NUMBER" "$APP/Contents/Info.plist"

          security cms -D -i "$PROFILE" > "$WORK_DIR/profile.plist"
          PROFILE_PLIST="$WORK_DIR/profile.plist" ENTITLEMENTS="$ENTITLEMENTS" BUNDLE_ID="$BUNDLE_ID" python3 - <<'PY'
          import os
          import plistlib

          with open(os.environ["PROFILE_PLIST"], "rb") as src:
              profile = plistlib.load(src)
          entitlements = dict(profile.get("Entitlements", {}))
          app_identifier = str(entitlements.get("com.apple.application-identifier", entitlements.get("application-identifier", "")))
          if not app_identifier.endswith("." + os.environ["BUNDLE_ID"]):
              raise SystemExit("Mac provisioning profile does not match " + os.environ["BUNDLE_ID"])
          entitlements["com.apple.security.app-sandbox"] = True
          entitlements["com.apple.security.network.client"] = True
          # El juego solo abre conexiones salientes (telemetria hacia el central).
          # network.server implicaria escuchar conexiones entrantes: App Review lo
          # rechaza como entitlement sin funcionalidad asociada. Se elimina tambien
          # si viniera heredado del provisioning profile.
          entitlements.pop("com.apple.security.network.server", None)
          entitlements.pop("get-task-allow", None)
          with open(os.environ["ENTITLEMENTS"], "wb") as dst:
              plistlib.dump(entitlements, dst, sort_keys=True)
          PY

          codesign --force --deep --timestamp --options runtime \
            --entitlements "$ENTITLEMENTS" --sign "$APP_IDENTITY" --keychain "$KEYCHAIN" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          productbuild --component "$APP" /Applications \
            --sign "$INSTALLER_IDENTITY" --keychain "$KEYCHAIN" "$PKG"
          pkgutil --check-signature "$PKG"

          xcrun altool --validate-app --type macos --file "$PKG" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type macos --file "$PKG" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "macOS TestFlight upload accepted; Apple will now process build $MAC_BUILD_NUMBER."

  deploy-web:
    needs: [prep, export]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prep.result == 'success' && (needs.prep.outputs.target_platform == 'all' || needs.prep.outputs.target_platform == 'html5') && (needs.prep.outputs.ref_name == 'main' || needs.prep.outputs.is_dispatch == 'true') }}
    permissions:
      contents: read
      deployments: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Netlify artifact
        uses: actions/download-artifact@v8
        with:
          name: netlify-build
          path: netlify-build

      - name: Validate Netlify artifact
        run: |
          test -s netlify-build/index.html || { echo "::error::Missing Netlify index.html"; exit 1; }
          test -s netlify-build/index.js || { echo "::error::Missing Netlify Godot loader"; exit 1; }
          if find netlify-build -maxdepth 1 \( -name "*.pck" -o -name "*.pck.gz" -o -name "*.wasm" -o -name "*.wasm.gz" \) | grep -q .; then
            echo "::error::Netlify artifact contains heavy Godot assets that should be served from GitHub Pages"
            exit 1
          fi

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v4
        with:
          publish-dir: netlify-build/
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from ${{ needs.prep.outputs.sha }}"
          netlify-config-path: ./netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-vercel:
    needs: [prep, export]
    runs-on: ubuntu-latest
    # Es un mirror web opcional: sus fallos no deben volver rojo ni bloquear el
    # nightly, que publica únicamente desde prep + export + manifests.
    continue-on-error: true
    if: ${{ always() && needs.prep.result == 'success' && (needs.prep.outputs.target_platform == 'all' || needs.prep.outputs.target_platform == 'html5') && (needs.prep.outputs.ref_name == 'main' || needs.prep.outputs.is_dispatch == 'true') }}
    permissions:
      contents: read
      deployments: write
    environment:
      name: vercel-ios
      url: https://odisea-ios.vercel.app
    steps:
      - name: Download Vercel artifact
        uses: actions/download-artifact@v8
        with:
          name: vercel-build
          path: vercel-build

      - name: Validate Vercel artifact
        run: |
          # The Vercel deploy serves everything same-origin for cross-origin
          # isolation on Safari, so the threaded wasm + pck MUST be present here
          # (unlike the Netlify deploy, where they live on GitHub Pages).
          test -s vercel-build/index.html || { echo "::error::Missing Vercel index.html"; exit 1; }
          test -s vercel-build/index.wasm || { echo "::error::Missing Vercel index.wasm (threaded engine)"; exit 1; }
          test -s vercel-build/index.pck || { echo "::error::Missing Vercel index.pck"; exit 1; }
          test -s vercel-build/vercel.json || { echo "::error::Missing vercel.json"; exit 1; }
          grep -q "ODISEA_VERCEL_SAME_ORIGIN" vercel-build/index.html || { echo "::error::Pages interceptor not neutralized in Vercel index.html"; exit 1; }

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -u
          cd vercel-build
          # Deploy the prebuilt static dir to production and alias to the stable
          # iOS host the main site redirects Safari/iPadOS traffic to.
          URL=""
          for attempt in 1 2 3; do
            echo "Vercel deploy attempt $attempt/3"
            set +e
            OUTPUT=$(vercel deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN" 2>&1)
            STATUS=$?
            set -e
            echo "$OUTPUT"
            URL=$(echo "$OUTPUT" | grep -oE 'https://[a-z0-9._-]+\.vercel\.app' | tail -1 || true)
            if [ "$STATUS" -eq 0 ] && [ -n "$URL" ]; then
              break
            fi
            URL=""
            sleep $((attempt * 10))
          done
          echo "Deployed: $URL"
          if [ -z "$URL" ]; then echo "::error::Vercel deploy produced no URL"; exit 1; fi
          ALIASED=0
          for attempt in 1 2 3; do
            echo "Vercel alias attempt $attempt/3"
            if vercel alias set "$URL" odisea-ios.vercel.app --token "$VERCEL_TOKEN" --scope sebastian-silvas-projects-8fed1460; then
              ALIASED=1
              break
            fi
            sleep $((attempt * 10))
          done
          if [ "$ALIASED" -ne 1 ]; then echo "::error::Vercel alias failed after 3 attempts"; exit 1; fi
          echo "Aliased to https://odisea-ios.vercel.app"

  # Genera deltas bsdiff EN PARALELO al deploy/manifests (no afecta build time): baja
  # el .pck.gz y el manifest del release ANTERIOR (tag fijo "nightly", aún no
  # sobrescrito), corre bsdiff_gen contra el .pck.gz nuevo, y publica un .patch.gz por
  # plataforma. Solo 1 delta (build N-1 -> N); quien venga de más atrás recibe el full.
  # Si algo falla (no hay release previo, etc.) el job no rompe el pipeline: sin delta,
  # el cliente baja el full.
  deltas:
    needs: [prep, export]
    runs-on: ubuntu-latest
    if: |
      needs.prep.outputs.target_platform == 'all' &&
      (needs.prep.outputs.ref_name == 'main' || needs.prep.outputs.ref_name == 'release' || needs.prep.outputs.is_dispatch == 'true') &&
      github.repository == 'icarito/Odisea'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep.outputs.head_sha }}

      - name: Download new .pck artifacts
        uses: actions/download-artifact@v8
        with:
          path: all_artifacts

      - name: Build deltas vs previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gcc -O2 native/bsdiff/bsdiff_gen.c -o /tmp/bsdiff_gen
          mkdir -p deltas

          # El nightly se publica en el tag fijo "nightly"; el release estable en su tag.
          if [ "${{ needs.prep.outputs.channel }}" = "nightly" ]; then
            PREV_TAG="nightly"
          else
            # Para release estable, el "anterior" es el penúltimo tag; lo dejamos a futuro.
            echo "Delta generation for stable release not wired yet — skipping."
            exit 0
          fi

          # platform_arch:new_pck_pattern:out_platform:out_arch (solo desktop tiene .pck.gz)
          PLATFORMS=(
            "linux_x64:Odisea-Tech-Demo-Linux-*:linux:x86_64"
            "linux_arm64:Odisea-Tech-Demo-Linux-ARM64-*:linux:arm64"
            "windows:Odisea-Tech-Demo-Windows-*:windows:x86_64"
          )

          for entry in "${PLATFORMS[@]}"; do
            IFS=":" read -r P_NAME P_PATTERN P_OUT P_ARCH <<< "$entry"

            if [ "$P_NAME" = "linux_x64" ]; then
              ART_DIR=$(find all_artifacts -maxdepth 1 -name "$P_PATTERN" ! -name "Odisea-Tech-Demo-Linux-ARM64-*" -type d | head -n 1)
            else
              ART_DIR=$(find all_artifacts -maxdepth 1 -name "$P_PATTERN" -type d | head -n 1)
            fi
            NEW_GZ=$(find "$ART_DIR" -name "*.pck.gz" 2>/dev/null | head -n 1)
            if [ -z "$NEW_GZ" ]; then
              echo "No new .pck.gz for $P_NAME — skip."; continue
            fi

            # Bajar del release previo: el .pck.gz y el manifest (para su build_id).
            PREV_DIR=$(mktemp -d)
            PREV_MANIFEST="manifest-$P_OUT-$P_ARCH.json"
            if ! gh release download "$PREV_TAG" -R icarito/Odisea \
                  --pattern "$PREV_MANIFEST" --dir "$PREV_DIR" 2>/dev/null; then
              echo "No previous manifest for $P_NAME (first release?) — skip delta."; continue
            fi
            # from_build_id = build_id del manifest anterior.
            FROM_BUILD=$(python3 -c "
          import json,base64,sys
          e=json.load(open('$PREV_DIR/$PREV_MANIFEST'))
          p=json.loads(base64.b64decode(e['payload_b64']))
          print(p['build_id'])
          ")
            if [ "$FROM_BUILD" = "${{ needs.prep.outputs.build_seq }}" ]; then
              echo "Previous build == current ($FROM_BUILD) — skip (re-run?)."; continue
            fi
            # El .pck.gz previo: su nombre lleva el slug viejo; bajarlo por patrón.
            if ! gh release download "$PREV_TAG" -R icarito/Odisea \
                  --pattern "Odisea-Tech-Demo-*$P_OUT*.pck.gz" --dir "$PREV_DIR" 2>/dev/null; then
              # Patrón por nombre de artefacto desktop.
              case "$P_NAME" in
                linux_x64) PAT="Odisea-Tech-Demo-Linux-*.pck.gz" ;;
                linux_arm64) PAT="Odisea-Tech-Demo-Linux-ARM64-*.pck.gz" ;;
                windows) PAT="Odisea-Tech-Demo-Windows-*.pck.gz" ;;
              esac
              gh release download "$PREV_TAG" -R icarito/Odisea --pattern "$PAT" --dir "$PREV_DIR" 2>/dev/null || true
            fi
            if [ "$P_NAME" = "linux_x64" ]; then
              PREV_GZ=$(find "$PREV_DIR" -name "*.pck.gz" ! -name "*ARM64*" | head -n 1)
            else
              PREV_GZ=$(find "$PREV_DIR" -name "*.pck.gz" | head -n 1)
            fi
            if [ -z "$PREV_GZ" ]; then
              echo "No previous .pck.gz for $P_NAME — skip delta."; continue
            fi

            # Descomprimir ambos .pck y diffear.
            gunzip -c "$PREV_GZ" > "$PREV_DIR/old.pck"
            gunzip -c "$NEW_GZ" > "$PREV_DIR/new.pck"
            /tmp/bsdiff_gen "$PREV_DIR/old.pck" "$PREV_DIR/new.pck" "$PREV_DIR/patch.ods"

            OUT_GZ="deltas/Odisea-Tech-Demo-$P_OUT-$P_ARCH-${{ needs.prep.outputs.version_slug }}-from-$FROM_BUILD.patch.gz"
            gzip -9 -n -c "$PREV_DIR/patch.ods" > "$OUT_GZ"
            # Meta para que 'manifests' sepa el from_build_id y el plat/arch del patch.
            echo "{\"platform\":\"$P_OUT\",\"arch\":\"$P_ARCH\",\"from_build_id\":\"$FROM_BUILD\",\"patch_gz\":\"$(basename "$OUT_GZ")\"}" \
              > "deltas/delta-$P_OUT-$P_ARCH.json"
            FULL=$(stat -c%s "$PREV_DIR/new.pck"); PATCHSZ=$(stat -c%s "$OUT_GZ")
            echo "Delta $P_NAME from $FROM_BUILD: patch.gz $PATCHSZ bytes vs full $FULL bytes"
            rm -rf "$PREV_DIR"
          done

          ls -la deltas/ || echo "No deltas produced."

      - name: Upload Deltas Artifact
        uses: actions/upload-artifact@v7
        with:
          name: update-deltas
          path: deltas/
          if-no-files-found: ignore

  manifests:
    needs: [prep, export]
    runs-on: ubuntu-latest
    # Generate signed manifests only for main (nightly) or release branches.
    # Forks don't have access to the signing secret and shouldn't publish manifests.
    if: |
      needs.prep.outputs.target_platform == 'all' &&
      (needs.prep.outputs.ref_name == 'main' || needs.prep.outputs.ref_name == 'release' || needs.prep.outputs.is_dispatch == 'true') &&
      github.repository == 'icarito/Odisea'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep.outputs.head_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all_artifacts

      - name: Generate Signed Manifests
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # If the secret is missing, we skip signing but don't fail (unless on release branch)
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            if [ "${{ needs.prep.outputs.ref_name }}" = "release" ]; then
              echo "::error::UPDATE_SIGNING_KEY is missing for a release build!"
              exit 1
            fi
            echo "UPDATE_SIGNING_KEY is missing — skipping manifest generation."
            exit 0
          fi

          mkdir -p signed_manifests

          # Define platforms and their artifact names as seen in the 'export' job matrix
          # Format: platform_arch:artifact_pattern:output_platform:output_arch
          # OJO: el patrón de linux_x64 NO debe matchear el de ARM64
          # (Odisea-Tech-Demo-Linux-* incluiría Linux-ARM64-*). El find de abajo
          # excluye explícitamente ARM64 para el caso x64.
          PLATFORMS=(
            "linux_x64:Odisea-Tech-Demo-Linux-*:linux:x86_64"
            "linux_arm64:Odisea-Tech-Demo-Linux-ARM64-*:linux:arm64"
            "windows:Odisea-Tech-Demo-Windows-*:windows:x86_64"
            "macos:Odisea-Tech-Demo-macOS-*:macos:universal"
            "android:Odisea-Tech-Demo-Android-*:android:arm64"
            "html5:Odisea-Tech-Demo-Web-*:html5:wasm"
          )

          VERSION="${{ needs.prep.outputs.version }}"
          # build_seq (run_number monotónico), no github.run_id: debe coincidir con el
          # build-id inyectado en el juego (Inject build metadata) para que el server
          # haga bien la comparación de igualdad y el cliente la de release_sequence.
          BUILD_ID="${{ needs.prep.outputs.build_seq }}"
          CHANNEL="${{ needs.prep.outputs.channel }}"
          COMMIT="${{ needs.prep.outputs.head_sha }}"

          # base_url de descarga: debe apuntar al TAG real del release, no a $VERSION.
          # El nightly se publica siempre en el tag fijo "nightly" (el job 'nightly'
          # borra/recrea ese release); $VERSION además trae espacios/paréntesis y no
          # sirve como URL. Por eso antes el manifest tenía una URL de descarga rota.
          if [ "$CHANNEL" = "nightly" ]; then
            RELEASE_TAG="nightly"
          else
            RELEASE_TAG="$VERSION"
          fi
          ARTIFACT_BASE_URL="https://github.com/icarito/Odisea/releases/download/$RELEASE_TAG"

          # Extract public key for audit asset. Name matches expected format for
          # scripts/update_manifest.py verify: {key_id}.pub.pem
          KEY_ID="release-2026-a"
          echo "$UPDATE_SIGNING_KEY" > private.pem
          openssl rsa -in private.pem -pubout -out "$KEY_ID.pub.pem"
          rm private.pem

          for entry in "${PLATFORMS[@]}"; do
            IFS=":" read -r P_NAME P_PATTERN P_OUT P_ARCH <<< "$entry"

            # Find the directory for this artifact (artifact_name-version-sha).
            # Para linux_x64 excluir el dir de ARM64 (su patrón es un prefijo del de x64).
            if [ "$P_NAME" = "linux_x64" ]; then
              ART_DIR=$(find all_artifacts -maxdepth 1 -name "$P_PATTERN" ! -name "Odisea-Tech-Demo-Linux-ARM64-*" -type d | head -n 1)
            else
              ART_DIR=$(find all_artifacts -maxdepth 1 -name "$P_PATTERN" -type d | head -n 1)
            fi

            if [ -n "$ART_DIR" ]; then
              echo "Generating manifest for $P_NAME ($P_OUT/$P_ARCH) from $ART_DIR"
              python3 scripts/update_manifest.py generate \
                --artifacts-dir "$ART_DIR" \
                --output "signed_manifests/manifest-$P_OUT-$P_ARCH.json" \
                --key "$UPDATE_SIGNING_KEY" \
                --key-id "$KEY_ID" \
                --version "$VERSION" \
                --build-id "$BUILD_ID" \
                --channel "$CHANNEL" \
                --platform "$P_OUT" \
                --arch "$P_ARCH" \
                --commit "$COMMIT" \
                --base-url "$ARTIFACT_BASE_URL"

              # Si el job 'deltas' produjo un patch para esta plataforma, inyectarlo en
              # el manifest (re-firma el payload). El .patch.gz se publica como asset del
              # mismo release, así que la base-url es la misma.
              DELTA_META="all_artifacts/update-deltas/delta-$P_OUT-$P_ARCH.json"
              if [ -f "$DELTA_META" ]; then
                FROM_BUILD=$(python3 -c "import json;print(json.load(open('$DELTA_META'))['from_build_id'])")
                PATCH_GZ_NAME=$(python3 -c "import json;print(json.load(open('$DELTA_META'))['patch_gz'])")
                PATCH_GZ="all_artifacts/update-deltas/$PATCH_GZ_NAME"
                if [ -f "$PATCH_GZ" ]; then
                  echo "Adding delta from build $FROM_BUILD for $P_NAME"
                  python3 scripts/update_manifest.py add-delta \
                    --manifest "signed_manifests/manifest-$P_OUT-$P_ARCH.json" \
                    --patch-gz "$PATCH_GZ" \
                    --from-build-id "$FROM_BUILD" \
                    --key "$UPDATE_SIGNING_KEY" \
                    --key-id "$KEY_ID" \
                    --base-url "$ARTIFACT_BASE_URL"
                fi
              fi
            else
              echo "Warning: No artifact found for $P_NAME matching $P_PATTERN"
            fi
          done

      - name: Upload Manifests Artifact
        uses: actions/upload-artifact@v7
        with:
          name: update-manifests
          path: |
            signed_manifests/*.json
            *.pub.pem

  release:
    needs: [prep, export, manifests]
    runs-on: ubuntu-latest
    # Solo libera un release estable desde la rama 'release'. Un workflow_dispatch
    # NO publica release (publicaba un 0.1.0 indeseado); usar publish_prerelease=true
    # para un nightly manual, o pushear a 'release' para liberar de verdad.
    if: needs.prep.outputs.ref_name == 'release' && needs.prep.outputs.target_platform == 'all'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prep.outputs.version }}
          files: |
            release_assets/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly:
    # Deliberadamente independiente de deploy-vercel: el mirror iOS no participa
    # en la publicación de binarios/manifests del updater.
    needs: [prep, export, manifests]
    runs-on: ubuntu-latest
    if: needs.prep.outputs.target_platform == 'all' && (needs.prep.outputs.ref_name == 'main' || (needs.prep.outputs.is_dispatch == 'true' && needs.prep.outputs.publish_prerelease == 'true'))
    # La fase de publicación NO debe ser cancelada a mitad por un run más nuevo
    # (cancel-in-progress del workflow). Con un concurrency propio SIN
    # cancel-in-progress, dos publicaciones se encolan (la nueva espera a que la
    # vieja termine) en vez de cortarse a la mitad. El orden binarios->manifest ya
    # la hace segura aunque se corte, pero encolar evita estados intermedios.
    concurrency:
      group: nightly-publish-${{ github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prep.outputs.head_sha }}
          fetch-depth: 50  # historial para el changelog del release

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: nightly_assets
          merge-multiple: true

      - name: Update Nightly Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="nightly"
          NIGHTLY_DATE=$(date -u +'%Y-%m-%d')

          # Show all files for debugging
          echo "=== Files in nightly_assets ==="
          find nightly_assets -type f -print | sort
          echo "=== End of file listing ==="

          # Separar BINARIOS (zip/apk/pem) de MANIFESTS. El manifest es lo que el
          # server lee para decidir qué descargar, así que debe subirse SIEMPRE
          # DESPUÉS de los binarios: si no, hay una ventana (o un run cancelado por
          # cancel-in-progress) donde el manifest apunta a un .zip que aún no existe
          # -> el cliente baja 404. Por eso ya NO borramos+recreamos el release
          # (delete+create dejaba todo ausente entre medio); usamos upload --clobber.
          # Los .pck (target del update in-app) y los .patch.gz (delta bsdiff) van con
          # los binarios: el manifest apunta a ellos, así que deben existir ANTES de
          # subir el manifest.
          mapfile -t BIN_FILES < <(find nightly_assets -type f \( -name "*.zip" -o -name "*.apk" -o -name "*.ipa" -o -name "*.pck" -o -name "*.pck.gz" -o -name "*.patch.gz" -o -name "*.pem" \) -print | sort)
          mapfile -t MANIFEST_FILES < <(find nightly_assets -type f -name "manifest-*.json" -print | sort)
          if [ "${#BIN_FILES[@]}" -eq 0 ]; then
            echo "::error::No binary artifacts found in nightly_assets"
            find nightly_assets -maxdepth 3 -type f -print || true
            exit 1
          fi

          # Notas del release: changelog (commits desde el tag nightly anterior) +
          # artefactos. release_notes_url del manifest apunta acá, así que el botón
          # "ver cambios" del cliente muestra algo útil.
          echo "## Nightly $(date -u +'%Y-%m-%d %H:%M') UTC" > body.md
          echo "" >> body.md
          echo "Commit: \`${{ needs.prep.outputs.sha }}\`" >> body.md
          echo "" >> body.md
          echo "### Changes" >> body.md
          PREV_TAG_SHA=$(git rev-list -n 1 nightly 2>/dev/null || true)
          if [ -n "$PREV_TAG_SHA" ] && git merge-base --is-ancestor "$PREV_TAG_SHA" HEAD 2>/dev/null; then
            RANGE="$PREV_TAG_SHA..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          git log --pretty=format:'- %s (%h)' "$RANGE" 2>/dev/null | grep -viE '^\- (Merge |chore: bump|temp|wip)' | head -40 >> body.md || echo "- (sin cambios listables)" >> body.md
          echo "" >> body.md
          echo "" >> body.md
          echo "### Artifacts" >> body.md
          echo "| Artifact | Size |" >> body.md
          echo "|---|---|" >> body.md
          du -h "${BIN_FILES[@]}" "${MANIFEST_FILES[@]}" | awk '{n=split($2,a,"/"); print "| " a[n] " | " $1 " |"}' >> body.md

          # 1. Asegurar que el release existe (sin borrarlo). Si no existe, crearlo
          #    vacío; si existe, solo actualizar notas/target. No se borra para no
          #    dejar el release ausente entre delete y create.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nightly $NIGHTLY_DATE · ${{ needs.prep.outputs.version_slug }}" \
              --notes-file body.md --target "${{ needs.prep.outputs.head_sha }}" --prerelease
          else
            gh release create "$TAG" --title "Nightly $NIGHTLY_DATE · ${{ needs.prep.outputs.version_slug }}" --notes-file body.md \
              --prerelease --target "${{ needs.prep.outputs.head_sha }}"
          fi

          # 2. Subir PRIMERO los binarios (clobber reemplaza los del commit anterior).
          gh release upload "$TAG" "${BIN_FILES[@]}" --clobber

          # 3. Subir el manifest AL FINAL, ya con los binarios presentes. Recién acá
          #    el server puede servir un manifest cuyo download URL existe.
          if [ "${#MANIFEST_FILES[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${MANIFEST_FILES[@]}" --clobber
          fi

          # 4. Limpiar binarios de commits viejos que quedaron en el release (sus
          #    nombres llevan el sha, así que no los pisa el --clobber del actual).
          KEEP_SHA="${{ needs.prep.outputs.version_slug }}"
          for old in $(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null); do
            case "$old" in
              *.zip|*.apk|*.ipa|*.pck|*.pck.gz)
                if [[ "$old" != *"$KEEP_SHA"* ]]; then
                  echo "Removing stale asset: $old"
                  gh release delete-asset "$TAG" "$old" --yes || true
                fi
                ;;
            esac
          done

      - name: Discord Notification
        if: success()
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          REPO="${{ github.repository }}"
          URL="https://github.com/$REPO/releases/tag/nightly"
          MSG="🚀 **New Release available for $REPO: $VERSION**\nCheck it out at: $URL"
          if [ -n "${{ secrets.DISCORD_WEBHOOK }}" ]; then
            curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"$MSG\"}" "${{ secrets.DISCORD_WEBHOOK }}"
          fi
