name: Release Multiplataforma

# Releases are gated on a green test run: this workflow only fires after
# "Odyssey Pytest Runner" completes on main/release, and prep aborts unless
# that run concluded with success. This prevents broken commits (e.g. a
# GDScript syntax error merged to main) from triggering a multiplatform
# export or publishing a release. `workflow_dispatch` still allows manual
# builds, which bypass the gate intentionally.
on:
  workflow_run:
    workflows: [ "Odyssey Pytest Runner" ]
    types: [ completed ]
    branches: [ "main", "release" ]
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'Publish a GitHub pre-release from this manual build'
        required: false
        default: false
        type: boolean
      version:
        description: 'Version tag override (optional, e.g. v1.0.0-preview)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

# Solo el export más reciente por rama debe correr: si entra un run nuevo (push a
# main vía workflow_run, o un dispatch) mientras hay uno en curso de la misma rama,
# se cancela el viejo. Se agrupa por la rama del CÓDIGO buildeado: bajo workflow_run
# github.ref apunta al archivo del workflow (default branch), así que usamos
# head_branch del run que disparó; bajo dispatch, github.ref_name.
concurrency:
  group: export-all-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  prep:
    runs-on: ubuntu-latest
    # Only run when the triggering test run succeeded. Manual dispatches have
    # no workflow_run payload, so the conclusion check passes through.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      # Slug seguro para nombres de archivo/URL (sin espacios ni paréntesis): el
      # VERSION humano "0.1.0-nightly+sha (fecha)" rompía los nombres de asset y las
      # URLs de descarga del manifest (GitHub sanitiza el asset y el filename dejaba
      # de coincidir -> 404). version_slug se usa SOLO para nombres; version sigue
      # siendo el string humano que muestra el juego.
      version_slug: ${{ steps.meta.outputs.version_slug }}
      sha: ${{ steps.meta.outputs.sha }}
      channel: ${{ steps.meta.outputs.channel }}
      # Android needs a monotonic integer versionCode or the device refuses to
      # update over an existing install. We derive it from the git commit count
      # (always increases). version_name reuses the human version string.
      android_version_code: ${{ steps.meta.outputs.android_version_code }}
      android_version_name: ${{ steps.meta.outputs.android_version_name }}
      # release_sequence/build_id del manifest de update: el cliente compara
      # seq <= last_seq para decidir "más nueva". github.run_id NO es monotónico
      # creciente (un build viejo con run_id mayor bloqueaba uno nuevo). Usamos
      # run_number: entero monotónico simple, el mismo que el versionCode del APK.
      build_seq: ${{ steps.meta.outputs.build_seq }}
      # Branch and full SHA, normalized across workflow_run and workflow_dispatch
      # so downstream jobs never have to read github.ref / github.event_name,
      # which mean different things under workflow_run.
      ref_name: ${{ steps.meta.outputs.ref_name }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      is_dispatch: ${{ steps.meta.outputs.is_dispatch }}
      publish_prerelease: ${{ steps.meta.outputs.publish_prerelease }}
    steps:
      - id: ctx
        run: |
          # Resolve the branch and commit being built. Under workflow_run these
          # come from the triggering run; under workflow_dispatch from the ref
          # the workflow was launched against.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            REF_NAME="${{ github.event.workflow_run.head_branch }}"
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            REF_NAME="${{ github.ref_name }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          echo "ref_name=$REF_NAME" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.head_sha }}
      - id: meta
        env:
          REF_NAME: ${{ steps.ctx.outputs.ref_name }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
        run: |
          SHA=$(git rev-parse --short "$HEAD_SHA")
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "ref_name=$REF_NAME" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT

          IS_DISPATCH=false
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && IS_DISPATCH=true
          echo "is_dispatch=$IS_DISPATCH" >> $GITHUB_OUTPUT
          echo "publish_prerelease=${{ github.event.inputs.publish_prerelease }}" >> $GITHUB_OUTPUT

          # Base version from project.godot. Godot la escribe como "config/version="
          # bajo la sección [application] (no "application/config/version="), así que
          # el grep anterior nunca matcheaba y caía SIEMPRE al fallback 0.1.0,
          # ignorando la versión real (v0.3.2). Aceptamos ambas formas. Se quita un
          # eventual prefijo "v" para que el versionado sea numérico.
          BASE_VERSION=$(grep -E "^(application/)?config/version=" project.godot | head -n 1 | cut -d'"' -f2 | sed -E 's/^v//' || true)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="0.1.0"
          fi

          # Determine channel
          CHANNEL="dev"
          if [ "$REF_NAME" = "main" ]; then
            CHANNEL="nightly"
          elif [ "$REF_NAME" = "release" ]; then
            CHANNEL="release"
          fi

          # Manual overrides. Un workflow_dispatch NUNCA debe publicar un release
          # estable: hoy solo se publica nightly. Antes, un dispatch sin marcar
          # publish_prerelease ponía CHANNEL=release y el job 'release' publicaba un
          # tag 0.1.0 no querido. Un dispatch desde la rama 'release' sí libera; desde
          # cualquier otra rama (p.ej. main) queda en nightly.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$REF_NAME" != "release" ]; then
            CHANNEL="nightly"
          fi
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

          # Construct version with date (FD-234)
          BUILD_DATE=$(date -u +%Y-%m-%d)
          VERSION="$BASE_VERSION"
          if [ "$CHANNEL" = "nightly" ]; then
            VERSION="$BASE_VERSION-nightly+$SHA ($BUILD_DATE)"
          else
            VERSION="$BASE_VERSION ($BUILD_DATE)"
          fi
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # version_slug: VERSION sin caracteres problemáticos para filenames/URLs.
          # Quita "(...)" (la fecha), colapsa espacios y deja solo [A-Za-z0-9.+_-].
          VERSION_SLUG=$(echo "$VERSION" | sed -E 's/\([^)]*\)//g; s/[[:space:]]+//g; s/[^A-Za-z0-9.+_-]/-/g')
          echo "version_slug=$VERSION_SLUG" >> $GITHUB_OUTPUT

          # Android versionCode: a strictly-increasing integer is required for
          # the device to accept an update over an existing install. github's
          # run_number increments on every workflow run and never depends on
          # git checkout depth, so it's a reliable monotonic source. versionName
          # is the human version string the in-game notifier already shows.
          echo "android_version_code=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "android_version_name=$VERSION" >> $GITHUB_OUTPUT

          # build_seq: secuencia monotónica para el manifest de update (release_sequence).
          # run_number es un entero simple que crece en cada run del workflow; es la
          # misma fuente que el versionCode del APK.
          echo "build_seq=${{ github.run_number }}" >> $GITHUB_OUTPUT

  export:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        platform: [linux_x64, linux_arm64, windows, macos, ios, android, html5]
        include:
          - platform: linux_x64
            os: ubuntu-latest
            preset: "Linux/X11 x86_64"
            artifact_name: Odisea-Tech-Demo-Linux
          # macOS is exported from Linux: the GitHub macos-latest runner is an
          # Apple Silicon box with only ~7 GB RAM, and the universal export
          # (x86_64 + arm64) blows past that and gets OOM-killed (SIGKILL /
          # "Killed: 9"). Godot 3.6 can produce the macOS .zip from a Linux
          # runner (16 GB) as long as the osx export template is installed,
          # which the "Install Templates" step already does from the .tpz.
          - platform: linux_arm64
            os: ubuntu-latest
            preset: "Linux/X11 ARM64"
            artifact_name: Odisea-Tech-Demo-Linux-ARM64
          - platform: windows
            os: ubuntu-latest
            preset: "Windows Desktop"
            artifact_name: Odisea-Tech-Demo-Windows
          - platform: macos
            os: ubuntu-latest
            preset: "macOS Universal"
            artifact_name: Odisea-Tech-Demo-macOS
          - platform: ios
            os: macos-latest
            preset: "iOS"
            artifact_name: Odisea-Tech-Demo-iOS
          - platform: android
            os: ubuntu-latest
            preset: "Android"
            artifact_name: Odisea-Tech-Demo-Android
            container: barichello/godot-ci:3.6.2
          - platform: html5
            os: ubuntu-latest
            preset: "HTML5 Threads"
            artifact_name: Odisea-Tech-Demo-Web

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.head_sha }}

      # `secrets` and `matrix` can't be used in a job-level `if`, so gate iOS at
      # the step level instead: detect missing certs here and skip the iOS-only
      # steps below when they're absent.
      - name: Check iOS signing availability
        id: ios_gate
        env:
          IOS_CERT_P12_B64: ${{ secrets.IOS_CERT_P12_B64 }}
          IOS_PROVISION_B64: ${{ secrets.IOS_PROVISION_B64 }}
        run: |
          if [ "${{ matrix.platform }}" = "ios" ] && { [ -z "$IOS_CERT_P12_B64" ] || [ -z "$IOS_PROVISION_B64" ]; }; then
            echo "iOS signing secrets missing — skipping iOS export."
            echo "skip_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_ios=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Python (Android container)
        if: matrix.platform == 'android'
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 --version
            exit 0
          fi
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            if command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            else
              echo "::error::python3 not found and package install requires root or sudo"
              exit 1
            fi
          fi
          if command -v apt-get >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y python3
          elif command -v apk >/dev/null 2>&1; then
            $SUDO apk add --no-cache python3
          else
            echo "::error::python3 not found and no supported package manager is available"
            exit 1
          fi
          python3 --version

      - name: Disable editor plugins
        run: python3 scripts/disable_plugins.py

      - name: Inject build metadata
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          # FD-234: Inject version + hash + date into project.godot
          sed -i -E "s/^(application\/)?config\/version=\".*\"/config\/version=\"$VERSION\"/" project.godot
          python3 scripts/inject_build_meta.py \
            --token "${{ secrets.ODISEA_CENTRAL_INGEST_TOKEN }}" \
            --commit "${{ needs.prep.outputs.head_sha }}" \
            --build-id "${{ needs.prep.outputs.build_seq }}" \
            --channel "${{ needs.prep.outputs.channel }}" \
            --version "${{ needs.prep.outputs.version }}" \
            --official-host "odisea.educa.juegos" \
            --out-js "build_meta.js" \
            --out-json "build_meta.json"
          python3 - <<'PY'
          import json
          import sys
          meta = json.load(open("build_meta.json", "r", encoding="utf-8"))
          token = str(meta.get("token", "")).strip()
          if not token or token == "ODISEA_TOKEN_CANARY_MISSING" or "canary" in token.lower():
              print("::error::ODISEA_CENTRAL_INGEST_TOKEN is missing; refusing to export a canary telemetry build")
              sys.exit(1)
          print("Build metadata OK: token present, channel=%s, build_id=%s" % (
              meta.get("channel", ""),
              meta.get("build_id", ""),
          ))
          PY

      # Cache de templates/config de Godot (igual para todas las plataformas).
      # OJO: el .import/ NO va acá: cada plataforma genera variantes VRAM distintas
      # (tras "Limit texture import formats"), así que su cache se hace por separado
      # y DESPUÉS de ese step, para no cruzar formatos entre plataformas (antes las
      # 6 plataformas Linux compartían la misma key y podían leer un .import ajeno).
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.config/godot
            ~/.local/share/godot
            ~/Library/Application Support/Godot/templates
            .godot/
          key: ${{ runner.os }}-godot-all-${{ hashFiles('**/project.godot') }}-${{ hashFiles('**/*.import') }}
          restore-keys: |
            ${{ runner.os }}-godot-all-${{ hashFiles('**/project.godot') }}-
            ${{ runner.os }}-godot-all-

      - name: Install Godot (Linux)
        if: runner.os == 'Linux' && matrix.platform != 'android'
        run: |
          GODOT_DIR="$HOME/.local/bin"
          mkdir -p "$GODOT_DIR"
          echo "$GODOT_DIR" >> "$GITHUB_PATH"
          if [ ! -f "$GODOT_DIR/godot3-server" ]; then
            curl -fSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_linux_headless.64.zip"
            unzip -o /tmp/godot.zip -d "$GODOT_DIR/"
            chmod +x "$GODOT_DIR/Godot_v3.6.2-stable_linux_headless.64"
            ln -sf "$GODOT_DIR/Godot_v3.6.2-stable_linux_headless.64" "$GODOT_DIR/godot3-server"
          fi
          echo "GODOT_BIN=godot3-server" >> $GITHUB_ENV

      - name: Install Godot (macOS)
        if: runner.os == 'macOS'
        run: |
          GODOT_DIR="$HOME/.local/bin"
          mkdir -p "$GODOT_DIR"
          echo "$GODOT_DIR" >> "$GITHUB_PATH"
          if [ ! -f "$GODOT_DIR/godot" ]; then
            curl -fSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_osx.universal.zip"
            unzip -o /tmp/godot.zip -d /tmp/godot_extract
            mv /tmp/godot_extract/Godot.app/Contents/MacOS/Godot "$GODOT_DIR/godot"
            chmod +x "$GODOT_DIR/godot"
          fi
          echo "GODOT_BIN=godot" >> $GITHUB_ENV

      - name: Install Templates
        if: matrix.platform != 'android'
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            TPL_DIR="$HOME/Library/Application Support/Godot/templates/3.6.2.stable"
          else
            TPL_DIR="$HOME/.local/share/godot/templates/3.6.2.stable"
          fi

          case "${{ matrix.platform }}" in
            macos) REQUIRED_TEMPLATE="$TPL_DIR/osx.zip" ;;
            ios) REQUIRED_TEMPLATE="$TPL_DIR/iphone.zip" ;;
            windows) REQUIRED_TEMPLATE="$TPL_DIR/windows_64_release.exe" ;;
            html5) REQUIRED_TEMPLATE="$TPL_DIR/webassembly_release.zip" ;;
            linux_arm64) REQUIRED_TEMPLATE="$TPL_DIR/linux_x11_arm64_release" ;;
            *) REQUIRED_TEMPLATE="$TPL_DIR/linux_x11_64_release" ;;
          esac

          if [ ! -f "$REQUIRED_TEMPLATE" ]; then
            mkdir -p "$TPL_DIR"
            curl -fSL -o /tmp/tpz.zip "https://github.com/godotengine/godot/releases/download/3.6.2-stable/Godot_v3.6.2-stable_export_templates.tpz"
            rm -rf /tmp/tpz_extract
            unzip -o /tmp/tpz.zip -d /tmp/tpz_extract/
            if [ -d /tmp/tpz_extract/templates ]; then
              cp -a /tmp/tpz_extract/templates/* "$TPL_DIR/"
            fi
          fi
          test -f "$REQUIRED_TEMPLATE" || { echo "::error::Missing export template: $REQUIRED_TEMPLATE"; exit 1; }

          if [ "${{ matrix.platform }}" = "html5" ]; then
            # The "HTML5 Threads" preset reads the webassembly_release.zip slot;
            # swap in the threads template so Godot picks it up.
            cp "$TPL_DIR/webassembly_threads_release.zip" "$TPL_DIR/webassembly_release.zip"
          fi

      - name: iOS Certificates Setup
        if: matrix.platform == 'ios' && steps.ios_gate.outputs.skip_ios != 'true'
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.IOS_CERT_P12_B64 }}
          p12-password: ${{ secrets.IOS_CERT_PASSWORD }}

      - name: iOS Provisioning Setup
        if: matrix.platform == 'ios' && steps.ios_gate.outputs.skip_ios != 'true'
        env:
          IOS_PROVISION_B64: ${{ secrets.IOS_PROVISION_B64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISION_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/odisea.mobileprovision"

      - name: Android Keystore Setup
        if: matrix.platform == 'android'
        run: |
          mkdir -p android
          keytool -genkey -v -keystore android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Android Templates Setup
        if: matrix.platform == 'android'
        run: |
          set -e
          DEST_NEW="$HOME/.local/share/godot/export_templates/3.6.2.stable"
          DEST_OLD="$HOME/.local/share/godot/templates/3.6.2.stable"
          mkdir -p "$DEST_NEW" "$DEST_OLD"
          SRC=""
          for c in /root/.local/share/godot/export_templates/3.6.2.stable \
                   /root/.local/share/godot/templates/3.6.2.stable; do
            [ -d "$c" ] && SRC="$c" && break
          done
          if [ -z "$SRC" ]; then echo "::error::No export templates found"; exit 1; fi
          cp -a "$SRC"/. "$DEST_NEW"/
          cp -a "$SRC"/. "$DEST_OLD"/

      - name: Android Editor Settings
        if: matrix.platform == 'android'
        run: |
          JDK_PATH="/usr/lib/jvm/java-11-openjdk-amd64"
          if [ ! -d "$JDK_PATH" ]; then JDK_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"; fi
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=2]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JDK_PATH\""
          } > "$HOME/.config/godot/editor_settings-3.tres"

      - name: Android Version Stamp
        if: matrix.platform == 'android'
        env:
          ANDROID_VERSION_CODE: ${{ needs.prep.outputs.android_version_code }}
          ANDROID_VERSION_NAME: ${{ needs.prep.outputs.android_version_name }}
        run: |
          set -e
          # Stamp a monotonic versionCode (+ human versionName) into the Android
          # preset so the built APK installs over a previous one without an
          # uninstall. These keys live only in the Android preset block.
          echo "Android versionCode=$ANDROID_VERSION_CODE versionName=$ANDROID_VERSION_NAME"
          sed -i -E "s|^version/code = .*|version/code = ${ANDROID_VERSION_CODE}|" export_presets.cfg
          sed -i -E "s|^version/name = .*|version/name = \"${ANDROID_VERSION_NAME}\"|" export_presets.cfg

      # Android usa custom build (Gradle) por el plugin nativo / deep-link, y compila
      # el APK desde cero cada run (~3min del paso Export). Cachear el repo de
      # dependencias y artefactos de Gradle hace el build incremental y baja bastante
      # ese tiempo. La key se invalida si cambian los archivos de build de Android.
      - name: Cache Gradle (Android)
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android/build/build.gradle', 'android/build/config.gradle', 'android/build/AndroidManifest.xml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      - name: Limit texture import formats per platform
        # En Python: portable entre Linux (las 6 plataformas) y macOS (iOS corre en
        # macos-latest, donde BSD sed difiere de GNU sed y rompía el script anterior).
        run: |
          python3 - "${{ matrix.platform }}" <<'PY'
          import sys, re
          platform = sys.argv[1]

          # El step de import (godot --editor --quit) genera una variante VRAM por
          # cada formato habilitado, para CADA textura. Generar formatos que la
          # plataforma no usa hacía el import ~14min (vs ~1-3min con lo justo).
          # El proyecto es GLES2: BPTC (GLES3/Vulkan) nunca se usa; desktop usa S3TC;
          # móvil/web usa ETC/ETC2; iOS conserva PVRTC.
          # bptc, etc, etc2, pvrtc -> True = importar. S3TC siempre se genera.
          fmts = {
              "linux_x64":   dict(bptc=False, etc=False, etc2=False, pvrtc=False),
              "windows":     dict(bptc=False, etc=False, etc2=False, pvrtc=False),
              "macos":       dict(bptc=False, etc=False, etc2=False, pvrtc=False),
              "linux_arm64": dict(bptc=False, etc=True,  etc2=False, pvrtc=False),
              "android":     dict(bptc=False, etc=True,  etc2=True,  pvrtc=False),
              # html5: el proyecto es GLES2 -> WebGL1 -> usa ETC1, NO ETC2 (que es
              # WebGL2/GLES3). Generar ETC2 además triplicaba las texturas del .pck
              # web (215MB vs ~desktop). Solo ETC (+ S3TC por default) -> bundle mucho
              # menor. ETC2 off.
              "html5":       dict(bptc=False, etc=True,  etc2=False, pvrtc=False),
              "ios":         dict(bptc=False, etc=True,  etc2=True,  pvrtc=True),
          }[platform]

          # 1) project.godot: ajustar vram_compression/import_* dentro de [rendering].
          path = "project.godot"
          lines = open(path, encoding="utf-8").read().splitlines()
          out, in_rendering, seen = [], False, set()
          def kv(k, v):
              return f"vram_compression/import_{k}={'true' if v else 'false'}"
          for line in lines:
              if re.match(r"^\[.*\]\s*$", line):
                  # Al salir de [rendering], agregar las claves que faltaban.
                  if in_rendering:
                      for k, v in fmts.items():
                          if k not in seen:
                              out.append(kv(k, v))
                  in_rendering = line.strip() == "[rendering]"
                  out.append(line)
                  continue
              m = re.match(r"^vram_compression/import_(\w+)=", line)
              if in_rendering and m and m.group(1) in fmts:
                  k = m.group(1)
                  out.append(kv(k, fmts[k]))
                  seen.add(k)
              else:
                  out.append(line)
          if in_rendering:  # [rendering] era la última sección
              for k, v in fmts.items():
                  if k not in seen:
                      out.append(kv(k, v))
          open(path, "w", encoding="utf-8").write("\n".join(out) + "\n")
          print(f"VRAM import formats for {platform}:")
          for ln in out:
              if ln.startswith("vram_compression/"):
                  print("  " + ln)

          # 2) Si BPTC no se importa, el preset desktop no debe pedir exportarlo.
          preset_for = {"linux_x64": "1", "windows": "5", "macos": "6"}
          if not fmts["bptc"] and platform in preset_for:
              idx = preset_for[platform]
              cfg = "export_presets.cfg"
              txt = open(cfg, encoding="utf-8").read().splitlines()
              res, in_block = [], False
              for line in txt:
                  if re.match(r"^\[preset\.\d+\.options\]\s*$", line):
                      in_block = (line.strip() == f"[preset.{idx}.options]")
                  elif re.match(r"^\[preset\.", line):
                      in_block = False
                  if in_block and line.strip() == "texture_format/bptc = true":
                      line = "texture_format/bptc = false"
                  res.append(line)
              open(cfg, "w", encoding="utf-8").write("\n".join(res) + "\n")
              print(f"Disabled texture_format/bptc in preset.{idx} for {platform}")
          PY

      # Cache del .import/ POR PLATAFORMA, después de fijar los formatos VRAM.
      # La key incluye matrix.platform y el hash del project.godot ya modificado,
      # así cada plataforma reusa su propio .import sin cruzarse con otra (linux=S3TC,
      # android=ETC2, ...). En el primer run de cada plataforma es MISS y el import
      # genera; a partir de ahí, cache hit -> import casi instantáneo.
      - name: Cache .import (per platform)
        uses: actions/cache@v4
        with:
          path: |
            .import/
          key: ${{ runner.os }}-import-${{ matrix.platform }}-${{ hashFiles('**/project.godot') }}-${{ hashFiles('**/*.import') }}
          restore-keys: |
            ${{ runner.os }}-import-${{ matrix.platform }}-${{ hashFiles('**/project.godot') }}-
            ${{ runner.os }}-import-${{ matrix.platform }}-

      - name: Export
        if: steps.ios_gate.outputs.skip_ios != 'true'
        run: |
          # Use 'godot' if 'godot3-server' is not set (container environment)
          G_BIN="${GODOT_BIN:-godot}"

          # Import step
          $G_BIN --editor --quit --headless || true

          case "${{ matrix.platform }}" in
            linux_x64) OUT="build/linux_x86_64/Odisea-Tech-Demo.x86_64" ;;
            linux_arm64) OUT="build/linux_arm64/Odisea-Tech-Demo.arm64" ;;
            windows) OUT="build/windows/Odisea-Tech-Demo.exe" ;;
            macos) OUT="build/macos/Odisea-Tech-Demo.zip" ;;
            ios) OUT="build/ios/Odisea-Tech-Demo.ipa" ;;
            android) OUT="build/android/Odisea-Tech-Demo.apk" ;;
            html5) OUT="build/html5/index.html" ;;
          esac

          mkdir -p $(dirname "$OUT")

          # Godot 3.6 headless --export returns a non-zero exit even on benign
          # import warnings, so don't let it abort the step; verify success by
          # checking the artifact was actually written instead.
          # Use --export-debug for Android
          if [ "${{ matrix.platform }}" = "android" ]; then
            $G_BIN --no-window --export-debug "${{ matrix.preset }}" "$OUT" --headless || true
          else
            $G_BIN --no-window --export "${{ matrix.preset }}" "$OUT" --headless || true
          fi

          if [ ! -s "$OUT" ]; then
            echo "::error::Export failed — no artifact produced at $OUT"
            exit 1
          fi
          echo "Export OK: $OUT ($(du -h "$OUT" | cut -f1))"

      - name: Android Sign and Validate
        if: matrix.platform == 'android'
        run: |
          set -e
          APK="build/android/Odisea-Tech-Demo.apk"
          UNSIGNED="build/android/Odisea-Tech-Demo-unsigned.apk"
          ALIGNED="build/android/Odisea-Tech-Demo-aligned.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mv "$APK" "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks android/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$APK" "$ALIGNED"
          rm -f "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify "$APK"

      - name: HTML5 Post-process
        if: matrix.platform == 'html5'
        run: |
          python3 scripts/minimize_html_export.py build/html5/
          cp build_meta.js build/html5/build_meta.js

      - name: HTML5 Stage Netlify
        if: matrix.platform == 'html5'
        run: |
          mkdir -p build/netlify
          cp -a build/html5/* build/netlify/
          rm -f build/netlify/*.pck build/netlify/*.pck.gz build/netlify/*.wasm build/netlify/*.wasm.gz
          [ -f build/_headers ] && cp build/_headers build/netlify/_headers
          PCK_BYTES=$(stat -c%s build/html5/index.pck)
          WASM_BYTES=$(stat -c%s build/html5/index.wasm)
          TOTAL=$((PCK_BYTES + WASM_BYTES))
          sed -i "s/\$ODISEA_TOTAL_BYTES/${TOTAL}/g" build/netlify/index.html

      - name: HTML5 Stage Pages
        if: matrix.platform == 'html5'
        run: |
          mkdir -p build/pages/threads
          cp build/html5/index.pck build/html5/index.pck.gz build/pages/
          cp build/html5/index.wasm build/html5/index.wasm.gz build/pages/threads/

      - name: HTML5 Stage Vercel
        if: matrix.platform == 'html5'
        run: |
          # Vercel deploy for Safari/iOS: serves EVERYTHING same-origin (html, js,
          # threaded wasm, pck) with COEP require-corp (set in vercel.json), so the
          # page is cross-origin isolated and SharedArrayBuffer is available — which
          # the threaded engine needs and which Safari does NOT get under the main
          # site's COEP credentialless. Because assets are same-origin here, the
          # shell's GitHub Pages fetch interceptor must be neutralized: under
          # require-corp a cross-origin fetch to Pages (which sends no CORP) would be
          # blocked. We disable it by forcing the interceptor to pass through.
          mkdir -p build/vercel
          cp -a build/html5/* build/vercel/
          cp vercel.json build/vercel/vercel.json
          # Neutralize the Pages interceptor: inject an early pass-through at the top
          # of the window.fetch override so every asset resolves to its original
          # same-origin URL instead of being rewritten to GitHub Pages.
          sed -i 's#window.fetch = function(resource, init) {#window.fetch = function(resource, init) {\n\t\t\t\treturn originalFetch(resource, init); /* ODISEA_VERCEL_SAME_ORIGIN */#' build/vercel/index.html
          grep -q "ODISEA_VERCEL_SAME_ORIGIN" build/vercel/index.html || { echo "::error::Failed to neutralize Pages interceptor for Vercel build"; exit 1; }
          PCK_BYTES=$(stat -c%s build/html5/index.pck)
          WASM_BYTES=$(stat -c%s build/html5/index.wasm)
          TOTAL=$((PCK_BYTES + WASM_BYTES))
          sed -i "s/\$ODISEA_TOTAL_BYTES/${TOTAL}/g" build/vercel/index.html
          echo "Vercel stage: $(du -sh build/vercel | cut -f1)"

      - name: Upload Vercel artifact
        if: matrix.platform == 'html5'
        uses: actions/upload-artifact@v4
        with:
          name: vercel-build
          path: build/vercel/
          retention-days: 1

      - name: Package Artifact
        if: steps.ios_gate.outputs.skip_ios != 'true'
        run: |
          # version_slug (sin espacios/paréntesis) para que el nombre del asset
          # coincida con la URL del manifest y no lo sanitice GitHub. Para nightly el
          # slug ya incluye el sha (0.1.0-nightly+<sha>), así que NO se agrega -$SHA
          # otra vez (antes salía duplicado: ...+0e504e1-0e504e1).
          VERSION="${{ needs.prep.outputs.version_slug }}"
          PACKAGE="dist/${{ matrix.artifact_name }}-$VERSION.zip"
          mkdir -p dist

          # build_meta.json NO se copia suelto al paquete: ya va EMBEBIDO en el .pck
          # (está en el include_filter de todos los presets), y el runtime lo lee de
          # res://build_meta.json primero (UpdateManager/ANNAV2). Web usa build_meta.js
          # aparte. La copia suelta era redundante (macOS ya no la copiaba y andaba).

          if [ "${{ matrix.platform }}" = "html5" ]; then
            cd build/html5 && zip -r "../../$PACKAGE" . -x "_headers"
          elif [ "${{ matrix.platform }}" = "android" ]; then
            # APK se sube sin comprimir (ya es un zip firmado)
            PACKAGE="dist/${{ matrix.artifact_name }}-$VERSION.apk"
            cp build/android/Odisea-Tech-Demo.apk "$PACKAGE"
          elif [ "${{ matrix.platform }}" = "ios" ]; then
            cd build/ios && zip -r "../../$PACKAGE" .
          elif [ "${{ matrix.platform }}" = "macos" ]; then
             cp build/macos/Odisea-Tech-Demo.zip "$PACKAGE"
          else
            cd build && zip -r "../$PACKAGE" . -x "_headers" -x "netlify/*" -x "pages/*" -x "html5/*" -x "android/*" -x "ios/*"
          fi

      - name: Stage standalone .pck for in-app update (desktop)
        if: matrix.platform == 'linux_x64' || matrix.platform == 'linux_arm64' || matrix.platform == 'windows'
        run: |
          # El export desktop usa embed_pck=false, así que junto al ejecutable queda
          # un .pck suelto. El update in-app hace hot-swap de ESE .pck (chunkeable y
          # diffeable a futuro), NO del .zip (que es para instalación manual y cambia
          # entero con cualquier byte). Lo publicamos como asset aparte del release.
          VERSION="${{ needs.prep.outputs.version_slug }}"
          case "${{ matrix.platform }}" in
            linux_x64)   SRC="build/linux_x86_64" ;;
            linux_arm64) SRC="build/linux_arm64" ;;
            windows)     SRC="build/windows" ;;
          esac
          PCK=$(find "$SRC" -maxdepth 1 -name "*.pck" | head -n 1)
          if [ -z "$PCK" ]; then
            echo "::error::No standalone .pck found in $SRC (embed_pck debería ser false)"
            ls -la "$SRC" || true
            exit 1
          fi
          mkdir -p dist
          OUT="dist/${{ matrix.artifact_name }}-$VERSION.pck"
          cp "$PCK" "$OUT"
          # Publicar TAMBIÉN el .pck comprimido para el update in-app: el .pck no está
          # comprimido internamente (gzip ahorra ~71%, 123MB->36MB) y gzip+Range son
          # incompatibles, así que servimos un .gz pre-comprimido que el cliente baja
          # por chunks y descomprime. -n: no guardar nombre/mtime (gzip determinista).
          gzip -9 -n -c "$PCK" > "$OUT.gz"
          echo "Staged update .pck: $OUT ($(du -h "$OUT" | cut -f1)) + .gz ($(du -h "$OUT.gz" | cut -f1))"

      - name: Upload Artifact
        if: steps.ios_gate.outputs.skip_ios != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ needs.prep.outputs.version }}-${{ needs.prep.outputs.sha }}
          path: |
            dist/*.zip
            dist/*.apk
            dist/*.pck.gz

      - name: Upload Netlify artifact
        if: matrix.platform == 'html5'
        uses: actions/upload-artifact@v4
        with:
          name: netlify-build
          path: build/netlify/
          retention-days: 1

      - name: Upload Pages artifact
        if: matrix.platform == 'html5'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

      - name: Build Failure Notification
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prs.data[0].number,
                body: `❌ Build failed for platform **${{ matrix.platform }}** (${{ matrix.os }}) on commit ${sha}.`
              });
            } else if (context.payload.issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.payload.issue.number,
                body: `❌ Build failed for platform **${{ matrix.platform }}** (${{ matrix.os }}).`
              });
            }

  deploy-web:
    needs: [prep, export]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prep.result == 'success' && (needs.prep.outputs.ref_name == 'main' || needs.prep.outputs.is_dispatch == 'true') }}
    permissions:
      contents: read
      deployments: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Netlify artifact
        uses: actions/download-artifact@v4
        with:
          name: netlify-build
          path: netlify-build

      - name: Validate Netlify artifact
        run: |
          test -s netlify-build/index.html || { echo "::error::Missing Netlify index.html"; exit 1; }
          test -s netlify-build/index.js || { echo "::error::Missing Netlify Godot loader"; exit 1; }
          if find netlify-build -maxdepth 1 \( -name "*.pck" -o -name "*.pck.gz" -o -name "*.wasm" -o -name "*.wasm.gz" \) | grep -q .; then
            echo "::error::Netlify artifact contains heavy Godot assets that should be served from GitHub Pages"
            exit 1
          fi

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: netlify-build/
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from ${{ needs.prep.outputs.sha }}"
          netlify-config-path: ./netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-vercel:
    needs: [prep, export]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prep.result == 'success' && (needs.prep.outputs.ref_name == 'main' || needs.prep.outputs.is_dispatch == 'true') }}
    permissions:
      contents: read
      deployments: write
    environment:
      name: vercel-ios
      url: https://odisea-ios.vercel.app
    steps:
      - name: Download Vercel artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-build
          path: vercel-build

      - name: Validate Vercel artifact
        run: |
          # The Vercel deploy serves everything same-origin for cross-origin
          # isolation on Safari, so the threaded wasm + pck MUST be present here
          # (unlike the Netlify deploy, where they live on GitHub Pages).
          test -s vercel-build/index.html || { echo "::error::Missing Vercel index.html"; exit 1; }
          test -s vercel-build/index.wasm || { echo "::error::Missing Vercel index.wasm (threaded engine)"; exit 1; }
          test -s vercel-build/index.pck || { echo "::error::Missing Vercel index.pck"; exit 1; }
          test -s vercel-build/vercel.json || { echo "::error::Missing vercel.json"; exit 1; }
          grep -q "ODISEA_VERCEL_SAME_ORIGIN" vercel-build/index.html || { echo "::error::Pages interceptor not neutralized in Vercel index.html"; exit 1; }

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd vercel-build
          # Deploy the prebuilt static dir to production and alias to the stable
          # iOS host the main site redirects Safari/iPadOS traffic to.
          URL=$(vercel deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN" 2>&1 | grep -oE 'https://[a-z0-9._-]+\.vercel\.app' | tail -1)
          echo "Deployed: $URL"
          if [ -z "$URL" ]; then echo "::error::Vercel deploy produced no URL"; exit 1; fi
          vercel alias set "$URL" odisea-ios.vercel.app --token "$VERCEL_TOKEN" --scope sebastian-silvas-projects-8fed1460
          echo "Aliased to https://odisea-ios.vercel.app"

  manifests:
    needs: [prep, export]
    runs-on: ubuntu-latest
    # Generate signed manifests only for main (nightly) or release branches.
    # Forks don't have access to the signing secret and shouldn't publish manifests.
    if: |
      (needs.prep.outputs.ref_name == 'main' || needs.prep.outputs.ref_name == 'release' || needs.prep.outputs.is_dispatch == 'true') &&
      github.repository == 'icarito/Odisea'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.head_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts

      - name: Generate Signed Manifests
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # If the secret is missing, we skip signing but don't fail (unless on release branch)
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            if [ "${{ needs.prep.outputs.ref_name }}" = "release" ]; then
              echo "::error::UPDATE_SIGNING_KEY is missing for a release build!"
              exit 1
            fi
            echo "UPDATE_SIGNING_KEY is missing — skipping manifest generation."
            exit 0
          fi

          mkdir -p signed_manifests

          # Define platforms and their artifact names as seen in the 'export' job matrix
          # Format: platform_arch:artifact_pattern:output_platform:output_arch
          # OJO: el patrón de linux_x64 NO debe matchear el de ARM64
          # (Odisea-Tech-Demo-Linux-* incluiría Linux-ARM64-*). El find de abajo
          # excluye explícitamente ARM64 para el caso x64.
          PLATFORMS=(
            "linux_x64:Odisea-Tech-Demo-Linux-*:linux:x86_64"
            "linux_arm64:Odisea-Tech-Demo-Linux-ARM64-*:linux:arm64"
            "windows:Odisea-Tech-Demo-Windows-*:windows:x86_64"
            "macos:Odisea-Tech-Demo-macOS-*:macos:universal"
            "android:Odisea-Tech-Demo-Android-*:android:arm64"
            "html5:Odisea-Tech-Demo-Web-*:html5:wasm"
          )

          VERSION="${{ needs.prep.outputs.version }}"
          # build_seq (run_number monotónico), no github.run_id: debe coincidir con el
          # build-id inyectado en el juego (Inject build metadata) para que el server
          # haga bien la comparación de igualdad y el cliente la de release_sequence.
          BUILD_ID="${{ needs.prep.outputs.build_seq }}"
          CHANNEL="${{ needs.prep.outputs.channel }}"
          COMMIT="${{ needs.prep.outputs.head_sha }}"

          # base_url de descarga: debe apuntar al TAG real del release, no a $VERSION.
          # El nightly se publica siempre en el tag fijo "nightly" (el job 'nightly'
          # borra/recrea ese release); $VERSION además trae espacios/paréntesis y no
          # sirve como URL. Por eso antes el manifest tenía una URL de descarga rota.
          if [ "$CHANNEL" = "nightly" ]; then
            RELEASE_TAG="nightly"
          else
            RELEASE_TAG="$VERSION"
          fi
          ARTIFACT_BASE_URL="https://github.com/icarito/Odisea/releases/download/$RELEASE_TAG"

          # Extract public key for audit asset. Name matches expected format for
          # scripts/update_manifest.py verify: {key_id}.pub.pem
          KEY_ID="release-2026-a"
          echo "$UPDATE_SIGNING_KEY" > private.pem
          openssl rsa -in private.pem -pubout -out "$KEY_ID.pub.pem"
          rm private.pem

          for entry in "${PLATFORMS[@]}"; do
            IFS=":" read -r P_NAME P_PATTERN P_OUT P_ARCH <<< "$entry"

            # Find the directory for this artifact (artifact_name-version-sha).
            # Para linux_x64 excluir el dir de ARM64 (su patrón es un prefijo del de x64).
            if [ "$P_NAME" = "linux_x64" ]; then
              ART_DIR=$(find all_artifacts -maxdepth 1 -name "$P_PATTERN" ! -name "Odisea-Tech-Demo-Linux-ARM64-*" -type d | head -n 1)
            else
              ART_DIR=$(find all_artifacts -maxdepth 1 -name "$P_PATTERN" -type d | head -n 1)
            fi

            if [ -n "$ART_DIR" ]; then
              echo "Generating manifest for $P_NAME ($P_OUT/$P_ARCH) from $ART_DIR"
              python3 scripts/update_manifest.py generate \
                --artifacts-dir "$ART_DIR" \
                --output "signed_manifests/manifest-$P_OUT-$P_ARCH.json" \
                --key "$UPDATE_SIGNING_KEY" \
                --key-id "$KEY_ID" \
                --version "$VERSION" \
                --build-id "$BUILD_ID" \
                --channel "$CHANNEL" \
                --platform "$P_OUT" \
                --arch "$P_ARCH" \
                --commit "$COMMIT" \
                --base-url "$ARTIFACT_BASE_URL"
            else
              echo "Warning: No artifact found for $P_NAME matching $P_PATTERN"
            fi
          done

      - name: Upload Manifests Artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-manifests
          path: |
            signed_manifests/*.json
            *.pub.pem

  release:
    needs: [prep, export, manifests]
    runs-on: ubuntu-latest
    # Solo libera un release estable desde la rama 'release'. Un workflow_dispatch
    # NO publica release (publicaba un 0.1.0 indeseado); usar publish_prerelease=true
    # para un nightly manual, o pushear a 'release' para liberar de verdad.
    if: needs.prep.outputs.ref_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep.outputs.version }}
          files: |
            release_assets/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly:
    needs: [prep, export, manifests]
    runs-on: ubuntu-latest
    if: needs.prep.outputs.ref_name == 'main' || (needs.prep.outputs.is_dispatch == 'true' && needs.prep.outputs.publish_prerelease == 'true')
    # La fase de publicación NO debe ser cancelada a mitad por un run más nuevo
    # (cancel-in-progress del workflow). Con un concurrency propio SIN
    # cancel-in-progress, dos publicaciones se encolan (la nueva espera a que la
    # vieja termine) en vez de cortarse a la mitad. El orden binarios->manifest ya
    # la hace segura aunque se corte, pero encolar evita estados intermedios.
    concurrency:
      group: nightly-publish-${{ github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.head_sha }}
          fetch-depth: 50  # historial para el changelog del release

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: nightly_assets
          merge-multiple: true

      - name: Update Nightly Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="nightly"

          # Show all files for debugging
          echo "=== Files in nightly_assets ==="
          find nightly_assets -type f -print | sort
          echo "=== End of file listing ==="

          # Separar BINARIOS (zip/apk/pem) de MANIFESTS. El manifest es lo que el
          # server lee para decidir qué descargar, así que debe subirse SIEMPRE
          # DESPUÉS de los binarios: si no, hay una ventana (o un run cancelado por
          # cancel-in-progress) donde el manifest apunta a un .zip que aún no existe
          # -> el cliente baja 404. Por eso ya NO borramos+recreamos el release
          # (delete+create dejaba todo ausente entre medio); usamos upload --clobber.
          # Los .pck (target del update in-app) van con los binarios: el manifest
          # apunta a ellos, así que deben existir ANTES de subir el manifest.
          mapfile -t BIN_FILES < <(find nightly_assets -type f \( -name "*.zip" -o -name "*.apk" -o -name "*.pck" -o -name "*.pck.gz" -o -name "*.pem" \) -print | sort)
          mapfile -t MANIFEST_FILES < <(find nightly_assets -type f -name "manifest-*.json" -print | sort)
          if [ "${#BIN_FILES[@]}" -eq 0 ]; then
            echo "::error::No binary artifacts found in nightly_assets"
            find nightly_assets -maxdepth 3 -type f -print || true
            exit 1
          fi

          # Notas del release: changelog (commits desde el tag nightly anterior) +
          # artefactos. release_notes_url del manifest apunta acá, así que el botón
          # "ver cambios" del cliente muestra algo útil.
          echo "## Nightly $(date -u +'%Y-%m-%d %H:%M') UTC" > body.md
          echo "" >> body.md
          echo "Commit: \`${{ needs.prep.outputs.sha }}\`" >> body.md
          echo "" >> body.md
          echo "### Changes" >> body.md
          PREV_TAG_SHA=$(git rev-list -n 1 nightly 2>/dev/null || true)
          if [ -n "$PREV_TAG_SHA" ] && git merge-base --is-ancestor "$PREV_TAG_SHA" HEAD 2>/dev/null; then
            RANGE="$PREV_TAG_SHA..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          git log --pretty=format:'- %s (%h)' "$RANGE" 2>/dev/null | grep -viE '^\- (Merge |chore: bump|temp|wip)' | head -40 >> body.md || echo "- (sin cambios listables)" >> body.md
          echo "" >> body.md
          echo "" >> body.md
          echo "### Artifacts" >> body.md
          echo "| Artifact | Size |" >> body.md
          echo "|---|---|" >> body.md
          du -h "${BIN_FILES[@]}" "${MANIFEST_FILES[@]}" | awk '{n=split($2,a,"/"); print "| " a[n] " | " $1 " |"}' >> body.md

          # 1. Asegurar que el release existe (sin borrarlo). Si no existe, crearlo
          #    vacío; si existe, solo actualizar notas/target. No se borra para no
          #    dejar el release ausente entre delete y create.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file body.md --target "${{ needs.prep.outputs.head_sha }}" --prerelease
          else
            gh release create "$TAG" --title "Nightly Tip" --notes-file body.md \
              --prerelease --target "${{ needs.prep.outputs.head_sha }}"
          fi

          # 2. Subir PRIMERO los binarios (clobber reemplaza los del commit anterior).
          gh release upload "$TAG" "${BIN_FILES[@]}" --clobber

          # 3. Subir el manifest AL FINAL, ya con los binarios presentes. Recién acá
          #    el server puede servir un manifest cuyo download URL existe.
          if [ "${#MANIFEST_FILES[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${MANIFEST_FILES[@]}" --clobber
          fi

          # 4. Limpiar binarios de commits viejos que quedaron en el release (sus
          #    nombres llevan el sha, así que no los pisa el --clobber del actual).
          KEEP_SHA="${{ needs.prep.outputs.version_slug }}"
          for old in $(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null); do
            case "$old" in
              *.zip|*.apk|*.pck|*.pck.gz)
                if [[ "$old" != *"$KEEP_SHA"* ]]; then
                  echo "Removing stale asset: $old"
                  gh release delete-asset "$TAG" "$old" --yes || true
                fi
                ;;
            esac
          done

      - name: Discord Notification
        if: success()
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          REPO="${{ github.repository }}"
          URL="https://github.com/$REPO/releases/tag/nightly"
          MSG="🚀 **New Release available for $REPO: $VERSION**\nCheck it out at: $URL"
          if [ -n "${{ secrets.DISCORD_WEBHOOK }}" ]; then
            curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"$MSG\"}" "${{ secrets.DISCORD_WEBHOOK }}"
          fi
