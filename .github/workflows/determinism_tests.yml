name: Determinism Tests

on:
  workflow_dispatch:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths:
      - 'core_v2/tests/*.oys'
      - 'core_v2/tests/*.json'

concurrency:
  group: determinism-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 3.6.2-stable
  GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot

jobs:
  determinism-tests:
    name: Run Determinism Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.import
            ${{ github.workspace }}/.godot
          key: ${{ runner.os }}-godot-${{ hashFiles('**/project.godot') }}-${{ hashFiles('assets/**') }}
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}/${{ env.GODOT_VERSION }}/godot
          key: ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-determinism
          restore-keys: |
            ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-

      - name: Setup Godot 3.6.2
        run: |
          set -euo pipefail
          TARGET_DIR="${GODOT_CACHE_DIR}/${GODOT_VERSION}"
          TARGET_BIN="${TARGET_DIR}/godot"
          mkdir -p "$TARGET_DIR"
          if [ ! -x "$TARGET_BIN" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            unzip -q "Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            mv "Godot_v${GODOT_VERSION}_linux_headless.64" "$TARGET_BIN"
            chmod +x "$TARGET_BIN"
          fi
          sudo install -m 755 "$TARGET_BIN" /usr/local/bin/godot

      - name: Import Resources
        run: |
          echo "Importing Godot resources..."
          /usr/local/bin/godot --path . -e --quit --headless 2>&1 | head -30

      - name: Run Determinism Tests
        env:
          GODOT_BIN: /usr/local/bin/godot
        run: |
          mkdir -p reports
          echo "Running determinism tests with 60s timeout per test"
          echo "Issue #64: Some tests may hang or fail in CI"
          passed=0
          failed=0
          for oys_file in core_v2/tests/*.oys; do
            oys_name=$(basename "$oys_file" .oys)
            echo "Running: $oys_name"
            if timeout 60 ./runtest.sh --oys "$oys_name" > "reports/${oys_name}.log" 2>&1; then
              if grep -q "✅ Test OYS" "reports/${oys_name}.log" 2>/dev/null; then
                echo "✅ $oys_name"
                passed=$((passed + 1))
              else
                echo "❌ $oys_name (no success)"
                failed=$((failed + 1))
              fi
            else
              echo "❌ $oys_name (timeout/fail)"
              failed=$((failed + 1))
            fi
          done
          echo ""
          echo "## Determinism Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed:** $passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed/Timed out:** $failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for log in reports/*.log; do
            if [ -f "$log" ]; then
              name=$(basename "$log" .log)
              if grep -q "✅ Test OYS" "$log" 2>/dev/null; then
                echo "- ✅ $name" >> $GITHUB_STEP_SUMMARY
              else
                echo "- ❌ $name" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
          echo ""
          echo "Determinism tests: $passed passed, $failed failed/timed out"
