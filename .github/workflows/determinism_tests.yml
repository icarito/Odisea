name: Determinism Tests

on:
  workflow_dispatch:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths:
      - 'core_v2/tests/*.oys'
      - 'core_v2/tests/*.json'

concurrency:
  group: determinism-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 3.6.2-stable
  GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot

jobs:
  determinism-tests:
    name: Run Determinism Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.import
            ${{ github.workspace }}/.godot
          key: ${{ runner.os }}-godot-v3-${{ hashFiles('**/project.godot') }}-${{ hashFiles('assets/**', 'textures/**', 'models/**', 'core_v2/audio/**', 'core_v2/actors/**', 'core_v2/components/**', 'core_v2/props/**', 'core_v2/levels/**') }}
          restore-keys: |
            ${{ runner.os }}-godot-v3-
            ${{ runner.os }}-godot-

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}/${{ env.GODOT_VERSION }}/godot
          key: ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-determinism
          restore-keys: |
            ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-

      - name: Setup Godot 3.6.2
        run: |
          set -euo pipefail
          TARGET_DIR="${GODOT_CACHE_DIR}/${GODOT_VERSION}"
          TARGET_BIN="${TARGET_DIR}/godot"
          mkdir -p "$TARGET_DIR"
          if [ ! -x "$TARGET_BIN" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            unzip -q "Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            mv "Godot_v${GODOT_VERSION}_linux_headless.64" "$TARGET_BIN"
            chmod +x "$TARGET_BIN"
          fi
          sudo install -m 755 "$TARGET_BIN" /usr/local/bin/godot

      - name: Clean Godot import caches
        run: |
          set -euo pipefail
          rm -rf .godot/imported
          mkdir -p .import
          find .import -mindepth 1 -maxdepth 1 -type f -delete || true

      - name: Disable editor plugins for CI import
        run: |
          set -euo pipefail
          cp project.godot project.godot.ci.bak
          awk '
            BEGIN { in_editor_plugins = 0 }
            /^\[editor_plugins\]$/ { in_editor_plugins = 1; print; next }
            in_editor_plugins == 1 && /^enabled=/ {
              print "enabled=PoolStringArray( )"
              in_editor_plugins = 0
              next
            }
            { print }
          ' project.godot.ci.bak > project.godot
          echo "Editor plugins disabled for CI import pass."

      - name: Import + Smoke (self-healing)
        run: |
          set -euo pipefail
          mkdir -p reports

          import_once() {
            local log_file="$1"
            set +e
            timeout 600s /usr/local/bin/godot --path . -e --headless --no-window --audio-driver Dummy 2>&1 | tee "$log_file"
            local godot_rc="${PIPESTATUS[0]}"
            set -e
            if [ "$godot_rc" -eq 124 ]; then
              echo "Godot import timed out before completing imports."
              return 1
            fi
            if [ "$godot_rc" -ne 0 ]; then
              echo "Godot import command failed with exit code $godot_rc"
              return "$godot_rc"
            fi
            return 0
          }

          smoke_once() {
            local log_file="$1"
            set +e
            timeout 180s /usr/local/bin/godot --headless --no-window --audio-driver Dummy -s tests/ci_resource_smoke.gd 2>&1 | tee "$log_file"
            local smoke_rc="${PIPESTATUS[0]}"
            set -e
            if [ "$smoke_rc" -ne 0 ] && [ "$smoke_rc" -ne 124 ]; then
              echo "Resource smoke failed with exit code $smoke_rc"
              return "$smoke_rc"
            fi
            if [ "$smoke_rc" -eq 124 ]; then
              echo "Resource smoke timed out."
              return 1
            fi
            if grep -q "\[CI_SMOKE\] Missing resources count:" "$log_file"; then
              return 1
            fi
            if grep -E -q "SCRIPT ERROR:|Parse Error:|referenced nonexistent resource|No loader found for resource|Failed loading resource:" "$log_file"; then
              return 1
            fi
            return 0
          }

          if ! import_once reports/import_resources_determinism.log || ! smoke_once reports/resource_smoke_determinism.log; then
            echo "Import/smoke failed on first pass. Retrying smoke once..."
            smoke_once reports/resource_smoke_determinism_retry.log
          fi

      - name: Run Determinism Tests
        env:
          GODOT_BIN: /usr/local/bin/godot
        run: |
          mkdir -p reports
          echo "Running determinism tests with 60s timeout per test"
          echo "Issue #64: Some tests may hang or fail in CI"
          passed=0
          failed=0
          timed_out=0
          last_test=""
          failed_cases=""
          timeout_cases=""
          for oys_file in core_v2/tests/*.oys; do
            oys_name=$(basename "$oys_file" .oys)
            last_test="$oys_name"
            echo "Running: $oys_name"
            if timeout 60 ./runtest.sh --oys "$oys_name" > "reports/${oys_name}.log" 2>&1; then
              if grep -q "✅ Test OYS" "reports/${oys_name}.log" 2>/dev/null; then
                echo "✅ $oys_name"
                passed=$((passed + 1))
              else
                echo "❌ $oys_name (no success)"
                failed=$((failed + 1))
                failed_cases="${failed_cases}\n- ${oys_name} (no success marker)"
              fi
            else
              exit_code=$?
              if [ "$exit_code" -eq 124 ]; then
                echo "⏱️ $oys_name (timeout)"
                timed_out=$((timed_out + 1))
                timeout_cases="${timeout_cases}\n- ${oys_name}"
              else
                echo "❌ $oys_name (exit $exit_code)"
                failed=$((failed + 1))
                failed_cases="${failed_cases}\n- ${oys_name} (exit $exit_code)"
              fi
            fi
          done
          echo ""
          echo "## Determinism Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed:** $passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed:** $failed" >> $GITHUB_STEP_SUMMARY
          echo "- **Timed out:** $timed_out" >> $GITHUB_STEP_SUMMARY
          echo "- **Last executed test:** ${last_test:-none}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$failed_cases" ]; then
            echo "### Failed Cases" >> $GITHUB_STEP_SUMMARY
            printf "%b\n" "$failed_cases" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$timeout_cases" ]; then
            echo "### Timed Out Cases" >> $GITHUB_STEP_SUMMARY
            printf "%b\n" "$timeout_cases" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          for log in reports/*.log; do
            if [ -f "$log" ]; then
              name=$(basename "$log" .log)
              if grep -q "✅ Test OYS" "$log" 2>/dev/null; then
                echo "- ✅ $name" >> $GITHUB_STEP_SUMMARY
              else
                echo "- ❌ $name" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
          echo ""
          echo "Determinism tests: $passed passed, $failed failed, $timed_out timed out"
