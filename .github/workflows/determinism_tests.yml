name: Determinism Tests

on:
  workflow_dispatch:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths:
      - 'core_v2/tests/*.oys'
      - 'core_v2/tests/*.json'

concurrency:
  group: determinism-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 3.6.2-stable
  GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANNA_V2_NO_CENTRAL: "1"

jobs:
  determinism-tests:
    name: Run Determinism Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.import
            ${{ github.workspace }}/.godot
          # Key estable, alineada con export_all.yml: hashea solo project.godot y los
          # manifests *.import (trackeados en git), NO el contenido generado de
          # .import/** ni los assets crudos (textures/models/...). Esos cambiaban con
          # cualquier PNG y por incluir output generado provocaban cache MISS casi
          # siempre -> re-import de minutos. Con esta key el hit es frecuente (~4s).
          key: ${{ runner.os }}-godot-v4-${{ hashFiles('**/project.godot') }}-${{ hashFiles('**/*.import') }}
          restore-keys: |
            ${{ runner.os }}-godot-v4-${{ hashFiles('**/project.godot') }}-
            ${{ runner.os }}-godot-v4-
            ${{ runner.os }}-godot-v3-
            ${{ runner.os }}-godot-

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_CACHE_DIR }}/${{ env.GODOT_VERSION }}/godot
          key: ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-determinism
          restore-keys: |
            ${{ runner.os }}-godot-bin-${{ env.GODOT_VERSION }}-

      - name: Setup Godot 3.6.2
        run: |
          set -euo pipefail
          TARGET_DIR="${GODOT_CACHE_DIR}/${GODOT_VERSION}"
          TARGET_BIN="${TARGET_DIR}/godot"
          mkdir -p "$TARGET_DIR"
          if [ ! -x "$TARGET_BIN" ]; then
            wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            unzip -q "Godot_v${GODOT_VERSION}_linux_headless.64.zip"
            mv "Godot_v${GODOT_VERSION}_linux_headless.64" "$TARGET_BIN"
            chmod +x "$TARGET_BIN"
          fi
          sudo install -m 755 "$TARGET_BIN" /usr/local/bin/godot

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-pytest.txt

      - name: Cache virtualenv
        id: venv_cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-pytest-v2-${{ hashFiles('requirements-pytest.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-pytest-v2-

      - name: Install/Repair Pytest venv
        run: |
          set -euo pipefail
          if [ ! -x .venv/bin/python ] || [ ! -x .venv/bin/pytest ] || ! .venv/bin/python -c "import sys" >/dev/null 2>&1; then
            rm -rf .venv
            python -m venv .venv
          fi
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements-pytest.txt

      - name: Validate tracked import manifests
        run: |
          set -euo pipefail
          python3 scripts/check_tracked_imports.py

      - name: Validate critical import artifacts
        run: |
          set -euo pipefail
          python3 scripts/check_critical_import_artifacts.py

      - name: Import + Smoke (self-healing)
        run: |
          set -euo pipefail
          scripts/godot_import_smoke.sh \
            --godot-bin /usr/local/bin/godot \
            --project-path . \
            --import-log reports/import_resources_determinism.log \
            --smoke-log reports/resource_smoke_determinism.log \
            --smoke-retry-log reports/resource_smoke_determinism_retry.log \
            --timeout-import 600 \
            --timeout-smoke 180 \
            --clean-cache 0 \
            --disable-editor-plugins 1 \
            --xvfb 0 \
            --force-software 0 \
            --import-mode auto \
            --allow-smoke-retry 1

      - name: Run Determinism Tests
        env:
          GODOT_BIN: /usr/local/bin/godot
          ODISEA_SKIP_PREFLIGHT: "1"
          ODISEA_FULL_DETERMINISM: "1"
          # Cap por test. Con 2 workers cada test tiene más CPU; 180s deja margen a
          # los render-dependientes (~45-50s) + PASS 2 incluso bajo contención.
          ODISEA_TEST_TIMEOUT_SEC: "180"
        run: |
          mkdir -p reports
          # El binario de Godot es el build _linux_headless, así que corre con
          # --no-window SIN xvfb. Antes el step iteraba los .oys en serie (un
          # arranque de Godot por test, ~4.5s fijos x34 + render por software),
          # lo que acercaba el job al timeout y a la cancelación diaria.
          #
          # Ahora delegamos en el runner pytest, que ejecuta cada caso de
          # determinismo como test independiente y los paraleliza con pytest-xdist
          # (-n auto). Medido local: serie 416s -> paralelo headless sin xvfb 154s.
          # El render-off por test (OYS_RENDER_DISABLED) ya lo aplica runtest.sh.
          #
          # Workers: -n auto (4) saturaba la CPU del runner (tests rápidos daban
          # rc=124 por thrash). -n 2 dio 0 timeouts (resultados correctos) pero la
          # suite necesita ~39min y se cancelaba al 88% con timeout-minutes=35.
          # Mantenemos -n 2 (probado sin thrash) y subimos el budget a 45min.
          echo "Running determinism tests in parallel (pytest-xdist -n 2, headless, no xvfb)"
          echo "Issue #64: algunos casos aún fallan por drift; ver docs/determinism_test_failures.md"
          set +e
          ./.venv/bin/pytest -p no:cacheprovider \
            tests/test_odisea_runner.py \
            --odisea-runner gdunit \
            -m "odisea_determinism" \
            --odisea-include-determinism \
            -n 2 \
            -p no:randomly \
            --junitxml=reports/determinism_junit.xml \
            -ra 2>&1 | tee reports/determinism_pytest.log
          pytest_rc="${PIPESTATUS[0]}"
          set -e

          # Resumen a partir del JUnit XML (robusto independiente del formato de consola).
          python3 - "$pytest_rc" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys, xml.etree.ElementTree as ET
          rc = sys.argv[1]
          path = "reports/determinism_junit.xml"
          try:
              root = ET.parse(path).getroot()
          except Exception as e:
              print(f"## Determinism Test Results\n\nNo se pudo leer el JUnit XML: {e} (pytest rc={rc})")
              sys.exit(0)
          suites = root.iter("testsuite")
          cases = list(root.iter("testcase"))
          total = len(cases)
          failed, errored, skipped = [], [], []
          for c in cases:
              name = c.get("name", "?")
              if c.find("failure") is not None:
                  failed.append(name)
              elif c.find("error") is not None:
                  errored.append(name)
              elif c.find("skipped") is not None:
                  skipped.append(name)
          passed = total - len(failed) - len(errored) - len(skipped)
          print("## Determinism Test Results\n")
          print(f"- **Passed:** {passed}")
          print(f"- **Failed:** {len(failed)}")
          print(f"- **Errored:** {len(errored)}")
          print(f"- **Skipped:** {len(skipped)}")
          print(f"- **Total:** {total}  (pytest rc={rc})\n")
          if failed or errored:
              print("### Failed / Errored Cases\n")
              for n in failed + errored:
                  print(f"- ❌ {n}")
              print()
          PY

          echo "Determinism pytest exit code: $pytest_rc"
