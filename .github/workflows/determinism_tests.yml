name: Determinism Tests

on:
  workflow_dispatch:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  # Se quitó el trigger `push: [main]` (autorizado por Sebastián): un merge a
  # main ya pasó por la corrida del PR y el nightly cubre la rama.
  pull_request:
    branches: [main]
    paths:
      - 'core_v2/**/*.gd'
      - 'core_v2/tests/*.oys'
      - 'core_v2/tests/*.json'
      - 'runtest.sh'
      - 'tests/**'
      - '.github/workflows/determinism_tests.yml'
      # Reusables: cambiarlos debe disparar el workflow (gap que ocultó #378).
      - '.github/workflows/_setup_godot.yml'
      - '.github/workflows/_validate_imports.yml'
      - '.github/workflows/_import_smoke.yml'

concurrency:
  group: determinism-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/godot
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANNA_V2_NO_CENTRAL: "1"

jobs:
  setup-godot:
    uses: ./.github/workflows/_setup_godot.yml
    with:
      cache_key_suffix: 'determinism'
      cache_import: true
      # Solo project.godot + *.import para key estable (alineado con export_all)
      import_cache_paths: '[]'

  validate-imports:
    needs: setup-godot
    uses: ./.github/workflows/_validate_imports.yml

  import-smoke:
    needs: [setup-godot, validate-imports]
    uses: ./.github/workflows/_import_smoke.yml
    with:
      godot_bin: ${{ needs.setup-godot.outputs.godot_bin }}
      clean_cache: '0'
      import_mode: 'auto'
      smoke_script: 'tests/ci_resource_smoke.gd'
      import_log: 'reports/import_resources_determinism.log'
      smoke_log: 'reports/resource_smoke_determinism.log'
      smoke_retry_log: 'reports/resource_smoke_determinism_retry.log'

  log-runner-cpu:
    needs: import-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Log runner CPU (para descartar/confirmar correlacion de hardware)
        run: |
          # test_push_clipping.oys da un drift bimodal (~0 o ~0.049) que se
          # reprodujo tambien en corridas locales aisladas en la MISMA maquina
          # (ver comentario en el .oys): es sensibilidad a condiciones
          # iniciales del solver de contacto/friccion de Box3D con 4 cajas, no
          # una diferencia de CPU entre runners. Este paso deja el modelo/flags
          # en el log de todos modos, por si aparece una correlacion real con
          # hardware que la muestra local no pudo ver.
          lscpu | head -20
          grep -m1 "model name" /proc/cpuinfo
          grep -o -m1 -E "avx512[a-z]*|fma|avx2" /proc/cpuinfo | sort -u | tr '\n' ' '; echo

  run-determinism-tests:
    needs: [import-smoke, log-runner-cpu]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_BIN: /usr/local/bin/godot
      ODISEA_SKIP_PREFLIGHT: "1"
      ODISEA_RUN_DETERMINISM: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Este job corre en un runner distinto al de setup-godot: restaurar el
      # binario desde la cache (misma key) e instalarlo. Fallback: descarga.
      - name: Restore Godot binary
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ci-cache/godot/box3d/godot
          key: ${{ runner.os }}-godot-box3d-${{ hashFiles('.github/box3d_release') }}
          restore-keys: |
            ${{ runner.os }}-godot-box3d-

      - name: Install Godot binary
        run: |
          set -euo pipefail
          DEST="${GODOT_BIN}"
          CACHED="${{ github.workspace }}/.ci-cache/godot/box3d/godot"
          if [ ! -x "$CACHED" ]; then
            BOX3D_RELEASE="$(cat .github/box3d_release)"
            mkdir -p "$(dirname "$CACHED")"
            curl -fSL -o "$CACHED" \
              "https://github.com/icarito/godot-box3d-3/releases/download/${BOX3D_RELEASE}/godot.box3d.linux.x86_64.headless"
            chmod +x "$CACHED"
          fi
          sudo install -m 755 "$CACHED" "$DEST"
          "$DEST" --version

      - name: Select the Box3D physics backend (serial solver for determinism)
        run: |
          set -euo pipefail
          # 3d/box3d_workers=1: los replays son deterministas solo con el solver
          # serial. Box3D arranca en cores/2 cuando no hay setting; aca se fuerza 1
          # para que la comparacion PASS 1 vs PASS 2 no dependa del paralelismo.
          printf '[physics]\n\n3d/physics_engine="Box3D"\n3d/box3d_workers=1\n' > override.cfg
          cat override.cfg

      - name: Run Determinism Tests
        run: |
          mkdir -p reports
          # One Godot process keeps imported scenes/resources warm across all OYS
          # cases. Each OYS still records and then replays its JSON (PASS 1 + PASS
          # 2); only process startup is shared.
          echo "Running full determinism suite in one headless Godot process"
          set -o pipefail
          ./runtest.sh --runner gdunit -a ./core_v2/tests/test_determinism_v2.gd \
            2>&1 | tee reports/determinism.log