name: Exportar APK (Android)

on:
  push:
    branches: [ "main" ]
    # Only rebuild the APK when game content/config changes — not on
    # dashboard/docs/CI-only edits.
    paths:
      - 'core_v2/**'
      - 'models/**'
      - 'assets/**'
      - 'scenes/**'
      - 'shaders/**'
      - 'textures/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/export_android.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (opcional, ej: v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  export-android:
    runs-on: ubuntu-latest
    name: Export Android APK
    container:
      image: barichello/godot-ci:3.6.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Debug Keystore
        run: |
          mkdir -p android
          keytool -genkey -v -keystore android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Android Export Templates
        run: |
          set -e
          # The container ships templates under export_templates/, but the
          # editor (running as $HOME, which may not be /root under Actions)
          # looks in $HOME/.local/share/godot/{export_,}templates. Copy them
          # into the current HOME under both names so whichever one Godot uses
          # is populated, then verify the Android templates are actually there.
          DEST_NEW="$HOME/.local/share/godot/export_templates/3.6.2.stable"
          DEST_OLD="$HOME/.local/share/godot/templates/3.6.2.stable"
          mkdir -p "$DEST_NEW" "$DEST_OLD"

          SRC=""
          for c in /root/.local/share/godot/export_templates/3.6.2.stable \
                   /root/.local/share/godot/templates/3.6.2.stable; do
            [ -d "$c" ] && SRC="$c" && break
          done
          if [ -z "$SRC" ]; then
            echo "::error::No export templates found in the container"; exit 1
          fi
          echo "Copying templates from $SRC"
          cp -a "$SRC"/. "$DEST_NEW"/
          cp -a "$SRC"/. "$DEST_OLD"/

          echo "Android templates present:"
          ls -la "$DEST_NEW" | grep -i android || { echo "::error::Android templates missing"; exit 1; }

      - name: Configure Godot Editor Settings
        run: |
          # Write editor settings into the HOME the export will actually use.
          JDK_PATH="/usr/lib/jvm/java-11-openjdk-amd64"
          if [ ! -d "$JDK_PATH" ]; then
            JDK_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          fi
          [ -d "$ANDROID_HOME" ] || { echo "::error::ANDROID_HOME is invalid: $ANDROID_HOME"; exit 1; }
          [ -d "$JDK_PATH" ] || { echo "::error::JDK path is invalid: $JDK_PATH"; exit 1; }

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-3.tres" << EOF
          [gd_resource type="EditorSettings" format=2]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JDK_PATH"
          EOF

      - name: Export to Android
        run: |
          set -e
          mkdir -p ports
          # All Qodot .map import artifacts are tracked in git, so the
          # .import/ cache is ready on checkout. Run a quick editor pass
          # to flush any remaining import queues before exporting.
          timeout 120 godot --no-window --editor --quit --path . 2>&1 || true

          # Debug export uses keystore/debug from export_presets.cfg
          # (res://android/debug.keystore, generated above). The release
          # keystore isn't configured, so a release export would fail signing.
          godot --no-window --export-debug "Android" ports/Odisea.apk 2>&1 || true

          if [ ! -s ports/Odisea.apk ]; then
            echo "::error::Android export produced no APK"
            exit 1
          fi
          echo "APK OK: $(du -h ports/Odisea.apk | cut -f1)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Odisea-Android-APK
          path: ports/Odisea.apk

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ports/Odisea.apk
          generate_release_notes: true
          draft: false
          prerelease: false
